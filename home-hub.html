<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Hub</title>
<style>
:root {
  /* Core palette */
  --navy:        #0D1B2A;
  --navy-mid:    #1A2F4A;
  --blue:        #1565C0;
  --blue-hover:  #0D47A1;
  --sky:         #29B6F6;
  --sky-bg:      #E1F5FE;
  --yellow:      #FFD600;
  --yellow-bg:   #FFFDE7;
  --white:       #FFFFFF;
  --bg:          #EEF4FB;
  --card-bg:     #FFFFFF;
  --border:      #C5D8EE;
  --text:        #0D1B2A;
  --text-muted:  #4A6B8A;
  --radius:      12px;
  --shadow:      0 1px 4px rgba(13,27,42,0.08), 0 2px 8px rgba(13,27,42,0.05);
  --shadow-md:   0 4px 16px rgba(13,27,42,0.13);
  --transition:  all 0.18s ease;

  /* User colors */
  --p-color:  #29B6F6;
  --p-bg:     #E1F5FE;
  --p-dark:   #0277BD;
  --m-color:  #FFD600;
  --m-bg:     #FFFDE7;
  --m-dark:   #F57F17;
  --shared-color: #1565C0;
  --shared-bg:    #DCEEFB;

  /* Header */
  --header-from: #0D1B2A;
  --header-to:   #1A3A5C;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* Header */
#header {
  background: linear-gradient(135deg, var(--header-from), var(--header-to));
  color: #fff;
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  height: 56px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(13,27,42,0.35);
}
#header h1 { font-size: 1.2rem; font-weight: 700; flex: 1; letter-spacing: -0.02em; }
.user-toggle { display: flex; gap: 4px; }
.user-btn {
  border: none;
  border-radius: 20px;
  padding: 5px 14px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  opacity: 0.6;
  background: rgba(255,255,255,0.15);
  color: #fff;
}
.user-btn.active-p { background: var(--p-color); opacity: 1; box-shadow: 0 0 0 2px rgba(255,255,255,0.4); }
.user-btn.active-m { background: var(--m-color); color: var(--navy); opacity: 1; box-shadow: 0 0 0 2px rgba(255,255,255,0.4); }
.settings-btn {
  background: rgba(255,255,255,0.15);
  border: none;
  border-radius: 8px;
  color: #fff;
  cursor: pointer;
  padding: 6px 10px;
  font-size: 1rem;
  transition: var(--transition);
}
.settings-btn:hover { background: rgba(255,255,255,0.25); }

/* Tabs */
#tabs {
  display: flex;
  background: #fff;
  border-bottom: 2px solid var(--border);
  position: sticky;
  top: 56px;
  z-index: 90;
  overflow-x: auto;
}
.tab-btn {
  flex: 1;
  min-width: 80px;
  border: none;
  background: none;
  padding: 12px 8px;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: var(--transition);
  white-space: nowrap;
}
.tab-btn.active { color: var(--yellow); border-bottom-color: var(--yellow); }
.tab-btn:hover:not(.active) { color: var(--text); background: var(--bg); }

/* Main content */
#main { max-width: 900px; margin: 0 auto; padding: 16px; }

/* Filters bar */
.filters-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
  align-items: center;
}
.filter-label { font-size: 0.78rem; font-weight: 600; color: var(--text-muted); }
.filter-select, .filter-btn-group { display: flex; gap: 4px; }
select.filter-select-input {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 10px;
  font-size: 0.82rem;
  background: #fff;
  color: var(--text);
  cursor: pointer;
}
.filt-btn {
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
  background: #fff;
  color: var(--text-muted);
  transition: var(--transition);
}
.filt-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }

/* Add button */
.add-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: linear-gradient(135deg, var(--navy-mid), var(--blue));
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 9px 18px;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  box-shadow: 0 2px 6px rgba(21,101,192,0.3);
  margin-bottom: 14px;
}
.add-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(21,101,192,0.35); }

/* Cards */
.cards-grid { display: flex; flex-direction: column; gap: 10px; }
.recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  transition: var(--transition);
  position: relative;
}
.card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.card.done { opacity: 0.55; }
.card.overdue { border-left: 3px solid #EF4444; }
.card-header { display: flex; align-items: flex-start; gap: 10px; }
.card-check {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid var(--border);
  flex-shrink: 0;
  cursor: pointer;
  margin-top: 2px;
  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
}
.card-check.checked { background: #22C55E; border-color: #22C55E; color: #fff; }
.card-title { font-weight: 600; font-size: 0.95rem; flex: 1; line-height: 1.3; }
.card-title.strikethrough { text-decoration: line-through; color: var(--text-muted); }
.card-meta { font-size: 0.78rem; color: var(--text-muted); margin-top: 5px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.card-notes { font-size: 0.82rem; color: var(--text-muted); margin-top: 5px; font-style: italic; line-height: 1.4; }
.card-actions { display: flex; gap: 6px; margin-top: 10px; justify-content: flex-end; }
.card-btn {
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 7px;
  padding: 4px 10px;
  font-size: 0.75rem;
  cursor: pointer;
  color: var(--text-muted);
  transition: var(--transition);
}
.card-btn:hover { background: var(--bg); color: var(--text); }
.card-btn.danger:hover { background: #FEE2E2; border-color: #FCA5A5; color: #DC2626; }

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  border-radius: 20px;
  padding: 2px 8px;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.badge-p { background: var(--p-bg); color: var(--p-dark); }
.badge-m { background: var(--m-bg); color: var(--m-dark); }
.badge-shared { background: var(--shared-bg); color: var(--blue); }
.badge-low { background: #F1F5F9; color: #475569; }
.badge-medium { background: #FEF3C7; color: #92400E; }
.badge-high { background: #FEE2E2; color: #991B1B; }
.badge-overdue { background: #FEE2E2; color: #991B1B; }
.badge-done-by { background: #DCFCE7; color: #166534; }
.tag-badge { border-radius: 20px; padding: 2px 8px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; display: inline-flex; align-items: center; }
.tag-keto { background: #FEF3C7; color: #92400E; }
.tag-vegan { background: #DCFCE7; color: #166534; }
.tag-highProtein { background: #DBEAFE; color: #1E40AF; }
.tag-vegetarian { background: #D1FAE5; color: #065F46; }
.tag-glutenFree { background: #FFEDD5; color: #9A3412; }
.tag-dairyFree { background: #F3E8FF; color: #6B21A8; }
.tag-lowCalorie { background: #CFFAFE; color: #155E75; }
.tag-lowHistamine { background: #E0E7FF; color: #3730A3; }
.tag-antiInflammatory { background: #FEF9C3; color: #854D0E; }
.tag-badge.active-filter { box-shadow: 0 0 0 2px currentColor; }
.badge-for-p { background: var(--p-bg); color: var(--p-dark); }
.badge-for-m { background: var(--m-bg); color: var(--m-dark); }

/* Empty state */
.empty-state {
  text-align: center;
  padding: 48px 16px;
  color: var(--text-muted);
}
.empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 10px; }
.empty-state p { font-size: 0.9rem; }

/* Modals */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(13,27,42,0.55);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  animation: fadeIn 0.15s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: #fff;
  border-radius: 16px;
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(13,27,42,0.25);
  animation: slideUp 0.2s ease;
}
.modal-lg { max-width: 680px; }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-header {
  padding: 20px 20px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-header h2 { font-size: 1.1rem; font-weight: 700; }
.modal-close {
  background: none;
  border: none;
  font-size: 1.3rem;
  cursor: pointer;
  color: var(--text-muted);
  border-radius: 6px;
  padding: 2px 6px;
  transition: var(--transition);
}
.modal-close:hover { background: var(--bg); color: var(--text); }
.modal-body { padding: 16px 20px 20px; }
.modal-tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 16px; }
.modal-tab {
  padding: 8px 18px;
  border: none;
  background: none;
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: var(--transition);
}
.modal-tab.active { color: var(--blue); border-bottom-color: var(--blue); }

/* Forms */
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.05em; }
.form-group input[type=text],
.form-group input[type=url],
.form-group input[type=password],
.form-group input[type=datetime-local],
.form-group input[type=date],
.form-group input[type=number],
.form-group select,
.form-group textarea {
  width: 100%;
  border: 1.5px solid var(--border);
  border-radius: 9px;
  padding: 9px 12px;
  font-size: 0.9rem;
  background: #fff;
  color: var(--text);
  transition: var(--transition);
  font-family: inherit;
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--sky);
  box-shadow: 0 0 0 3px rgba(41,182,246,0.15);
}
.form-group textarea { resize: vertical; min-height: 70px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
.btn-primary {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 9px;
  padding: 9px 20px;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
}
.btn-primary:hover { background: var(--blue-hover); }
.btn-secondary {
  background: #fff;
  color: var(--text);
  border: 1.5px solid var(--border);
  border-radius: 9px;
  padding: 9px 16px;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
}
.btn-secondary:hover { background: var(--bg); }
.btn-danger {
  background: #FEE2E2;
  color: #DC2626;
  border: none;
  border-radius: 9px;
  padding: 9px 16px;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
}
.owner-selector { display: flex; gap: 8px; }
.owner-opt {
  flex: 1;
  border: 2px solid var(--border);
  border-radius: 9px;
  padding: 7px;
  text-align: center;
  cursor: pointer;
  font-size: 0.82rem;
  font-weight: 600;
  transition: var(--transition);
  background: #fff;
}
.owner-opt.sel-p { border-color: var(--p-color); background: var(--p-bg); color: var(--p-dark); }
.owner-opt.sel-m { border-color: var(--m-color); background: var(--m-bg); color: var(--m-dark); }
.owner-opt.sel-shared { border-color: var(--shared-color); background: var(--shared-bg); color: var(--blue); }

/* Toggle tags */
.tags-toggle-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.tag-toggle-btn {
  border: 1.5px solid var(--border);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 0.75rem;
  font-weight: 700;
  cursor: pointer;
  background: #fff;
  color: var(--text-muted);
  transition: var(--transition);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.tag-toggle-btn.on.keto { background: #FEF3C7; color: #92400E; border-color: #F59E0B; }
.tag-toggle-btn.on.vegan { background: #DCFCE7; color: #166534; border-color: #22C55E; }
.tag-toggle-btn.on.highProtein { background: #DBEAFE; color: #1E40AF; border-color: #3B82F6; }
.tag-toggle-btn.on.vegetarian { background: #D1FAE5; color: #065F46; border-color: #10B981; }
.tag-toggle-btn.on.glutenFree { background: #FFEDD5; color: #9A3412; border-color: #F97316; }
.tag-toggle-btn.on.dairyFree { background: #F3E8FF; color: #6B21A8; border-color: #A855F7; }
.tag-toggle-btn.on.lowCalorie { background: #CFFAFE; color: #155E75; border-color: #06B6D4; }
.tag-toggle-btn.on.lowHistamine { background: #E0E7FF; color: #3730A3; border-color: #6366F1; }
.tag-toggle-btn.on.antiInflammatory { background: #FEF9C3; color: #854D0E; border-color: #EAB308; }

/* For P/M toggles */
.for-toggles { display: flex; gap: 10px; margin-top: 6px; }
.for-toggle-btn {
  flex: 1;
  border: 2px solid var(--border);
  border-radius: 9px;
  padding: 7px;
  text-align: center;
  cursor: pointer;
  font-size: 0.82rem;
  font-weight: 600;
  transition: var(--transition);
  background: #fff;
}
.for-toggle-btn.on-p { border-color: var(--p-color); background: var(--p-bg); color: var(--p-dark); }
.for-toggle-btn.on-m { border-color: var(--m-color); background: var(--m-bg); color: var(--m-dark); }

/* Recipe card */
.recipe-card { cursor: pointer; }
.recipe-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.recipe-title { font-size: 1rem; font-weight: 700; margin-bottom: 8px; line-height: 1.3; }
.recipe-macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 8px 0; background: var(--bg); border-radius: 8px; padding: 8px; }
.macro-item { text-align: center; }
.macro-val { font-size: 0.9rem; font-weight: 700; color: var(--text); }
.macro-lbl { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; }
.recipe-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }

/* Grocery */
.grocery-generate-btn {
  background: linear-gradient(135deg, var(--navy-mid), var(--blue));
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 9px 18px;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  box-shadow: 0 2px 6px rgba(21,101,192,0.3);
}
.grocery-generate-btn:hover { transform: translateY(-1px); }
.clear-purchased-btn {
  background: #fff;
  color: #DC2626;
  border: 1.5px solid #FCA5A5;
  border-radius: 10px;
  padding: 9px 14px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
}
.clear-purchased-btn:hover { background: #FEE2E2; }

/* Fullscreen overlay */
.fullscreen-overlay {
  position: fixed;
  inset: 0;
  background: #fff;
  z-index: 300;
  overflow-y: auto;
  animation: fadeIn 0.15s ease;
}
.fullscreen-header {
  background: linear-gradient(135deg, var(--header-from), var(--header-to));
  color: #fff;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 10;
}
.fullscreen-header h2 { font-size: 1.1rem; font-weight: 700; }
.fullscreen-body { max-width: 700px; margin: 0 auto; padding: 20px; }
.store-section { margin-bottom: 28px; }
.store-section h3 { font-size: 0.9rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; border-bottom: 2px solid var(--border); padding-bottom: 6px; margin-bottom: 12px; }
.grocery-list-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 9px; margin-bottom: 7px; }
.grocery-list-item.purchased { opacity: 0.45; }
.grocery-list-item.purchased .gli-name { text-decoration: line-through; }
.gli-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; transition: var(--transition); }
.gli-check.checked { background: #22C55E; border-color: #22C55E; color: #fff; }
.gli-name { flex: 1; font-weight: 600; font-size: 0.9rem; }
.gli-qty { font-size: 0.82rem; color: var(--text-muted); }

/* Who are you overlay */
#who-overlay {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, var(--header-from), var(--header-to));
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
}
.who-box {
  background: #fff;
  border-radius: 20px;
  padding: 36px 40px;
  text-align: center;
  max-width: 320px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}
.who-box h2 { font-size: 1.5rem; font-weight: 800; margin-bottom: 8px; }
.who-box p { color: var(--text-muted); margin-bottom: 28px; font-size: 0.9rem; }
.who-btns { display: flex; gap: 14px; }
.who-btn {
  flex: 1;
  border: none;
  border-radius: 14px;
  padding: 18px;
  font-size: 1.8rem;
  font-weight: 800;
  cursor: pointer;
  transition: var(--transition);
}
.who-btn:hover { transform: scale(1.05); }
.who-btn-p { background: var(--p-bg); color: var(--p-color); border: 3px solid var(--p-color); }
.who-btn-m { background: var(--m-bg); color: var(--m-dark); border: 3px solid var(--m-color); }

/* Loading spinner */
.spinner { display: inline-block; width: 22px; height: 22px; border: 3px solid rgba(41,182,246,0.2); border-top-color: var(--sky); border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-box { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 32px; color: var(--text-muted); font-size: 0.9rem; }

/* API key input */
.input-with-toggle { position: relative; }
.input-with-toggle input { padding-right: 44px; }
.show-hide-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 0.85rem; }

/* Recipe detail modal */
.recipe-detail-section { margin-bottom: 18px; }
.recipe-detail-section h3 { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
.ingredients-list, .procedure-list { padding-left: 18px; }
.ingredients-list li { font-size: 0.88rem; margin-bottom: 4px; line-height: 1.5; }
.procedure-list li { font-size: 0.88rem; margin-bottom: 8px; line-height: 1.5; }
.macros-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
.macros-table th { background: var(--bg); padding: 6px 10px; text-align: left; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
.macros-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); }
.macros-table tr:last-child td { border-bottom: none; }

/* Preview box */
.preview-box { background: var(--bg); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
.preview-box h3 { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
.preview-box .preview-note { font-size: 0.8rem; color: var(--text-muted); font-style: italic; }

/* Settings panel — fixed overlay, always in DOM */
#settings-panel {
  position: fixed;
  inset: 0;
  background: rgba(13,27,42,0.6);
  z-index: 250;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  animation: fadeIn 0.15s ease;
}

/* Print */
@media print {
  body * { display: none !important; }
  .fullscreen-overlay, .fullscreen-overlay * { display: block !important; }
  .fullscreen-header .print-btn, .fullscreen-header .close-fl-btn { display: none !important; }
  .gli-check { border: 2px solid #000 !important; background: none !important; }
  .gli-check.checked::after { content: '✓'; font-weight: bold; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #8EB4D4; border-radius: 3px; }

/* Recipe Builder */
.builder-table { width:100%; border-collapse:collapse; font-size:0.8rem; margin-top:10px; }
.builder-table th { background:var(--bg); color:var(--text-muted); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em; padding:5px 6px; text-align:right; border-bottom:2px solid var(--border); }
.builder-table th:first-child { text-align:left; }
.builder-table td { padding:5px 6px; border-bottom:1px solid var(--border); text-align:right; vertical-align:middle; }
.builder-table td:first-child { text-align:left; font-weight:600; }
.builder-table .totals-row td { background:var(--bg); font-weight:700; border-top:2px solid var(--border); color:var(--sky); }
.builder-table .serving-row td { background:rgba(41,182,246,0.05); font-weight:600; color:var(--text-muted); font-size:0.75rem; }
.builder-remove-btn { background:none; border:none; color:#ef4444; cursor:pointer; font-size:1rem; padding:0 4px; line-height:1; }
.builder-search-wrap { position:relative; }
.builder-suggestions { position:absolute; top:100%; left:0; right:0; background:var(--surface); border:1.5px solid var(--border); border-top:none; border-radius:0 0 8px 8px; max-height:180px; overflow-y:auto; z-index:100; box-shadow:var(--shadow-md); }
.builder-suggestion { padding:8px 12px; cursor:pointer; font-size:0.85rem; border-bottom:1px solid var(--border); }
.builder-suggestion:last-child { border-bottom:none; }
.builder-suggestion:hover, .builder-suggestion.active { background:var(--bg); color:var(--sky); }
.builder-row-unit { color:var(--text-muted); font-size:0.75rem; }
.net-carbs-note { font-size:0.75rem; color:var(--text-muted); margin-top:6px; }
.cost-total { font-size:0.88rem; font-weight:700; color:#22c55e; margin-top:6px; }
.ing-db-row { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); font-size:0.85rem; }
.ing-db-macros { display:flex; gap:8px; flex-wrap:wrap; font-size:0.75rem; color:var(--text-muted); }
.ing-db-macro-pill { background:var(--bg); border-radius:4px; padding:2px 6px; }

/* Responsive */
@media (max-width: 600px) {
  #header h1 { font-size: 1rem; }
  .form-row { grid-template-columns: 1fr; }
  .recipe-grid { grid-template-columns: 1fr; }
  .modal { max-height: 95vh; }
}
</style>
</head>

// ========== SYNC ==========
const SYNC_ITEM_TYPES = { reminders:'reminder', todos:'todo', groceryItems:'grocery', recipes:'recipe' };
let syncPollInterval = null;
let lastSyncTime = null;
let syncStatus = 'idle'; // 'idle'|'syncing'|'ok'|'error'

function isSyncEnabled() {
  return !!(state.supabaseUrl && state.supabaseKey);
}

function syncHeaders() {
  return {
    'apikey': state.supabaseKey,
    'Authorization': 'Bearer ' + state.supabaseKey,
    'Content-Type': 'application/json'
  };
}

function setSyncStatus(s) {
  syncStatus = s;
  renderSyncIndicator();
}

function renderSyncIndicator() {
  const el = document.getElementById('sync-indicator');
  if (!el) return;
  if (!isSyncEnabled()) { el.textContent = ''; return; }
  const labels = { syncing:'syncing...', ok:'synced ' + (lastSyncTime ? lastSyncTime.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : ''), error:'sync error', idle:'' };
  const colors = { syncing:'rgba(255,255,255,0.7)', ok:'rgba(255,255,255,0.7)', error:'#FFD600', idle:'' };
  el.textContent = labels[syncStatus] || '';
  el.style.color = colors[syncStatus] || '';
}

async function syncFromRemote() {
  if (!isSyncEnabled()) return;
  setSyncStatus('syncing');
  try {
    const resp = await fetch(state.supabaseUrl + '/rest/v1/hh_items?select=id,type,data&deleted=eq.false', {
      headers: syncHeaders()
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const rows = await resp.json();
    state.reminders   = rows.filter(r => r.type === 'reminder').map(r => r.data);
    state.todos        = rows.filter(r => r.type === 'todo').map(r => r.data);
    state.groceryItems = rows.filter(r => r.type === 'grocery').map(r => r.data);
    state.recipes      = rows.filter(r => r.type === 'recipe').map(r => r.data);
    const storeRows    = rows.filter(r => r.type === 'store');
    if (storeRows.length > 0) state.customStores = storeRows.map(r => r.data.name).filter(Boolean);
    saveLocalState();
    lastSyncTime = new Date();
    setSyncStatus('ok');
    render();
  } catch(e) {
    setSyncStatus('error');
    console.warn('Sync from remote failed:', e.message);
  }
}

async function pushItem(item, type) {
  if (!isSyncEnabled()) return;
  try {
    await fetch(state.supabaseUrl + '/rest/v1/hh_items', {
      method: 'POST',
      headers: { ...syncHeaders(), 'Prefer': 'resolution=merge-duplicates' },
      body: JSON.stringify({ id: item.id, type, data: item, deleted: false })
    });
    lastSyncTime = new Date();
    setSyncStatus('ok');
  } catch(e) {
    setSyncStatus('error');
    console.warn('Push item failed:', e.message);
  }
}

async function deleteRemoteItem(id) {
  if (!isSyncEnabled()) return;
  try {
    await fetch(state.supabaseUrl + '/rest/v1/hh_items?id=eq.' + encodeURIComponent(id), {
      method: 'PATCH',
      headers: syncHeaders(),
      body: JSON.stringify({ deleted: true })
    });
    setSyncStatus('ok');
  } catch(e) {
    setSyncStatus('error');
    console.warn('Remote delete failed:', e.message);
  }
}

async function testSyncConnection(url, key) {
  // Returns { ok, message }
  try {
    // First check credentials work at all
    const authResp = await fetch(url + '/rest/v1/', {
      headers: { 'apikey': key, 'Authorization': 'Bearer ' + key }
    });
    if (!authResp.ok) return { ok: false, message: 'Invalid URL or API key (HTTP ' + authResp.status + ')' };
    // Then check the table exists
    const tableResp = await fetch(url + '/rest/v1/hh_items?select=id&limit=1', {
      headers: { 'apikey': key, 'Authorization': 'Bearer ' + key }
    });
    if (!tableResp.ok) return { ok: false, message: 'Connected but table not found — run the SQL setup first' };
    return { ok: true, message: 'Connected! Save settings to start syncing.' };
  } catch(e) {
    return { ok: false, message: 'Network error — check your internet connection' };
  }
}

function startSyncPolling() {
  if (syncPollInterval) clearInterval(syncPollInterval);
  if (!isSyncEnabled()) return;
  syncFromRemote();
  syncPollInterval = setInterval(() => {
    if (!document.hidden) syncFromRemote();
  }, 30000);
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) state = { ...state, ...JSON.parse(raw) };
  } catch(e) {}
}
function saveLocalState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e) {}
}
function saveState() {
  saveLocalState();
  // Remote sync happens per-item via pushItem/deleteRemoteItem calls
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function formatDate(dt) {
  if (!dt) return '';
  const d = new Date(dt);
  if (isNaN(d)) return dt;
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
}
function formatDateTime(dt) {
  if (!dt) return '';
  const d = new Date(dt);
  if (isNaN(d)) return dt;
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric' }) + ' ' + d.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
}
function isOverdue(dt) {
  if (!dt) return false;
  return new Date(dt) < new Date();
}

function matchesOwnerFilter(item, filterVal) {
  const cu = state.currentUser;
  if (filterVal === 'mine') return item.owner === cu || item.owner === 'Shared';
  if (filterVal === 'shared') return item.owner === 'Shared';
  return true; // 'all'
}

function renderReminders() {
  let items = state.reminders.filter(r => matchesOwnerFilter(r, reminderFilters.owner));
  if (reminderFilters.status === 'active') items = items.filter(r => !r.done);
  else if (reminderFilters.status === 'done') items = items.filter(r => r.done);
  items.sort((a,b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    if (a.dueDate && b.dueDate) return new Date(a.dueDate) - new Date(b.dueDate);
    if (a.dueDate) return -1;
    if (b.dueDate) return 1;
    return 0;
  });
  let html = `
    <div class="filters-bar">
      <span class="filter-label">Owner:</span>
      <div class="filter-btn-group">

function saveTodo() {

    notes: document.getElementById('todo-notes').value.trim(),
    dueDate: document.getElementById('todo-due').value,
    priority: document.getElementById('todo-priority').value,
    owner: document.getElementById('todo-owner').value,

    doneBy: existing ? existing.doneBy : null,

  };

  else state.todos.push(obj);

}
function setGroceryFilter(k, v) { groceryFilters[k] = v; render(); }
function toggleGrocery(id) {

}
function toggleGroceryFromList(id) {

    const el = document.querySelector(`[data-grocery-id="${id}"]`);

}
function deleteGrocery(id) {

  saveState(); render(); deleteRemoteItem(id);
}
function clearPurchased() {

// ========== RECIPES ==========
const TAG_LABELS = {
  keto:'Keto', vegan:'Vegan', highProtein:'High-Protein', vegetarian:'Vegetarian',
  glutenFree:'Gluten-Free', dairyFree:'Dairy-Free', lowCalorie:'Low-Calorie',
  lowHistamine:'Low-Histamine', antiInflammatory:'Anti-Inflammatory'
};
const TAG_KEYS = Object.keys(TAG_LABELS);

function renderRecipes() {
  let items = state.recipes;
  if (recipeFilters.search) {
    const q = recipeFilters.search.toLowerCase();
    items = items.filter(r => r.title.toLowerCase().includes(q));
  }
  if (recipeFilters.tags.length > 0) {
    items = items.filter(r => recipeFilters.tags.every(tag => r.tags && r.tags[tag]));
  }
  const tagFilterHtml = TAG_KEYS.map(tag => {
    const on = recipeFilters.tags.includes(tag);
    return `<button class="tag-toggle-btn ${on?'on '+tag:''}" onclick="toggleRecipeTagFilter('${tag}')">${TAG_LABELS[tag]}</button>`;
  }).join('');
  let html = `
    <div class="filters-bar" style="flex-direction:column;align-items:flex-start">
      <div style="display:flex;gap:8px;align-items:center;width:100%;flex-wrap:wrap">
        <input type="text" style="border:1.5px solid var(--border);border-radius:9px;padding:7px 12px;font-size:0.88rem;flex:1;min-width:160px" placeholder="Search recipes..." value="${escapeHtml(recipeFilters.search)}" oninput="setRecipeSearch(this.value)">
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">
        <span class="filter-label" style="align-self:center">Filter by tag:</span>
        ${tagFilterHtml}
        ${recipeFilters.tags.length > 0 ? `<button class="filt-btn" onclick="clearRecipeTagFilters()">Clear</button>` : ''}
      </div>
    </div>
    <button class="btn-secondary" onclick="showIngredientDbModal()" style="padding:8px 14px;font-size:0.82rem">Ingredient DB</button>
    <button class="add-btn" onclick="openAddRecipe()">+ Add Recipe</button>
    <div class="recipe-grid">`;
  if (items.length === 0) {
    html += `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">&#127859;</div><p>No recipes yet. Add one!</p></div>`;
  } else {
    items.forEach(r => { html += renderRecipeCard(r); });
  }
  html += `</div>`;
  return html;
}
function renderRecipeCard(r) {
  const tags = r.tags || {};
  const tagBadges = TAG_KEYS.filter(t => tags[t]).map(t => {
    const isActive = recipeFilters.tags.includes(t);
    return `<span class="tag-badge tag-${t} ${isActive?'active-filter':''}">${TAG_LABELS[t]}</span>`;

  return `<div class="card recipe-card" onclick="openRecipeDetail('${r.id}')">

function toggleRecipeTagFilter(tag) {

function clearRecipeTagFilters() { recipeFilters.tags = []; render(); }
function setRecipeSearch(v) { recipeFilters.search = v; render(); }
function deleteRecipe(id) {

            ${sv !== origSv ? `<span style="font-size:0.78rem;color:var(--text-muted)">(original: ${origSv})</span>` : ''}
            ${r.estimatedCostTotal ? `<span style="margin-left:auto;font-size:0.85rem;color:#22c55e;font-weight:700">Est. cost: ${formatCost(r.estimatedCostTotal * mult)}</span>` : ''}

{"title":"Recipe name","servings":4,"ingredients":["1 cup flour","2 eggs"],"procedure":["Step 1: ...","Step 2: ..."],"macrosPerServing":{"calories":350,"protein":25,"carbs":40,"fat":12,"fiber":5,"netCarbs":35},"macrosTotal":{"calories":1400,"protein":100,"carbs":160,"fat":48,"fiber":20,"netCarbs":140},"tags":{"keto":false,"vegan":false,"highProtein":false,"vegetarian":false,"glutenFree":false,"dairyFree":false,"lowCalorie":false,"lowHistamine":false,"antiInflammatory":false},"notes":""}

const UNIT_DEFAULTS = { g:1, oz:28.35, lb:453.6, kg:1000, ml:1, l:1000, fl_oz:29.57, cup:240, tbsp:15, tsp:5, each:100, piece:100, slice:30, clove:3, scoop:30, can:400, bag:170, head:500, fillet:170, stick:113, half:100, medium:120, large:150, square:10 };

function getGrams(ing, amount, unit) {
  const u = unit.toLowerCase();
  const ingGrams = ing.units && ing.units[u] != null ? ing.units[u] : (UNIT_DEFAULTS[u] || 100);
  return amount * ingGrams;
}
function calcIngMacros(ing, grams) {
  const f = grams / 100;
  const carbs = round1(ing.carbs * f);
  const fiber = round1(ing.fiber * f);
  return {
    cal:     Math.round(ing.cal * f),
    fat:     round1(ing.fat * f),
    carbs,
    fiber,
    pro:     round1(ing.pro * f),
    netCarbs: round1(Math.max(0, carbs - fiber)),
    sugar:   round1((ing.sugar || 0) * f),
    sodium:  Math.round((ing.sodium || 0) * f),
    satFat:  round1((ing.satFat || 0) * f),
    cost:    Math.round(ing.cost * grams) / 100
  };
}
function round1(v) { return Math.round(v * 10) / 10; }
function formatCost(c) { return '$' + c.toFixed(2); }

// USDA FoodData Central search — returns ingredients in our format
const _usdaCache = {};
async function searchUSDA(q) {
  const key = state.usdaApiKey || 'DEMO_KEY';
  const cacheKey = q + '|' + key;
  if (_usdaCache[cacheKey]) return _usdaCache[cacheKey];
  try {
    const url = `https://api.nal.usda.gov/fdc/v1/foods/search?query=${encodeURIComponent(q)}&api_key=${encodeURIComponent(key)}&dataType=Foundation,SR%20Legacy&pageSize=12`;
    const resp = await fetch(url);
    if (!resp.ok) return [];
    const data = await resp.json();
    const results = (data.foods || []).map(f => {
      const n = id => f.foodNutrients?.find(x => x.nutrientId === id)?.value || 0;
      return {
        id: 'usda_' + f.fdcId,
        n: f.description.replace(/,?\s*(raw|cooked|whole|fresh)\s*$/i, '').trim().replace(/\b\w/g,c=>c.toUpperCase()),
        nFull: f.description,
        cal: Math.round(n(1008)), fat: round1(n(1004)), carbs: round1(n(1005)),
        fiber: round1(n(1079)), pro: round1(n(1003)),
        sugar: round1(n(2000)), sodium: Math.round(n(1093)), satFat: round1(n(1258)),
        cost: 0.20, units: { oz:28.35, cup:240, tbsp:15, tsp:5, g:1 }, isUsda: true
      };
    });
    _usdaCache[cacheKey] = results;
    return results;
  } catch { return []; }
}

function searchIngredients(q) {
  if (!q || q.length < 1) return [];
  const lower = q.toLowerCase();
  return getAllIngredients().filter(i => i.n.toLowerCase().includes(lower)).slice(0, 8);
}

// Allergen detection from ingredient list strings
const ALLERGENS = {
  gluten:    { label:'Gluten',    words:['wheat','flour','bread','pasta','barley','rye','oat','tortilla','cracker','cereal','biscuit'] },
  dairy:     { label:'Dairy',     words:['milk','butter','cream','cheese','yogurt','whey','lactose','cheddar','mozzarella','parmesan'] },
  eggs:      { label:'Eggs',      words:['egg','mayonnaise','mayo'] },
  nuts:      { label:'Tree Nuts', words:['almond','cashew','walnut','pecan','pistachio','hazelnut','macadamia','nut butter'] },
  peanuts:   { label:'Peanuts',   words:['peanut'] },
  soy:       { label:'Soy',       words:['soy','tofu','edamame','miso','tempeh'] },
  shellfish: { label:'Shellfish', words:['shrimp','crab','lobster','scallop','clam','oyster','mussel'] },
  fish:      { label:'Fish',      words:['salmon','tuna','tilapia','cod','halibut','sardine','anchovy','fish'] },
};
function detectAllergens(ingredients) {
  const text = (ingredients || []).join(' ').toLowerCase();
  return Object.entries(ALLERGENS)
    .filter(([,a]) => a.words.some(w => text.includes(w)))
    .map(([,a]) => a.label);
}

// Health grade A-F based on per-serving macros
function healthGrade(mp) {
  if (!mp || mp.calories === undefined) return null;
  let score = 70;
  score += Math.min(20, (mp.fiber || 0) * 2);
  score += Math.min(15, (mp.protein || 0) * 0.5);
  if (mp.calories > 700) score -= 15;
  else if (mp.calories > 500) score -= 8;
  if ((mp.satFat || 0) > 10) score -= 12;
  if ((mp.sugar || 0) > 30) score -= 12;
  if ((mp.sodium || 0) > 1200) score -= 10;
  if (mp.netCarbs > 60) score -= 8;
  score = Math.max(0, Math.min(100, score));
  if (score >= 85) return { grade:'A', color:'#22c55e' };
  if (score >= 70) return { grade:'B', color:'#84cc16' };
  if (score >= 55) return { grade:'C', color:'#eab308' };
  if (score >= 40) return { grade:'D', color:'#f97316' };
  return { grade:'F', color:'#ef4444' };
}

        <div class="modal-header"><h2>Add Custom Ingredient</h2><button class="modal-close" onclick="closeModal()">&#x2715;</button></div>
        <div class="modal-body">
          <p style="font-size:0.8rem;color:var(--text-muted);margin-bottom:12px">Enter values per 100g / 100ml.</p>
          <div class="form-row">
            <div class="form-group"><label>Name</label><input id="ci-name" type="text" placeholder="e.g. A2 Milk"></div>
            <div class="form-group"><label>Cost per 100g (USD)</label><input id="ci-cost" type="number" step="0.01" min="0" placeholder="0.15"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Calories (kcal)</label><input id="ci-cal" type="number" min="0" placeholder="61"></div>
            <div class="form-group"><label>Fat (g)</label><input id="ci-fat" type="number" min="0" step="0.1" placeholder="3.3"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Carbs (g)</label><input id="ci-carbs" type="number" min="0" step="0.1" placeholder="4.8"></div>
            <div class="form-group"><label>Fiber (g)</label><input id="ci-fiber" type="number" min="0" step="0.1" placeholder="0"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Protein (g)</label><input id="ci-pro" type="number" min="0" step="0.1" placeholder="3.2"></div>
            <div class="form-group"><label>Common units (optional)</label><input id="ci-units" type="text" placeholder='cup:244,tbsp:15'></div>
          </div>
          <div class="form-actions">
            <button class="btn-secondary" onclick="showIngredientDbModal()">Back</button>
            <button class="btn-primary" onclick="saveCustomIngredient()">Save Ingredient</button>
          </div>
        </div>
      </div>
    </div>`;
}

function saveCustomIngredient() {
  const name = document.getElementById('ci-name')?.value.trim();
  if (!name) { alert('Name is required'); return; }
  const unitsRaw = document.getElementById('ci-units')?.value.trim();
  let units = {};
  if (unitsRaw) {
    unitsRaw.split(',').forEach(pair => {
      const [u, g] = pair.split(':');
      if (u && g) units[u.trim()] = parseFloat(g.trim());
    });
  }
  const ing = {
    id: 'custom_' + uid(),
    n: name,
    cal:   parseFloat(document.getElementById('ci-cal')?.value)  || 0,
    fat:   parseFloat(document.getElementById('ci-fat')?.value)  || 0,
    carbs: parseFloat(document.getElementById('ci-carbs')?.value)|| 0,
    fiber: parseFloat(document.getElementById('ci-fiber')?.value)|| 0,
    pro:   parseFloat(document.getElementById('ci-pro')?.value)  || 0,
    cost:  parseFloat(document.getElementById('ci-cost')?.value) || 0,
    units
  };
  if (!state.customIngredients) state.customIngredients = [];
  state.customIngredients.push(ing);
  saveLocalState();
  showIngredientDbModal();
}

function deleteCustomIngredient(id) {
  if (!confirm('Remove this ingredient?')) return;
  state.customIngredients = (state.customIngredients || []).filter(i => i.id !== id);
  saveLocalState();
  showIngredientDbModal();
}

// Builder functions
function openRecipeBuilder() {
  builderIngredients = [];
  builderSearchQuery = '';
  builderSelectedIngId = null;
  showRecipeBuilderModal();
}

let _builderMeta = { prepTime:'', cookTime:'', cuisine:'', difficulty:'medium' };

function showRecipeBuilderModal() {
  const totals = calcBuilderTotals();
  const servings = parseInt(document.getElementById('builder-servings')?.value) || 1;
  const savedTitle = document.getElementById('builder-title')?.value || '';
  const savedProc  = document.getElementById('builder-procedure')?.value || '';
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-backdrop" onclick="closeModalOnBackdrop(event)">
      <div class="modal modal-lg">
        <div class="modal-header"><h2>&#127859; Build Recipe</h2><button class="modal-close" onclick="closeModal()">&#x2715;</button></div>
        <div class="modal-body">
          <div class="form-row" style="margin-bottom:6px">
            <div class="form-group" style="flex:2"><label>Recipe Title</label><input id="builder-title" type="text" placeholder="e.g. Chocolate Protein Shake" value="${escapeHtml(savedTitle)}"></div>
            <div class="form-group" style="max-width:100px"><label>Servings</label><input id="builder-servings" type="number" min="1" value="${servings}" oninput="refreshBuilderTotals()"></div>
          </div>
          <div class="form-row" style="margin-bottom:10px">
            <div class="form-group"><label>Prep Time</label><input id="builder-prep" type="text" placeholder="e.g. 10 min" value="${escapeHtml(_builderMeta.prepTime)}"></div>
            <div class="form-group"><label>Cook Time</label><input id="builder-cook" type="text" placeholder="e.g. 30 min" value="${escapeHtml(_builderMeta.cookTime)}"></div>
            <div class="form-group"><label>Cuisine</label><input id="builder-cuisine" type="text" placeholder="e.g. American" value="${escapeHtml(_builderMeta.cuisine)}"></div>
            <div class="form-group"><label>Difficulty</label>
              <select id="builder-difficulty">
                <option value="easy" ${_builderMeta.difficulty==='easy'?'selected':''}>Easy</option>
                <option value="medium" ${_builderMeta.difficulty==='medium'?'selected':''}>Medium</option>
                <option value="hard" ${_builderMeta.difficulty==='hard'?'selected':''}>Hard</option>
              </select>
            </div>
          </div>
          <div style="font-size:0.8rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px">Add Ingredient
            <span style="font-weight:400;text-transform:none;font-size:0.75rem;margin-left:8px">${state.usdaApiKey ? '&#10003; USDA live search active' : '&#128196; Add USDA key in Settings for 300K+ foods'}</span>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px">
            <div class="builder-search-wrap" style="flex:2;min-width:160px">
              <input id="builder-search" type="text" placeholder="Type to search food..." value="${escapeHtml(builderSearchQuery)}"
                oninput="onBuilderSearch(this.value)" autocomplete="off" style="width:100%">
              <div id="builder-suggestions" class="builder-suggestions" style="display:none"></div>
            </div>
            <div class="form-group" style="flex:0 0 75px;margin:0"><label style="font-size:0.78rem">Amount</label><input id="builder-amount" type="number" min="0.1" step="0.1" value="1" style="width:100%"></div>
            <div class="form-group" style="flex:0 0 90px;margin:0"><label style="font-size:0.78rem">Unit</label>
              <select id="builder-unit" style="width:100%">
                <option value="g">g</option><option value="oz">oz</option><option value="lb">lb</option>
                <option value="cup" selected>cup</option><option value="tbsp">tbsp</option><option value="tsp">tsp</option>
                <option value="ml">ml</option><option value="fl_oz">fl oz</option><option value="each">each</option>
                <option value="slice">slice</option><option value="clove">clove</option><option value="medium">medium</option>
                <option value="scoop">scoop</option><option value="can">can</option><option value="stalk">stalk</option>
              </select>
            </div>
            <button class="btn-primary" style="padding:8px 16px;margin-bottom:1px" onclick="addToBuilder()">+ Add</button>
          </div>
          ${renderBuilderTable(totals, servings)}
          <div style="margin-top:14px">
            <div style="font-size:0.8rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px">Procedure (optional)</div>
            <textarea id="builder-procedure" style="min-height:80px;width:100%;box-sizing:border-box" placeholder="Add steps separated by new lines...">${escapeHtml(savedProc)}</textarea>
          </div>
          <div class="form-actions">
            <button class="btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn-primary" onclick="saveBuilderRecipe()">Save Recipe</button>
          </div>
        </div>
      </div>
    </div>`;
}

function renderBuilderTable(totals, servings) {
  if (!builderIngredients.length) return `<div style="text-align:center;color:var(--text-muted);padding:16px;font-size:0.85rem">Search and add ingredients above to start building.</div>`;
  const rows = builderIngredients.map((bi, idx) => `
    <tr>
      <td>${escapeHtml(bi.name)}<div class="builder-row-unit">${bi.amount} ${bi.unit}</div></td>
      <td>${bi.cal}</td><td>${bi.fat}g</td>
      <td>${bi.carbs}g</td><td>${bi.fiber}g</td>
      <td style="font-weight:600;color:var(--sky)">${bi.netCarbs}g</td>
      <td>${bi.pro}g</td>
      <td style="color:var(--text-muted);font-size:0.78rem">${bi.sugar||0}g</td>
      <td style="color:var(--text-muted);font-size:0.78rem">${bi.sodium||0}mg</td>
      <td style="color:#22c55e">${formatCost(bi.cost)}</td>
      <td><button class="builder-remove-btn" onclick="removeFromBuilder(${idx})">&#x2715;</button></td>
    </tr>`).join('');
  const sv = Math.max(1, servings);
  const perRow = totals ? `
    <tr class="serving-row">
      <td>Per serving (÷${sv})</td>
      <td>${Math.round(totals.cal/sv)}</td><td>${round1(totals.fat/sv)}g</td>
      <td>${round1(totals.carbs/sv)}g</td><td>${round1(totals.fiber/sv)}g</td>
      <td style="font-weight:600;color:var(--sky)">${round1(totals.netCarbs/sv)}g</td>
      <td>${round1(totals.pro/sv)}g</td>
      <td style="font-size:0.78rem">${round1((totals.sugar||0)/sv)}g</td>
      <td style="font-size:0.78rem">${Math.round((totals.sodium||0)/sv)}mg</td>
      <td>${formatCost(totals.cost/sv)}</td><td></td>
    </tr>` : '';
  return `<div style="overflow-x:auto">
    <table class="builder-table">
      <thead><tr><th>Ingredient</th><th>Cal</th><th>Fat</th><th>Carbs</th><th>Fiber</th><th>Net Carbs</th><th>Protein</th><th style="color:var(--text-muted)">Sugar</th><th style="color:var(--text-muted)">Sodium</th><th>Cost</th><th></th></tr></thead>
      <tbody>
        ${rows}
        <tr class="totals-row">
          <td>TOTAL</td>
          <td>${totals.cal}</td><td>${totals.fat}g</td>
          <td>${totals.carbs}g</td><td>${totals.fiber}g</td>
          <td>${totals.netCarbs}g</td><td>${totals.pro}g</td>
          <td style="font-size:0.78rem">${totals.sugar||0}g</td>
          <td style="font-size:0.78rem">${totals.sodium||0}mg</td>
          <td>${formatCost(totals.cost)}</td><td></td>
        </tr>
        ${perRow}
      </tbody>
    </table>
  </div>
  <p class="net-carbs-note">Net Carbs = Carbs − Fiber. Sugar &amp; Sodium available for USDA foods and custom entries.</p>`;
}

function calcBuilderTotals() {
  if (!builderIngredients.length) return { cal:0, fat:0, carbs:0, fiber:0, pro:0, netCarbs:0, sugar:0, sodium:0, cost:0 };
  return builderIngredients.reduce((acc, bi) => ({
    cal:     acc.cal     + bi.cal,
    fat:     round1(acc.fat     + bi.fat),
    carbs:   round1(acc.carbs   + bi.carbs),
    fiber:   round1(acc.fiber   + bi.fiber),
    pro:     round1(acc.pro     + bi.pro),
    netCarbs:round1(acc.netCarbs + bi.netCarbs),
    sugar:   round1((acc.sugar||0) + (bi.sugar||0)),
    sodium:  Math.round((acc.sodium||0) + (bi.sodium||0)),
    cost:    Math.round((acc.cost + bi.cost) * 100) / 100
  }), { cal:0, fat:0, carbs:0, fiber:0, pro:0, netCarbs:0, sugar:0, sodium:0, cost:0 });
}

async function onBuilderSearch(q) {
  builderSearchQuery = q;
  builderSelectedIngId = null;
  const box = document.getElementById('builder-suggestions');
  if (!box) return;
  if (!q || q.length < 2) { box.style.display = 'none'; return; }
  const local = searchIngredients(q);
  box.innerHTML = (local.length ? local.map(i => `<div class="builder-suggestion" onclick="selectBuilderIng('${i.id}','${escapeHtml(i.n)}')">${escapeHtml(i.n)}</div>`).join('') : '') +
    `<div class="builder-suggestion" style="color:var(--text-muted);font-style:italic;cursor:default;font-size:0.78rem">&#128269; Searching USDA database...</div>`;
  box.style.display = 'block';
  // Add USDA results asynchronously
  const usda = await searchUSDA(q);
  if (!document.getElementById('builder-search') || document.getElementById('builder-search').value !== q) return;
  const allResults = [
    ...local,
    ...usda.filter(u => !local.find(l => l.n.toLowerCase() === u.n.toLowerCase()))
  ];
  if (!allResults.length) { box.style.display = 'none'; return; }
  box.innerHTML = allResults.map(i => {
    const tag = i.isUsda ? `<span style="font-size:0.68rem;background:rgba(41,182,246,0.15);color:var(--sky);border-radius:3px;padding:1px 4px;margin-left:4px">USDA</span>` : '';
    return `<div class="builder-suggestion" onclick="selectBuilderIngFull('${i.id}',${JSON.stringify(i).replace(/'/g,"\\'")})">${escapeHtml(i.n)}${tag}</div>`;
  }).join('');
  box.style.display = 'block';
}

function selectBuilderIngFull(id, ingObj) {
  // Cache USDA ingredient so getIngById can find it
  if (ingObj.isUsda && !getAllIngredients().find(x => x.id === id)) {
    if (!state.customIngredients) state.customIngredients = [];
    state.customIngredients.push(ingObj);
  }
  selectBuilderIng(id, ingObj.n);
}

function selectBuilderIng(id, name) {
  builderSelectedIngId = id;
  const si = document.getElementById('builder-search');
  if (si) si.value = name;
  const box = document.getElementById('builder-suggestions');
  if (box) box.style.display = 'none';
}

function _saveBuilderFormState() {
  _builderMeta.prepTime   = document.getElementById('builder-prep')?.value || _builderMeta.prepTime;
  _builderMeta.cookTime   = document.getElementById('builder-cook')?.value || _builderMeta.cookTime;
  _builderMeta.cuisine    = document.getElementById('builder-cuisine')?.value || _builderMeta.cuisine;
  _builderMeta.difficulty = document.getElementById('builder-difficulty')?.value || _builderMeta.difficulty;
}

function addToBuilder() {
  const ingId = builderSelectedIngId;
  if (!ingId) { alert('Please select an ingredient from the dropdown.'); return; }
  const ing = getIngById(ingId);
  if (!ing) return;
  const amount = parseFloat(document.getElementById('builder-amount')?.value) || 1;
  const unit   = document.getElementById('builder-unit')?.value || 'g';
  const grams  = getGrams(ing, amount, unit);
  const m      = calcIngMacros(ing, grams);
  builderIngredients.push({ ingId, name: ing.n, amount, unit, grams, ...m });
  builderSelectedIngId = null;
  builderSearchQuery = '';
  _saveBuilderFormState();
  showRecipeBuilderModal();
}

function removeFromBuilder(idx) {
  _saveBuilderFormState();
  builderIngredients.splice(idx, 1);
  showRecipeBuilderModal();
}

function refreshBuilderTotals() {
  // Lightweight re-render of just the table area without resetting inputs
  const totals = calcBuilderTotals();
  const sv = parseInt(document.getElementById('builder-servings')?.value) || 1;
  const tableWrap = document.querySelector('.builder-table')?.closest('div[style*="overflow-x"]');
  if (tableWrap) tableWrap.outerHTML = renderBuilderTable(totals, sv);
}

function saveBuilderRecipe() {
  const title = document.getElementById('builder-title')?.value.trim();
  if (!title) { alert('Please enter a recipe title.'); return; }
  if (!builderIngredients.length) { alert('Please add at least one ingredient.'); return; }
  _saveBuilderFormState();
  const servings = parseInt(document.getElementById('builder-servings')?.value) || 1;
  const procRaw = document.getElementById('builder-procedure')?.value.trim();
  const procedure = procRaw ? procRaw.split('\n').map(s => s.trim()).filter(Boolean) : [];
  const totals = calcBuilderTotals();
  const sv = Math.max(1, servings);
  const macrosPerServing = {
    calories: Math.round(totals.cal / sv),
    fat:      round1(totals.fat / sv),
    carbs:    round1(totals.carbs / sv),
    fiber:    round1(totals.fiber / sv),
    protein:  round1(totals.pro / sv),
    netCarbs: round1(totals.netCarbs / sv),
    sugar:    round1((totals.sugar||0) / sv),
    sodium:   Math.round((totals.sodium||0) / sv)
  };
  const macrosTotal = {
    calories: totals.cal, fat: totals.fat, carbs: totals.carbs,
    fiber: totals.fiber, protein: totals.pro, netCarbs: totals.netCarbs,
    sugar: totals.sugar||0, sodium: totals.sodium||0
  };
  const ingredients = builderIngredients.map(bi => `${bi.amount} ${bi.unit} ${bi.name}`);
  const allergens = detectAllergens(ingredients);
  const grade = healthGrade(macrosPerServing);
  const tags = {
    keto:        macrosPerServing.netCarbs < 10,
    highProtein: macrosPerServing.protein > 0.10 * macrosPerServing.calories,
    lowCalorie:  macrosPerServing.calories < 400,
    vegan: false, vegetarian: false, glutenFree: !allergens.includes('Gluten'),
    dairyFree: !allergens.includes('Dairy'), lowHistamine: false, antiInflammatory: false
  };
  const recipe = {
    id: uid(), title, servings, ingredients, procedure,
    structuredIngredients: JSON.parse(JSON.stringify(builderIngredients)),
    macrosPerServing, macrosTotal,
    estimatedCostTotal: totals.cost,
    estimatedCostPerServing: Math.round(totals.cost / sv * 100) / 100,
    allergens, healthGrade: grade?.grade || null,
    prepTime: _builderMeta.prepTime, cookTime: _builderMeta.cookTime,
    cuisine: _builderMeta.cuisine, difficulty: _builderMeta.difficulty,
    tags, notes: '', forP: false, forM: false, savedAt: Date.now()
  };
  state.recipes.push(recipe);
  builderIngredients = [];
  _builderMeta = { prepTime:'', cookTime:'', cuisine:'', difficulty:'medium' };
  saveState(); closeModal(); render(); pushItem(recipe, 'recipe');
}

// ========== SETTINGS ==========
function openSettings() {
  const panel = document.getElementById('settings-panel');
  const userLabel = document.getElementById('settings-user-label');
  const keyInput = document.getElementById('api-key-input');
  const modelSel = document.getElementById('model-select');
  if (!panel) return;
  userLabel.textContent = state.currentUser || 'Not set';
  userLabel.style.color = state.currentUser === 'P' ? 'var(--p-dark)' : state.currentUser === 'M' ? 'var(--m-dark)' : 'var(--text-muted)';
  keyInput.value = state.geminiApiKey || '';
  modelSel.value = state.geminiModel || 'gemini-2.0-flash';
  const usdaEl = document.getElementById('usda-key-input');
  if (usdaEl) usdaEl.value = state.usdaApiKey || '';
  const suEl = document.getElementById('sync-url-input');
  const skEl = document.getElementById('sync-key-input');
  if (suEl) suEl.value = state.supabaseUrl || '';
  if (skEl) skEl.value = state.supabaseKey || '';
  const tr = document.getElementById('sync-test-result');
  if (tr) { tr.textContent = ''; }
  panel.style.display = 'flex';
  panel.setAttribute('aria-hidden','false');
}
function closeSettings() {
  const panel = document.getElementById('settings-panel');
  if (panel) { panel.style.display = 'none'; panel.setAttribute('aria-hidden','true'); }
}
function saveSettings() {
  const k = document.getElementById('api-key-input');
  const m = document.getElementById('model-select');
  const su = document.getElementById('sync-url-input');
  const sk = document.getElementById('sync-key-input');
  if (k) state.geminiApiKey = k.value.trim();
  if (m) state.geminiModel = m.value || 'gemini-2.0-flash';
  const uk = document.getElementById('usda-key-input');
  if (uk) state.usdaApiKey = uk.value.trim();
  if (su) state.supabaseUrl = su.value.trim().replace(/\/rest\/v1\/?$/, '').replace(/\/$/, '');
  if (sk) state.supabaseKey = sk.value.trim();
  saveLocalState();
  closeSettings();
  render();
  startSyncPolling(); // restart with new config
}
function toggleApiKeyVisibility() {
  const inp = document.getElementById('api-key-input');
  if (inp) inp.type = inp.type === 'password' ? 'text' : 'password';
}

// ========== SHARED HELPERS ==========
function ownerBadge(owner) {
  if (owner === 'P') return `<span class="badge badge-p">P</span>`;
  if (owner === 'M') return `<span class="badge badge-m">M</span>`;
  return `<span class="badge badge-shared">Shared</span>`;
}
function selectOwner(el, val) {
  const container = el.parentElement;
  container.querySelectorAll('.owner-opt').forEach(o => {
    o.className = 'owner-opt';
  });
  if (val === 'P') el.className = 'owner-opt sel-p';
  else if (val === 'M') el.className = 'owner-opt sel-m';
  else el.className = 'owner-opt sel-shared';
  const hiddenInput = container.nextElementSibling;
  if (hiddenInput && hiddenInput.type === 'hidden') hiddenInput.value = val;
}
function closeModal() {
  document.getElementById('modal-container').innerHTML = '';
}
function closeModalOnBackdrop(event) {
  if (event.target === event.currentTarget) closeModal();
}

// ========== INIT ==========
loadState();
if (!state.currentUser) {
  document.getElementById('who-overlay').style.display = 'flex';
} else {
  updateUserButtons();
}
render();
if (isSyncEnabled()) startSyncPolling();
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && isSyncEnabled()) syncFromRemote();
});

// Wire settings panel buttons via addEventListener (most reliable)
document.getElementById('settings-close-btn').addEventListener('click', closeSettings);
document.getElementById('settings-cancel-btn').addEventListener('click', closeSettings);
document.getElementById('settings-save-btn').addEventListener('click', saveSettings);
document.getElementById('show-hide-key-btn').addEventListener('click', toggleApiKeyVisibility);
document.getElementById('settings-panel').addEventListener('click', function(e) {
  if (e.target === this) closeSettings();
});
document.getElementById('show-hide-sync-btn').addEventListener('click', function() {
  const inp = document.getElementById('sync-key-input');
  if (inp) inp.type = inp.type === 'password' ? 'text' : 'password';
});
document.getElementById('show-hide-usda-btn').addEventListener('click', function() {
  const inp = document.getElementById('usda-key-input');
  if (inp) inp.type = inp.type === 'password' ? 'text' : 'password';
});
document.getElementById('test-sync-btn').addEventListener('click', async function() {
  const url = (document.getElementById('sync-url-input').value || '').trim().replace(/\/rest\/v1\/?$/, '').replace(/\/$/, '');
  const key = (document.getElementById('sync-key-input').value || '').trim();
  const el = document.getElementById('sync-test-result');
  if (!url || !key) { el.textContent = '⚠️ Enter URL and key first'; el.style.color = 'var(--yellow)'; return; }
  el.textContent = 'Testing...'; el.style.color = 'var(--text-muted)';
  const result = await testSyncConnection(url, key);
  el.textContent = (result.ok ? '✓ ' : '✗ ') + result.message;
  el.style.color = result.ok ? '#22C55E' : '#EF4444';
});
// Also keep the header settings button wired both ways:
const settingsBtn = document.querySelector('.settings-btn');
if (settingsBtn) settingsBtn.addEventListener('click', openSettings);
</script>
