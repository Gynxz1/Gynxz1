<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CrimPlays – Learn Music</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0D0407">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CrimPlays">
<link rel="apple-touch-icon" href="/icon-192.svg">
<style>
/* ============================================================
   DESIGN TOKENS
============================================================ */
:root {
  --bg:          #0D0407;
  --bg-card:     #180709;
  --bg-card2:    #220C10;
  --crimson:     #C41E3A;
  --crimson-lt:  #FF6B6B;
  --crimson-glow:rgba(196,30,58,0.25);
  --gold:        #F59E0B;
  --gold-lt:     #FCD34D;
  --emerald:     #10B981;
  --rose:        #F43F5E;
  --sky:         #38BDF8;
  --text:        #F0E0E2;
  --text-muted:  #B08890;
  --text-dim:    #7A5560;
  --border:      rgba(255,255,255,0.08);
  --radius:      14px;
  --radius-lg:   20px;
  --shadow:      0 4px 24px rgba(0,0,0,0.6);
  --transition:  0.22s cubic-bezier(0.4,0,0.2,1);
}

/* ============================================================
   RESET & BASE
============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
button{
  border:none;outline:none;cursor:pointer;
  font-family:inherit;font-size:inherit;
  background:none;color:inherit;
}
input{
  border:none;outline:none;background:none;
  font-family:inherit;color:inherit;
  font-size:inherit;
}
svg{display:block}

/* ============================================================
   APP SHELL
============================================================ */
#app{
  display:flex;flex-direction:column;
  height:100%;height:100dvh;
  max-width:480px;margin:0 auto;
  position:relative;overflow:hidden;
}

/* Loading screen */
#loading{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:var(--bg);z-index:999;
  gap:20px;
}
#loading .logo-big{
  font-size:52px;font-weight:900;
  background:linear-gradient(135deg,#FF6B6B,var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:-2px;
}
.spinner{
  width:40px;height:40px;
  border:3px solid var(--border);
  border-top-color:var(--crimson);
  border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Scrollable view area */
#view{
  flex:1;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
}
#view::-webkit-scrollbar{display:none}

/* Bottom navigation */
#nav{
  display:none;
  flex-shrink:0;
  background:var(--bg-card);
  border-top:1px solid var(--border);
  padding:0 8px env(safe-area-inset-bottom,8px);
}
#nav.visible{display:flex}
.nav-btn{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:10px 0 6px;gap:4px;
  color:var(--text-dim);
  transition:color var(--transition);
  font-size:10px;font-weight:600;letter-spacing:0.5px;
}
.nav-btn.active{color:var(--crimson-lt)}
.nav-btn svg{width:22px;height:22px;transition:transform var(--transition)}
.nav-btn.active svg{transform:scale(1.1)}

/* ============================================================
   TYPOGRAPHY HELPERS
============================================================ */
.gradient-text{
  background:linear-gradient(135deg,#FF6B6B,var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.section-label{
  font-size:11px;font-weight:700;
  letter-spacing:1.2px;text-transform:uppercase;
  color:var(--text-muted);margin-bottom:12px;
}

/* ============================================================
   CARDS & SURFACES
============================================================ */
.card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
}
.card-glow{
  box-shadow:0 0 0 1px rgba(196,30,58,0.3),var(--shadow);
}

/* ============================================================
   BUTTONS
============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  gap:8px;padding:14px 24px;
  border-radius:12px;font-weight:700;font-size:15px;
  transition:all var(--transition);
  cursor:pointer;
}
.btn-primary{
  background:linear-gradient(135deg,#E8192C,#8B0000);
  color:#fff;
  box-shadow:0 4px 20px rgba(196,30,58,0.4);
}
.btn-primary:active{transform:scale(0.96);box-shadow:0 2px 10px rgba(196,30,58,0.3)}
.btn-primary:hover{box-shadow:0 6px 28px rgba(196,30,58,0.5)}
.btn-secondary{
  background:var(--bg-card2);
  color:var(--text);
  border:1px solid var(--border);
}
.btn-secondary:active{transform:scale(0.96)}
.btn-gold{
  background:linear-gradient(135deg,var(--gold),#D97706);
  color:#111;
  box-shadow:0 4px 20px rgba(245,158,11,0.35);
}
.btn-gold:active{transform:scale(0.96)}
.btn-lg{width:100%;padding:16px;font-size:16px;border-radius:14px}
.btn-icon{
  width:44px;height:44px;padding:0;
  border-radius:50%;background:var(--bg-card2);
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
}

/* ============================================================
   PROGRESS BAR
============================================================ */
.progress-bar{
  height:6px;background:var(--bg-card2);
  border-radius:99px;overflow:hidden;
}
.progress-fill{
  height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--crimson),var(--crimson-lt));
  transition:width 0.6s cubic-bezier(0.4,0,0.2,1);
}
.progress-fill.gold{background:linear-gradient(90deg,var(--gold),var(--gold-lt))}
.progress-fill.emerald{background:linear-gradient(90deg,var(--emerald),#34D399)}

/* ============================================================
   XP & LEVEL BADGE
============================================================ */
.xp-pill{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(196,30,58,0.15);
  border:1px solid rgba(196,30,58,0.3);
  border-radius:99px;padding:4px 12px;
  font-size:12px;font-weight:700;color:var(--crimson-lt);
}
.streak-pill{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(245,158,11,0.12);
  border:1px solid rgba(245,158,11,0.3);
  border-radius:99px;padding:4px 12px;
  font-size:12px;font-weight:700;color:var(--gold);
}

/* ============================================================
   ONBOARDING
============================================================ */
.onboard-wrap{
  min-height:100%;display:flex;flex-direction:column;
  padding:28px 24px 40px;gap:0;
}
.onboard-logo{
  font-size:28px;font-weight:900;
  letter-spacing:-1px;margin-bottom:32px;
}
.onboard-progress{
  display:flex;gap:6px;margin-bottom:36px;
}
.onboard-dot{
  height:4px;flex:1;border-radius:99px;
  background:var(--bg-card2);
  transition:background var(--transition);
}
.onboard-dot.done{background:var(--crimson)}
.onboard-dot.active{background:var(--crimson-lt)}

.onboard-title{
  font-size:28px;font-weight:800;line-height:1.2;
  margin-bottom:10px;letter-spacing:-0.5px;
}
.onboard-sub{
  font-size:15px;color:var(--text-muted);
  margin-bottom:36px;line-height:1.5;
}
.choice-grid{
  display:grid;gap:12px;margin-bottom:28px;
}
.choice-card{
  padding:16px;border-radius:var(--radius);
  border:2px solid var(--border);
  background:var(--bg-card);
  cursor:pointer;transition:all var(--transition);
  display:flex;align-items:center;gap:14px;
}
.choice-card:active{transform:scale(0.97)}
.choice-card.selected{
  border-color:var(--crimson);
  background:rgba(196,30,58,0.1);
  box-shadow:0 0 0 1px rgba(196,30,58,0.2);
}
.choice-icon{font-size:28px;width:44px;text-align:center;flex-shrink:0}
.choice-label{font-weight:700;font-size:15px;margin-bottom:2px}
.choice-desc{font-size:13px;color:var(--text-muted)}
.onboard-name-input{
  width:100%;background:var(--bg-card);
  border:2px solid var(--border);
  border-radius:var(--radius);
  padding:16px;font-size:18px;font-weight:700;
  color:var(--text);
  transition:border-color var(--transition);
  margin-bottom:28px;
}
.onboard-name-input:focus{border-color:var(--crimson)}
.onboard-name-input::placeholder{color:var(--text-dim)}
.onboard-footer{margin-top:auto;padding-top:20px}

/* ============================================================
   HOME DASHBOARD
============================================================ */
.home-wrap{padding:0 0 16px}
.home-header{
  padding:20px 20px 16px;
  display:flex;align-items:center;justify-content:space-between;
}
.home-logo{
  font-size:20px;font-weight:900;letter-spacing:-0.5px;
}
.home-pills{display:flex;gap:8px;align-items:center}
.home-hero{
  margin:0 16px 20px;
  padding:20px;
  border-radius:var(--radius-lg);
  background:linear-gradient(135deg,#1e0509,#3d0a14);
  border:1px solid rgba(196,30,58,0.2);
  position:relative;overflow:hidden;
}
.home-hero::before{
  content:'';position:absolute;
  top:-40px;right:-40px;width:160px;height:160px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(196,30,58,0.15),transparent 70%);
}
.hero-label{
  font-size:11px;font-weight:700;letter-spacing:1.5px;
  color:var(--crimson-lt);text-transform:uppercase;margin-bottom:8px;
}
.hero-title{
  font-size:22px;font-weight:800;line-height:1.2;margin-bottom:6px;
}
.hero-sub{font-size:13px;color:var(--text-muted);margin-bottom:20px}
.hero-xp-row{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:8px;
}
.hero-xp-label{font-size:12px;color:var(--text-muted);font-weight:600}
.hero-xp-val{font-size:12px;color:var(--crimson-lt);font-weight:700}

.home-section{padding:0 16px;margin-bottom:24px}
.games-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;
  cursor:pointer;transition:all var(--transition);
  position:relative;overflow:hidden;
}
.game-card:active{transform:scale(0.95)}
.game-card::before{
  content:'';position:absolute;
  top:0;left:0;right:0;height:3px;
}
.game-card.purple::before{background:linear-gradient(90deg,var(--crimson),var(--crimson-lt))}
.game-card.gold::before{background:linear-gradient(90deg,var(--gold),var(--gold-lt))}
.game-card.sky::before{background:linear-gradient(90deg,var(--sky),#7DD3FC)}
.game-card.emerald::before{background:linear-gradient(90deg,var(--emerald),#34D399)}
.game-icon{font-size:30px;margin-bottom:10px}
.game-name{font-weight:800;font-size:14px;margin-bottom:4px}
.game-desc{font-size:12px;color:var(--text-muted);line-height:1.4}
.game-xp{
  display:inline-flex;align-items:center;gap:4px;
  margin-top:8px;
  font-size:11px;font-weight:700;color:var(--gold);
  background:rgba(245,158,11,0.1);
  border-radius:99px;padding:2px 8px;
}

.badge-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.badge-row::-webkit-scrollbar{display:none}
.badge-item{
  flex-shrink:0;display:flex;flex-direction:column;
  align-items:center;gap:6px;width:64px;
}
.badge-circle{
  width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;
  background:var(--bg-card2);border:2px solid var(--border);
}
.badge-circle.earned{
  background:rgba(245,158,11,0.1);
  border-color:rgba(245,158,11,0.4);
  box-shadow:0 0 16px rgba(245,158,11,0.2);
}
.badge-label{font-size:10px;color:var(--text-muted);text-align:center;line-height:1.2}

/* ============================================================
   SKILL TREE
============================================================ */
.skill-tree-wrap{padding:20px 16px 40px}
.skill-tree-header{
  margin-bottom:24px;
}
.skill-tree-title{font-size:24px;font-weight:800;margin-bottom:6px}
.skill-tree-sub{font-size:14px;color:var(--text-muted)}

.skill-tree-svg-wrap{
  overflow-x:auto;overflow-y:visible;
  padding:10px 0 20px;
}
.skill-tree-svg-wrap::-webkit-scrollbar{display:none}

.skill-node-card{
  position:absolute;
  width:110px;
  background:var(--bg-card);
  border:2px solid var(--border);
  border-radius:16px;
  padding:14px 10px;
  cursor:pointer;
  transition:all var(--transition);
  text-align:center;
}
.skill-node-card.unlocked{border-color:rgba(196,30,58,0.4)}
.skill-node-card.mastered{
  border-color:var(--gold);
  background:rgba(245,158,11,0.08);
  box-shadow:0 0 20px rgba(245,158,11,0.15);
}
.skill-node-card.locked{opacity:0.45;cursor:not-allowed}
.skill-node-card:not(.locked):active{transform:scale(0.95)}
.skill-node-icon{font-size:28px;margin-bottom:6px}
.skill-node-name{font-size:12px;font-weight:700;margin-bottom:6px;line-height:1.2}
.skill-node-mastery{font-size:11px;color:var(--text-muted);margin-bottom:6px}
.skill-node-bar{height:4px;border-radius:99px;background:var(--bg-card2);overflow:hidden}
.skill-node-fill{height:100%;border-radius:99px;background:var(--crimson)}
.skill-node-fill.gold{background:var(--gold)}
.skill-node-lock{
  font-size:18px;position:absolute;
  top:10px;right:10px;
}

.tree-connector{
  position:absolute;
  background:var(--border);
  border-radius:99px;
}

/* ============================================================
   NOTE FLASH CARDS GAME
============================================================ */
.game-wrap{
  min-height:100%;display:flex;flex-direction:column;
  padding:0;
}
.game-topbar{
  display:flex;align-items:center;gap:12px;
  padding:16px 16px 12px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.game-topbar-title{font-weight:800;font-size:16px;flex:1;text-align:center}
.game-progress-row{
  display:flex;gap:4px;padding:12px 16px 8px;
}
.q-dot{
  height:5px;flex:1;border-radius:99px;
  background:var(--bg-card2);transition:background 0.3s;
}
.q-dot.done{background:var(--emerald)}
.q-dot.wrong{background:var(--rose)}
.q-dot.active{background:var(--crimson)}

.note-game-body{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;
  padding:16px;gap:16px;overflow-y:auto;
}
.staff-card{
  width:100%;background:var(--bg-card);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 8px 12px;
  display:flex;flex-direction:column;align-items:center;
}
.staff-hint{
  font-size:12px;color:var(--text-muted);margin-top:8px;
  font-weight:600;letter-spacing:0.5px;
}
.staff-question-label{
  font-size:13px;color:var(--text-muted);margin-top:4px;
  font-weight:600;
}

.note-feedback{
  width:100%;padding:14px;border-radius:var(--radius);
  text-align:center;font-weight:800;font-size:18px;
  display:none;
}
.note-feedback.correct{
  background:rgba(16,185,129,0.15);
  border:1px solid rgba(16,185,129,0.3);
  color:var(--emerald);
  display:block;
}
.note-feedback.wrong{
  background:rgba(244,63,94,0.12);
  border:1px solid rgba(244,63,94,0.3);
  color:var(--rose);
  display:block;
}

/* Piano keyboard */
.piano-outer{
  width:100%;overflow-x:auto;padding-bottom:4px;
}
.piano-outer::-webkit-scrollbar{display:none}
.piano-container{
  position:relative;
  height:130px;
  display:inline-flex;
  min-width:320px;
}
.piano-white{
  width:44px;height:130px;
  background:linear-gradient(to bottom,#f0f0f0,#fff);
  border:1px solid #bbb;
  border-radius:0 0 6px 6px;
  cursor:pointer;
  display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:8px;
  font-size:11px;font-weight:700;color:#666;
  transition:background 0.08s;
  box-shadow:0 4px 8px rgba(0,0,0,0.4);
  position:relative;z-index:1;
  flex-shrink:0;
}
.piano-white:active,.piano-white.active{
  background:linear-gradient(to bottom,#ddd,#eee);
}
.piano-white.highlight-correct{
  background:linear-gradient(to bottom,#a7f3d0,#6ee7b7) !important;
  box-shadow:0 0 16px rgba(16,185,129,0.5);
}
.piano-white.highlight-wrong{
  background:linear-gradient(to bottom,#fda4af,#fb7185) !important;
  box-shadow:0 0 12px rgba(244,63,94,0.4);
}
.piano-black{
  width:28px;height:82px;
  background:linear-gradient(to bottom,#333,#111);
  position:absolute;top:0;z-index:3;
  border-radius:0 0 4px 4px;
  cursor:pointer;
  box-shadow:2px 4px 8px rgba(0,0,0,0.8);
  display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:6px;
  font-size:8px;color:#666;font-weight:700;
  transition:background 0.08s;
  flex-shrink:0;
}
.piano-black:active,.piano-black.active{
  background:linear-gradient(to bottom,#555,#333);
}

.score-row{
  display:flex;gap:12px;width:100%;
}
.score-chip{
  flex:1;background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px;text-align:center;
}
.score-chip-val{font-size:22px;font-weight:900;margin-bottom:2px}
.score-chip-label{font-size:11px;color:var(--text-muted);font-weight:600}

.note-theory-tip{
  width:100%;background:rgba(196,30,58,0.08);
  border:1px solid rgba(196,30,58,0.2);
  border-radius:var(--radius);padding:12px 14px;
}
.theory-tip-label{font-size:10px;font-weight:700;color:var(--crimson-lt);
  letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.theory-tip-text{font-size:13px;color:var(--text-muted);line-height:1.5}

/* ============================================================
   RHYTHM TAP GAME
============================================================ */
.rhythm-game-body{
  flex:1;display:flex;flex-direction:column;
  align-items:center;padding:20px 16px;gap:20px;
  overflow-y:auto;
}
.rhythm-display{
  width:100%;background:var(--bg-card);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;
}
.rhythm-display-title{
  font-size:12px;font-weight:700;color:var(--text-muted);
  text-transform:uppercase;letter-spacing:1px;margin-bottom:16px;
  text-align:center;
}
.rhythm-beats-row{
  display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
}
.rhythm-beat{
  border-radius:8px;height:48px;
  background:var(--bg-card2);
  border:2px solid var(--border);
  transition:all 0.12s;
  flex-shrink:0;
}
.rhythm-beat.beat-1{width:44px}
.rhythm-beat.beat-half{width:22px}
.rhythm-beat.beat-2{width:88px}
.rhythm-beat.active{
  background:var(--crimson);
  border-color:var(--crimson-lt);
  box-shadow:0 0 20px rgba(196,30,58,0.5);
}
.rhythm-beat.tapped{
  background:var(--emerald);
  border-color:#34D399;
}
.rhythm-beat.missed{
  background:var(--rose);
  border-color:#FB7185;
}

.rhythm-phase-label{
  text-align:center;
  font-size:28px;font-weight:900;
  color:var(--crimson-lt);margin-bottom:4px;
}
.rhythm-phase-sub{
  text-align:center;font-size:14px;color:var(--text-muted);
}

.rhythm-tap-btn{
  width:160px;height:160px;border-radius:50%;
  background:linear-gradient(135deg,#E8192C,#8B0000);
  box-shadow:0 8px 40px rgba(196,30,58,0.5),0 0 0 0 rgba(196,30,58,0.4);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  cursor:pointer;
  transition:all 0.1s;
  font-size:36px;gap:4px;
}
.rhythm-tap-btn:active{
  transform:scale(0.92);
  box-shadow:0 4px 20px rgba(196,30,58,0.4),0 0 0 0 rgba(196,30,58,0.3);
}
.rhythm-tap-btn.pulsing{
  animation:tapPulse 0.5s ease-out;
}
.rhythm-tap-label{font-size:13px;font-weight:700;color:rgba(255,255,255,0.9)}
@keyframes tapPulse{
  0%{box-shadow:0 8px 40px rgba(196,30,58,0.5),0 0 0 0 rgba(196,30,58,0.4)}
  70%{box-shadow:0 8px 40px rgba(196,30,58,0.3),0 0 0 40px rgba(196,30,58,0)}

}

============================================================ */

/* ============================================================
   FRUSTRATION OVERLAY
============================================================ */
.frustration-overlay{

}
.frustration-card{

/* ============================================================
   TOAST NOTIFICATION
============================================================ */
.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:99px;padding:12px 20px;
  font-size:14px;font-weight:700;
  box-shadow:var(--shadow);z-index:600;
  display:flex;align-items:center;gap:8px;
  animation:toastIn 0.3s cubic-bezier(0.4,0,0.2,1);
  white-space:nowrap;
}
@keyframes toastIn{
  from{opacity:0;transform:translateX(-50%) translateY(-12px)}
  to{opacity:1;transform:translateX(-50%) translateY(0)}
}
.toast.exit{
  animation:toastOut 0.3s cubic-bezier(0.4,0,0.2,1) forwards;
}
@keyframes toastOut{
  to{opacity:0;transform:translateX(-50%) translateY(-12px)}
}

/* ============================================================
   CONFETTI (CSS only)
============================================================ */
.confetti-piece{
  position:fixed;top:-10px;z-index:700;
  width:8px;height:8px;border-radius:2px;
  animation:confettiFall var(--dur,2s) var(--delay,0s) ease-in forwards;
}
@keyframes confettiFall{
  to{transform:translateY(105vh) rotate(720deg);opacity:0}
}

/* ============================================================
   ANIMATIONS
============================================================ */
.fade-in{animation:fadeIn 0.3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.pop-in{animation:popIn 0.35s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes popIn{from{opacity:0;transform:scale(0.85)}to{opacity:1;transform:scale(1)}}
.shake{animation:shake 0.4s ease}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)}
  80%{transform:translateX(4px)}
}

/* ============================================================
   DESKTOP PADDING OVERRIDE
============================================================ */
@media(min-width:480px){
  #app{box-shadow:0 0 60px rgba(0,0,0,0.8)}
  body{background:#080203}
}
</style>

<body>

<div id="app">
  <div id="loading">

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script>
/* ============================================================
   CONSTANTS
============================================================ */
const XP_PER_CORRECT     = 10;
const XP_PER_GAME        = 50;
const XP_PERFECT_BONUS   = 30;
const FRUSTRATION_THRESHOLD = 3; // consecutive wrongs before help

const LEVEL_THRESHOLDS = [0,100,250,500,900,1500,2500,4000,6000,9000];

const ALL_BADGES = [
  { id:'first_note',   icon:'🎵', name:'First Note',    desc:'Complete your first Note Flash Cards session' },
  { id:'rhythm_keeper',icon:'🥁', name:'Rhythm Keeper', desc:'Complete your first Rhythm Tap session' },
  { id:'sharp_mind',   icon:'🧠', name:'Sharp Mind',    desc:'90%+ accuracy in Note Flash Cards' },
  { id:'perfect_tempo',icon:'⏱️', name:'Perfect Tempo', desc:'85%+ timing score in Rhythm Tap' },
  { id:'streak_3',     icon:'🔥', name:'On Fire',       desc:'Play 3 days in a row' },
  { id:'level_3',      icon:'⭐', name:'Rising Star',   desc:'Reach level 3' },
];

/* ============================================================
   STATE
============================================================ */
const DEFAULT_STATE = {
  view: 'onboarding',
  onboardingStep: 0,
  user: { name:'', level:'', goal:'', genre:'' },
  progress: {
    xp: 0,
    userLevel: 1,
    streak: 0,
    lastPlayed: null,
    skills: {
      rhythm:         { mastery:0, unlocked:true  },
      earTraining:    { mastery:0, unlocked:false },
      noteReading:    { mastery:0, unlocked:false },
      chords:         { mastery:0, unlocked:false },
      theory:         { mastery:0, unlocked:false },
      improvisation:  { mastery:0, unlocked:false },
    },
    badges: [],
    gamesPlayed: { noteFlash:0, rhythm:0 },
  },
  game: null,
};

let S = loadState();

function loadState(){
  try {
    const saved = localStorage.getItem('crimplays_v1');
    return saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULT_STATE));
  } catch(e) {
    return JSON.parse(JSON.stringify(DEFAULT_STATE));
  }
}
function saveState(){
  localStorage.setItem('crimplays_v1', JSON.stringify(S));
}
function resetState(){
  S = JSON.parse(JSON.stringify(DEFAULT_STATE));
  saveState();
}

/* ============================================================
   AUDIO ENGINE
============================================================ */
let audioReady = false;
let piano, clickHi, clickLo, successSynth, wrongSynth;

async function initAudio(){
  await Tone.start();
  piano = new Tone.PolySynth(Tone.Synth, {
    oscillator:{ type:'triangle8' },
    envelope:{ attack:0.015, decay:0.25, sustain:0.45, release:1.2 },
    volume:-8,
  }).toDestination();

  clickHi = new Tone.Synth({
    oscillator:{ type:'square' },
    envelope:{ attack:0.001, decay:0.06, sustain:0, release:0.05 },
    volume:-4,
  }).toDestination();

  clickLo = new Tone.Synth({
    oscillator:{ type:'square' },
    envelope:{ attack:0.001, decay:0.08, sustain:0, release:0.05 },
    volume:-8,
  }).toDestination();

  successSynth = new Tone.PolySynth(Tone.Synth, {
    oscillator:{ type:'sine' },
    envelope:{ attack:0.01, decay:0.4, sustain:0, release:0.2 },
    volume:-6,
  }).toDestination();

  wrongSynth = new Tone.Synth({
    oscillator:{ type:'sawtooth' },
    envelope:{ attack:0.01, decay:0.15, sustain:0, release:0.1 },
    volume:-10,
  }).toDestination();

  audioReady = true;
}

function playNote(note){
  if(!audioReady) return;
  try { piano.triggerAttackRelease(note, '8n'); } catch(e){}
}

function playSuccess(){
  if(!audioReady) return;
  try {
    successSynth.triggerAttackRelease('E5','16n', Tone.now());
    successSynth.triggerAttackRelease('G5','16n', Tone.now()+0.08);
    successSynth.triggerAttackRelease('B5','8n',  Tone.now()+0.16);
  } catch(e){}
}

function playWrong(){
  if(!audioReady) return;
  try { wrongSynth.triggerAttackRelease('C2','8n'); } catch(e){}
}

function playMetroHi(){
  if(!audioReady) return;
  try { clickHi.triggerAttackRelease('G5','32n'); } catch(e){}
}

function playMetroLo(){
  if(!audioReady) return;
  try { clickLo.triggerAttackRelease('G4','32n'); } catch(e){}
}

/* ============================================================
   MUSIC DATA
============================================================ */
// Treble clef note positions in SVG (staffY = center of note ellipse)
// SVG viewBox: "0 0 320 180", staff lines at y=60,72,84,96,108
const TREBLE_NOTES = [
  { note:'C4', label:'C', octave:4, staffY:120, ledger:true,  pianoKey:'C4',
    tip:'Middle C – the most important note in music! It sits on its own ledger line below the staff.' },
  { note:'D4', label:'D', octave:4, staffY:114, ledger:false, pianoKey:'D4',
    tip:'D4 floats just below the first staff line. Think of it as "D for Down below."' },
  { note:'E4', label:'E', octave:4, staffY:108, ledger:false, pianoKey:'E4',
    tip:'E4 is on the first (bottom) line of the staff. Every Good Boy Does Fine – E is the first line!' },
  { note:'F4', label:'F', octave:4, staffY:102, ledger:false, pianoKey:'F4',
    tip:'F4 sits in the first space. FACE – the spaces spell a word! F is the first space.' },
  { note:'G4', label:'G', octave:4, staffY:96, ledger:false,  pianoKey:'G4',
    tip:'G4 is on the second line. The treble clef curls around G4 – that\'s why it\'s called the G clef!' },
  { note:'A4', label:'A', octave:4, staffY:90, ledger:false,  pianoKey:'A4',
    tip:'A4 is in the second space. A = 440Hz, the standard tuning pitch used worldwide.' },
  { note:'B4', label:'B', octave:4, staffY:84, ledger:false,  pianoKey:'B4',
    tip:'B4 is on the middle (third) line. Every Good Boy Does Fine – B is "Boy," the third line.' },
  { note:'C5', label:'C', octave:5, staffY:78, ledger:false,  pianoKey:'C5',
    tip:'C5 is in the third space. Notice it sounds an octave higher than Middle C – same name, higher pitch!' },
];

const NOTE_THEORY_MNEMONICS = {
  lines:  'Every Good Boy Does Fine (E G B D F)',
  spaces: 'FACE (F A C E)',
};

// Piano key layout for Note Flash Cards game
const PIANO_KEYS = [
  { note:'C4',  type:'white', label:'C', left:0   },
  { note:'D4',  type:'white', label:'D', left:44  },
  { note:'E4',  type:'white', label:'E', left:88  },
  { note:'F4',  type:'white', label:'F', left:132 },
  { note:'G4',  type:'white', label:'G', left:176 },
  { note:'A4',  type:'white', label:'A', left:220 },
  { note:'B4',  type:'white', label:'B', left:264 },
  { note:'C5',  type:'white', label:'C', left:308 },
  { note:'C#4', type:'black', label:'C#', left:30 },
  { note:'D#4', type:'black', label:'D#', left:74 },
  { note:'F#4', type:'black', label:'F#', left:162},
  { note:'G#4', type:'black', label:'G#', left:206},
  { note:'A#4', type:'black', label:'A#', left:250},
];

// Rhythm patterns [{ beats: [durations in quarter notes], name }]
const RHYTHM_PATTERNS = [
  { name:'Simple Beat',   bpm:80, beats:[1,1,1,1],           level:1 },
  { name:'Half Notes',    bpm:72, beats:[2,2],                level:1 },
  { name:'Mix It Up',     bpm:76, beats:[1,1,2],              level:2 },
  { name:'Eighth Notes',  bpm:80, beats:[0.5,0.5,0.5,0.5,1,1],level:2 },
  { name:'Syncopation',   bpm:72, beats:[1,0.5,0.5,1,1],     level:3 },
];

/* ============================================================
   UTILITIES
============================================================ */
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)) }
function rand(arr){ return arr[Math.floor(Math.random()*arr.length)] }
function shuffle(arr){ return [...arr].sort(()=>Math.random()-0.5) }

function xpForLevel(lvl){ return LEVEL_THRESHOLDS[Math.min(lvl-1, LEVEL_THRESHOLDS.length-1)] }
function nextLevelXp(lvl){ return LEVEL_THRESHOLDS[Math.min(lvl, LEVEL_THRESHOLDS.length-1)] }
function getLevelFromXp(xp){
  for(let i=LEVEL_THRESHOLDS.length-1;i>=0;i--){
    if(xp>=LEVEL_THRESHOLDS[i]) return i+1;
  }
  return 1;
}

function addXP(amount){
  const oldLevel = S.progress.userLevel;
  S.progress.xp += amount;
  S.progress.userLevel = getLevelFromXp(S.progress.xp);
  saveState();
  showToast(`+${amount} XP ⭐`, 'var(--gold)');
  if(S.progress.userLevel > oldLevel){
    setTimeout(()=>showToast(`Level Up! Now Level ${S.progress.userLevel} 🎉`,'var(--crimson-lt)'),700);
    maybeAwardBadge('level_3', S.progress.userLevel >= 3);
  }
}

function updateStreak(){
  const today = new Date().toDateString();
  if(S.progress.lastPlayed === today) return;
  const yesterday = new Date(Date.now()-86400000).toDateString();
  if(S.progress.lastPlayed === yesterday){
    S.progress.streak++;
    maybeAwardBadge('streak_3', S.progress.streak >= 3);
  } else if(S.progress.lastPlayed !== today){
    S.progress.streak = 1;
  }
  S.progress.lastPlayed = today;
  saveState();
}

function maybeAwardBadge(id, condition){
  if(!condition) return;
  if(S.progress.badges.includes(id)) return;
  S.progress.badges.push(id);
  saveState();
  const badge = ALL_BADGES.find(b=>b.id===id);
  if(badge) setTimeout(()=>showToast(`${badge.icon} Badge Unlocked: ${badge.name}!`, 'var(--gold)'),1200);
}

function updateSkillMastery(skill, delta){
  if(!S.progress.skills[skill]) return;
  S.progress.skills[skill].mastery = clamp(S.progress.skills[skill].mastery + delta, 0, 100);
  // unlock dependent skills
  if(S.progress.skills.rhythm.mastery >= 20) S.progress.skills.noteReading.unlocked = true;
  if(S.progress.skills.rhythm.mastery >= 30) S.progress.skills.earTraining.unlocked = true;
  if(S.progress.skills.noteReading.mastery >= 40) S.progress.skills.chords.unlocked = true;
  if(S.progress.skills.chords.mastery >= 30) S.progress.skills.theory.unlocked = true;
  if(S.progress.skills.theory.mastery >= 40) S.progress.skills.improvisation.unlocked = true;
  saveState();
}

/* ============================================================
   TOAST
============================================================ */
let toastTimer = null;
function showToast(msg, color='var(--text)'){
  const existing = document.querySelector('.toast');
  if(existing) existing.remove();
  clearTimeout(toastTimer);
  const el = document.createElement('div');
  el.className = 'toast';
  el.style.color = color;
  el.innerHTML = msg;
  document.body.appendChild(el);
  toastTimer = setTimeout(()=>{
    el.classList.add('exit');
    setTimeout(()=>el.remove(), 300);
  }, 2200);
}

/* ============================================================
   CONFETTI
============================================================ */
function spawnConfetti(){
  const colors = ['#C41E3A','#F59E0B','#10B981','#38BDF8','#F43F5E','#A78BFA'];
  for(let i=0;i<40;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.cssText = `
      left:${Math.random()*100}vw;
      background:${colors[i%colors.length]};
      --dur:${1.5+Math.random()*1.5}s;
      --delay:${Math.random()*0.5}s;
      width:${6+Math.random()*6}px;
      height:${6+Math.random()*6}px;
    `;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 3000);
  }
}

/* ============================================================
   ROUTER / NAV
============================================================ */
function navTo(view){
  S.view = view;
  renderView();
  document.querySelectorAll('.nav-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.nav === view);
  });
}

function showNav(visible){
  document.getElementById('nav').classList.toggle('visible', visible);
}

function renderView(){
  const container = document.getElementById('view');
  switch(S.view){
    case 'onboarding': showNav(false); renderOnboarding(container); break;
    case 'home':       showNav(true);  renderHome(container); break;
    case 'skills':     showNav(true);  renderSkillTree(container); break;
    case 'play':       showNav(true);  renderPlay(container); break;
    case 'profile':    showNav(true);  renderProfile(container); break;
    case 'game_note':  showNav(false); renderNoteFlash(container); break;
    case 'game_rhythm':showNav(false); renderRhythmTap(container); break;
    case 'result':     showNav(false); renderResult(container); break;
  }
}

/* ============================================================
   ONBOARDING
============================================================ */
const ONBOARD_STEPS = [
  { id:'welcome' },
  { id:'level'   },
  { id:'goal'    },
  { id:'genre'   },
];

function renderOnboarding(container){
  container.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'onboard-wrap fade-in';

  const step = S.onboardingStep;

  // Logo
  wrap.innerHTML += `<div class="onboard-logo gradient-text">CrimPlays</div>`;

  // Progress dots
  let dots = '<div class="onboard-progress">';
  ONBOARD_STEPS.forEach((_,i)=>{
    const cls = i<step?'done':i===step?'active':'';
    dots += `<div class="onboard-dot ${cls}"></div>`;
  });
  dots += '</div>';
  wrap.innerHTML += dots;

  // Step content
  let content = '';
  switch(step){
    case 0: content = onboardWelcome(); break;
    case 1: content = onboardLevel();   break;
    case 2: content = onboardGoal();    break;
    case 3: content = onboardGenre();   break;
  }
  wrap.innerHTML += content;

  // Footer button
  const footer = document.createElement('div');
  footer.className = 'onboard-footer';

  if(step === 0){
    const btn = document.createElement('button');
    btn.className = 'btn btn-primary btn-lg';
    btn.textContent = 'Let\'s Go!';
    btn.onclick = ()=>{
      const name = document.getElementById('ob-name')?.value.trim();
      if(!name){ showToast('Enter your name first 😊','var(--rose)'); return; }
      S.user.name = name;
      S.onboardingStep = 1;
      saveState();
      renderView();
    };
    footer.appendChild(btn);
  } else if(step < ONBOARD_STEPS.length-1){
    const btn = document.createElement('button');
    btn.className = 'btn btn-primary btn-lg';
    btn.textContent = 'Continue →';
    btn.id = 'ob-continue';
    btn.onclick = ()=>onboardNext(step);
    footer.appendChild(btn);
  } else {
    const btn = document.createElement('button');
    btn.className = 'btn btn-gold btn-lg';
    btn.innerHTML = '🎵 Start Learning!';
    btn.onclick = ()=>onboardFinish();
    footer.appendChild(btn);
  }

  wrap.appendChild(footer);
  container.appendChild(wrap);
}

function onboardWelcome(){
  return `
    <div class="onboard-title">Hey! What's your name? 👋</div>
    <div class="onboard-sub">I'm your personal music teacher. I'll adapt to your pace, celebrate your wins, and never make you feel dumb for asking.</div>
    <input class="onboard-name-input" id="ob-name" type="text" placeholder="Enter your name…"
      value="${S.user.name}" maxlength="30" autocomplete="off"
      onkeydown="if(event.key==='Enter'){document.querySelector('.onboard-footer .btn')?.click()}">
  `;
}

function onboardLevel(){
  const opts = [
    { val:'beginner',     icon:'🌱', label:'Complete Beginner', desc:'Never touched a piano (that\'s okay!)' },
    { val:'some',         icon:'🎹', label:'A Little Bit',       desc:'Know some notes, but not consistent yet' },
    { val:'intermediate', icon:'🎼', label:'Intermediate',       desc:'Can play simple songs, want to go deeper' },
  ];
  return `
    <div class="onboard-title">What's your experience level?</div>
    <div class="onboard-sub">No judgment – this helps me start at the perfect place for you.</div>
    <div class="choice-grid" id="ob-level-grid">
      ${opts.map(o=>`
        <div class="choice-card ${S.user.level===o.val?'selected':''}"
             onclick="selectChoice('ob-level-grid','${o.val}','level')">
          <div class="choice-icon">${o.icon}</div>
          <div><div class="choice-label">${o.label}</div><div class="choice-desc">${o.desc}</div></div>
        </div>
      `).join('')}
    </div>
  `;
}

function onboardGoal(){
  const opts = [
    { val:'song30',  icon:'🎸', label:'Play a song in 30 days',  desc:'Fast results, practical from day one' },
    { val:'theory',  icon:'📖', label:'Understand music theory', desc:'Know the WHY behind every note' },

function selectChoice(gridId, val, field){
  S.user[field] = val;
  document.querySelectorAll(`#${gridId} .choice-card`).forEach(c=>c.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
}

function onboardNext(step){
  if(step===1 && !S.user.level){ showToast('Pick your level first','var(--rose)'); return; }
  if(step===2 && !S.user.goal) { showToast('Choose a goal first','var(--rose)');  return; }
  S.onboardingStep++;
  saveState();
  renderView();
}

function onboardFinish(){
  if(!S.user.genre){ showToast('Choose your genre first','var(--rose)'); return; }
  S.view = 'home';
  S.onboardingStep = ONBOARD_STEPS.length;
  updateStreak();
  saveState();
  renderView();
  spawnConfetti();
  setTimeout(()=>showToast(`Welcome, ${S.user.name}! Let\'s make music 🎵`,'var(--crimson-lt)'), 300);
}

/* ============================================================

============================================================ */
let noteGameState = null;

function startNoteFlash(){
  updateStreak();
  noteGameState = {
    questions: buildNoteQuestions(),
    current: 0,
    score: 0,
    correct: 0,
    history: [], // 'correct' | 'wrong'
    consecutiveWrong: 0,
    answered: false,
    hintMode: false,
  };
  S.view = 'game_note';
  S.game = { type:'noteFlash' };
  renderView();
}

function buildNoteQuestions(){
  // Build pool weighted by mastery (lower mastery = more likely to appear)
  let pool = [];
  TREBLE_NOTES.forEach(n=>{
    pool.push(n); pool.push(n); // base weight
  });
  return shuffle(pool).slice(0, 10);
}

function renderNoteFlash(container){
  container.innerHTML = '';
  const g = noteGameState;
  const q = g.questions[g.current];
  const total = g.questions.length;
  const wrap = document.createElement('div');
  wrap.className = 'game-wrap fade-in';

  // Top bar
  wrap.innerHTML = `
    <div class="game-topbar">
      <button class="btn-icon" onclick="confirmExitGame()">

      <div class="xp-pill">Q ${g.current+1}/${total}</div>
    </div>
    <div class="game-progress-row" id="q-dots">
      ${g.questions.map((_,i)=>{
        const hist = g.history[i];
        const cls = hist==='correct'?'done':hist==='wrong'?'wrong':i===g.current?'active':'';
        return `<div class="q-dot ${cls}"></div>`;
      }).join('')}
    </div>
  `;

  // Game body
  const body = document.createElement('div');

  // Feedback area

      <div class="score-chip-label">Correct</div>
    </div>
    <div class="score-chip">
      <div class="score-chip-val" style="color:var(--rose)">${g.history.filter(h=>h==='wrong').length}</div>

    <div class="score-chip">

function buildStaffSVG(noteData){
  const W = 320, H = 170;
  const staffX1 = 50, staffX2 = 280;
  // Staff lines (y positions)
  const lines = [60, 72, 84, 96, 108];
  // Note center y
  const noteY = noteData.staffY;
  const noteX = 165;

  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:340px">`;

  // Staff lines
  lines.forEach(y=>{
    svg += `<line x1="${staffX1}" y1="${y}" x2="${staffX2}" y2="${y}" stroke="#8892a4" stroke-width="1.5"/>`;
  });

  // Ledger line for Middle C
  if(noteData.ledger){
    svg += `<line x1="${noteX-18}" y1="${noteY}" x2="${noteX+18}" y2="${noteY}" stroke="#8892a4" stroke-width="1.5"/>`;
  }

  // Treble clef (simplified as text)
  svg += `<text x="52" y="113" font-size="68" font-family="serif" fill="#8892a4"
     dominant-baseline="auto">&#x1D11E;</text>`;

  // Note ellipse
  svg += `<ellipse cx="${noteX}" cy="${noteY}" rx="11" ry="8.5" fill="var(--crimson-lt)"/>`;

  // Note stem (up if below/at middle line B4 y=84, down if above)
  if(noteY >= 84){
    svg += `<line x1="${noteX+10}" y1="${noteY}" x2="${noteX+10}" y2="${noteY-40}" stroke="var(--crimson-lt)" stroke-width="2"/>`;
  } else {
    svg += `<line x1="${noteX-10}" y1="${noteY}" x2="${noteX-10}" y2="${noteY+40}" stroke="var(--crimson-lt)" stroke-width="2"/>`;
  }

  // Play note indicator
  svg += `<circle cx="56" cy="134" r="10" fill="rgba(196,30,58,0.2)" stroke="var(--crimson)" stroke-width="1.5"
     onclick="playNote('${noteData.note}')" style="cursor:pointer"/>
     <text x="56" y="138" font-size="11" fill="var(--crimson-lt)" text-anchor="middle">♪</text>`;

  svg += '</svg>';
  return svg;
}

function buildPianoHTML(targetNote, answered){
  const whiteKeys = PIANO_KEYS.filter(k=>k.type==='white');
  const blackKeys = PIANO_KEYS.filter(k=>k.type==='black');
  const totalW = whiteKeys.length * 44;

  let html = `<div class="piano-container" style="width:${totalW}px">`;

  whiteKeys.forEach(k=>{
    html += `<div class="piano-white" data-piano-key="${k.note}">${k.label}</div>`;
  });

  blackKeys.forEach(k=>{
    html += `<div class="piano-black" data-piano-key="${k.note}" style="left:${k.left}px">${k.label}</div>`;
  });

  html += '</div>';
  return html;
}

function noteHandleAnswer(pressedKey, question, keyEl){
  const g = noteGameState;
  if(g.answered) return;
  g.answered = true;

  const correct = pressedKey === question.pianoKey;
  playNote(pressedKey);

  // Flash key
  const allKeys = document.querySelectorAll('[data-piano-key]');
  const targetEl = document.querySelector(`[data-piano-key="${question.pianoKey}"]`);

  if(correct){
    keyEl.classList.add('highlight-correct');
    g.correct++;
    g.score += XP_PER_CORRECT;
    g.consecutiveWrong = 0;
    g.history.push('correct');
    setTimeout(playSuccess, 100);
    showFeedback('correct', `Correct! That's ${question.label}${question.octave} 🎉`);
  } else {
    keyEl.classList.add('highlight-wrong');
    if(targetEl) targetEl.classList.add('highlight-correct');
    g.consecutiveWrong++;
    g.history.push('wrong');
    playWrong();
    showFeedback('wrong', `Not quite – the correct key is ${question.label}${question.octave}. Look at the highlighted key!`);
    document.querySelector('.staff-hint').style.display = 'block';

    if(g.consecutiveWrong >= FRUSTRATION_THRESHOLD){
      setTimeout(()=>showFrustrationHelper('note'), 800);
    }

  updateQDots();
  document.getElementById('note-next-btn').style.display = 'flex';
}

function updateQDots(){

function finishNoteFlash(){

  const total = g.questions.length;
  const accuracy = Math.round((g.correct / total) * 100);
  const bonusXP = accuracy === 100 ? XP_PERFECT_BONUS : accuracy >= 80 ? 15 : 0;
  const totalXP = g.score + XP_PER_GAME + bonusXP;

  addXP(totalXP);
  updateSkillMastery('noteReading', Math.round(accuracy / 10));

  maybeAwardBadge('first_note', S.progress.gamesPlayed.noteFlash >= 1);
  maybeAwardBadge('sharp_mind', accuracy >= 90);

function getPhaseHTML(phase){
  switch(phase){
    case 'intro':
      return `<div class="rhythm-phase-label" style="font-size:16px">🎵 Listen to the pattern,<br>then tap it back!</div>`;
    case 'listen':
      return `<div class="rhythm-phase-label" style="color:var(--sky)">👂 Listening…</div>
              <div class="rhythm-phase-sub">Watch the beats light up</div>`;
    case 'countdown':
      return `<div class="rhythm-phase-label" id="countdown-num">${rhythmState.countdownVal}</div>
              <div class="rhythm-phase-sub">Get ready to tap!</div>`;
    case 'tap':
      return `<div class="rhythm-phase-label" style="color:var(--emerald)">🎶 Tap it!</div>
              <div class="rhythm-phase-sub">Match the rhythm above</div>`;
    case 'done':
      return `<div class="rhythm-phase-label" style="font-size:16px">Complete!</div>`;
    default: return '';
  }
}

function startListenPhase(){
  const rs = rhythmState;
  rs.phase = 'listen';
  clearAllRhythmTimers();

  document.getElementById('rhythm-start-btn').style.display = 'none';
  document.getElementById('rhythm-phase').innerHTML = getPhaseHTML('listen');

  const bpm = rs.pattern.bpm;
  const beatDuration = 60000 / bpm; // ms per quarter note
  let elapsed = 0;
  let metroCount = 0;

  // Play metronome with beat highlights
  rs.pattern.beats.forEach((dur,beatIdx)=>{
    const t = rhythmTimers[rhythmTimers.length] = setTimeout(()=>{
      highlightBeat(beatIdx, true);
      const isDownbeat = beatIdx === 0;
      if(isDownbeat) playMetroHi(); else playMetroLo();
      pulseMDot(metroCount % 4);
      metroCount++;
      setTimeout(()=>highlightBeat(beatIdx, false), dur * beatDuration * 0.7);
    }, elapsed);
    elapsed += dur * beatDuration;
  });

  // After listen: countdown
  rhythmTimers.push(setTimeout(()=>startCountdown(), elapsed + 300));
}

function highlightBeat(idx, on){
  const el = document.getElementById(`rbeat-${idx}`);
  if(el) el.classList.toggle('active', on);
}

function pulseMDot(idx){
  document.querySelectorAll('.metro-dot').forEach(d=>d.classList.remove('beat'));
  const el = document.getElementById(`mdot-${idx}`);
  if(el){ el.classList.add('beat'); setTimeout(()=>el.classList.remove('beat'),200); }
}

function startCountdown(){
  const rs = rhythmState;
  rs.phase = 'countdown';
  rs.countdownVal = 3;
  document.getElementById('rhythm-phase').innerHTML = getPhaseHTML('countdown');

  let count = 3;
  const tick = ()=>{
    const el = document.getElementById('countdown-num');
    if(el) el.textContent = count;
    playMetroHi();
    if(count > 0){ count--; rhythmTimers.push(setTimeout(tick, 800)); }
    else { startTapPhase(); }
  };
  tick();
}

function startTapPhase(){
  const rs = rhythmState;
  rs.phase = 'tap';
  rs.taps = [];
  rs.startTime = Date.now();

  // Build expected tap timestamps
  const bpm = rs.pattern.bpm;
  const beatMs = 60000 / bpm;
  let t = 0;
  rs.expectedTimes = rs.pattern.beats.map(dur=>{ const out=t; t+=dur*beatMs; return out; });

  document.getElementById('rhythm-phase').innerHTML = getPhaseHTML('tap');
  document.getElementById('tap-btn').style.display = 'flex';

  // Play metronome while tapping
  let metroT = 0;
  const totalDur = rs.pattern.beats.reduce((a,b)=>a+b,0) * beatMs;
  let mBeat = 0;
  const playMetro = ()=>{
    playMetroLo();
    pulseMDot(mBeat % 4); mBeat++;
    if(Date.now() - rs.startTime < totalDur + 1000){
      rhythmTimers.push(setTimeout(playMetro, beatMs));
    }
  };
  playMetroLo();
  rhythmTimers.push(setTimeout(playMetro, beatMs));

  // End tap phase after pattern + buffer
  rhythmTimers.push(setTimeout(()=>endTapPhase(), totalDur + 1500));
}

function handleTap(){
  const rs = rhythmState;
  if(rs.phase !== 'tap') return;

  const now = Date.now() - rs.startTime;
  rs.taps.push(now);

  // Animate button
  const btn = document.getElementById('tap-btn');
  if(btn){ btn.classList.remove('pulsing'); void btn.offsetWidth; btn.classList.add('pulsing'); }
  playMetroHi();

  // Check nearest expected time
  let bestDiff = Infinity;
  let bestIdx = -1;
  rs.expectedTimes.forEach((expected,i)=>{
    const diff = Math.abs(now - expected);
    if(diff < bestDiff){ bestDiff=diff; bestIdx=i; }
  });
  if(bestIdx>=0){
    const el = document.getElementById(`rbeat-${bestIdx}`);
    if(el){ el.classList.add('tapped'); }
  }
}

function endTapPhase(){
  const rs = rhythmState;
  if(rs.phase === 'done') return;
  rs.phase = 'done';
  clearAllRhythmTimers();

  document.getElementById('tap-btn').style.display = 'none';

  // Score calculation
  const score = calcRhythmScore(rs.taps, rs.expectedTimes, 60000/rs.pattern.bpm);
  rs.score = score;

  // Show score inline
  const scoreDiv = document.getElementById('rhythm-score');
  if(scoreDiv){
    scoreDiv.style.display = 'block';
    scoreDiv.innerHTML = `
      <div class="accuracy-badge" style="background:${score>=85?'rgba(16,185,129,0.1)':score>=60?'rgba(196,30,58,0.1)':'rgba(244,63,94,0.08)'}">
        <div class="accuracy-score" style="color:${score>=85?'var(--emerald)':score>=60?'var(--crimson-lt)':'var(--rose)'}">${score}%</div>
        <div class="accuracy-label">Timing Accuracy</div>
      </div>
      <button class="btn btn-primary btn-lg" style="margin-top:12px" onclick="finishRhythmTap()">
        See Results →
      </button>
    `;
  }
  document.getElementById('rhythm-phase').innerHTML = `
    <div class="rhythm-phase-label" style="font-size:18px">
      ${score>=85?'🔥 Excellent!':score>=60?'👍 Good rhythm!':'💪 Keep practicing!'}
    </div>
  `;
}

function calcRhythmScore(taps, expected, beatMs){
  if(taps.length === 0) return 0;
  const window = beatMs * 0.35; // ±35% of beat duration
  let hits = 0;
  expected.forEach(exp=>{
    if(taps.some(t=>Math.abs(t-exp)<window)) hits++;
  });
  const hitRate = hits / expected.length;
  // Also penalize if way too many taps
  const extraTaps = Math.max(0, taps.length - expected.length);
  const penalty = Math.min(extraTaps * 5, 20);
  return Math.max(0, Math.round(hitRate * 100 - penalty));
}

function clearAllRhythmTimers(){
  rhythmTimers.forEach(clearTimeout);
  rhythmTimers = [];
}

function finishRhythmTap(){
  clearAllRhythmTimers();
  const rs = rhythmState;
  const score = rs.score;
  const bonusXP = score >= 90 ? XP_PERFECT_BONUS : score >= 70 ? 15 : 0;
  const totalXP = Math.round((score / 100) * XP_PER_CORRECT * rs.pattern.beats.length) + XP_PER_GAME + bonusXP;

  addXP(totalXP);
  updateSkillMastery('rhythm', Math.round(score / 10));
  S.progress.gamesPlayed.rhythm++;
  maybeAwardBadge('rhythm_keeper', S.progress.gamesPlayed.rhythm >= 1);
  maybeAwardBadge('perfect_tempo', score >= 85);
  saveState();

  S.game = {
    type: 'rhythm',
    score: totalXP,
    accuracy: score,
    correct: Math.round(score / 100 * rs.pattern.beats.length),
    total: rs.pattern.beats.length,
    bonusXP,
    emoji: score >= 85 ? '🔥' : score >= 65 ? '🎉' : score >= 40 ? '👏' : '💪',
    title: score >= 85 ? 'Perfect Timing!' : score >= 65 ? 'Great Rhythm!' : score >= 40 ? 'Getting There!' : 'Keep Practicing!',
  };
  S.view = 'result';
  if(score >= 75) spawnConfetti();
  renderView();
}

// Init audio on first user gesture (required by all modern browsers anyway)
let audioInitStarted = false;
async function ensureAudio(){
  if(audioReady || audioInitStarted) return;
  audioInitStarted = true;
  try {
    await initAudio();
  } catch(e) {
    console.warn('Audio init:', e);
    audioInitStarted = false;
  }
}

// Handle keyboard tap for rhythm game
document.addEventListener('keydown', (e)=>{
  if(e.code === 'Space' && rhythmState && rhythmState.phase === 'tap'){
    e.preventDefault();
    handleTap();
  }
});
</script>
