<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Home Hub</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0D1B2A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Home Hub">
<link rel="apple-touch-icon" href="/icon-192.svg">
<style>
:root {
  /* Core palette */
  --navy:        #0D1B2A;
  --navy-mid:    #1A2F4A;
  --blue:        #1565C0;
  --blue-hover:  #0D47A1;
  --sky:         #29B6F6;
  --sky-bg:      #E1F5FE;
  --yellow:      #FFD600;
  --yellow-bg:   #FFFDE7;
  --white:       #FFFFFF;
  --bg:          #EEF4FB;
  --card-bg:     #FFFFFF;
  --border:      #C5D8EE;
  --text:        #0D1B2A;
  --text-muted:  #4A6B8A;
  --radius:      12px;
  --shadow:      0 1px 4px rgba(13,27,42,0.08), 0 2px 8px rgba(13,27,42,0.05);
  --shadow-md:   0 4px 16px rgba(13,27,42,0.13);
  --transition:  all 0.18s ease;

  /* User colors */
  --p-color:  #29B6F6;
  --p-bg:     #E1F5FE;
  --p-dark:   #0277BD;
  --m-color:  #FFD600;
  --m-bg:     #FFFDE7;
  --m-dark:   #F57F17;
  --shared-color: #1565C0;
  --shared-bg:    #DCEEFB;

  /* Header */
  --header-from: #0D1B2A;
  --header-to:   #1A3A5C;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* Header */
#header {
  background: linear-gradient(135deg, var(--header-from), var(--header-to));
  color: #fff;
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  height: 56px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(13,27,42,0.35);
}
#header h1 { font-size: 1.2rem; font-weight: 700; flex: 1; letter-spacing: -0.02em; }
.user-toggle { display: flex; gap: 4px; }
.user-btn {
  border: none;
  border-radius: 20px;
  padding: 5px 14px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  opacity: 0.6;
  background: rgba(255,255,255,0.15);
  color: #fff;
}
.user-btn.active-p { background: var(--p-color); opacity: 1; box-shadow: 0 0 0 2px rgba(255,255,255,0.4); }
.user-btn.active-m { background: var(--m-color); color: var(--navy); opacity: 1; box-shadow: 0 0 0 2px rgba(255,255,255,0.4); }
.settings-btn {
  background: rgba(255,255,255,0.15);
  border: none;
  border-radius: 8px;
  color: #fff;
  cursor: pointer;
  padding: 6px 10px;
  font-size: 1rem;
  transition: var(--transition);
}
.settings-btn:hover { background: rgba(255,255,255,0.25); }

/* Tabs */
#tabs {
  display: flex;
  background: #fff;
  border-bottom: 2px solid var(--border);
  position: sticky;
  top: 56px;
  z-index: 90;
  overflow-x: auto;
}
.tab-btn {
  flex: 1;
  min-width: 80px;
  border: none;
  background: none;
  padding: 12px 8px;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: var(--transition);
  white-space: nowrap;
}
.tab-btn.active { color: var(--yellow); border-bottom-color: var(--yellow); }
.tab-btn:hover:not(.active) { color: var(--text); background: var(--bg); }

/* Main content */
#main { max-width: 900px; margin: 0 auto; padding: 16px; }

/* Filters bar */
.filters-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
  align-items: center;
}
.filter-label { font-size: 0.78rem; font-weight: 600; color: var(--text-muted); }
.filter-select, .filter-btn-group { display: flex; gap: 4px; }
select.filter-select-input {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 10px;
  font-size: 0.82rem;
  background: #fff;
  color: var(--text);
  cursor: pointer;
}
.filt-btn {
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
  background: #fff;
  color: var(--text-muted);
  transition: var(--transition);
}
.filt-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }

/* Add button */
.add-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: linear-gradient(135deg, var(--navy-mid), var(--blue));
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 9px 18px;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  box-shadow: 0 2px 6px rgba(21,101,192,0.3);
  margin-bottom: 14px;
}
.add-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(21,101,192,0.35); }

/* Cards */
.cards-grid { display: flex; flex-direction: column; gap: 10px; }
.recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  transition: var(--transition);
  position: relative;
}
.card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.card.done { opacity: 0.55; }
.card.overdue { border-left: 3px solid #EF4444; }
.card-header { display: flex; align-items: flex-start; gap: 10px; }
.card-check {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid var(--border);
  flex-shrink: 0;
  cursor: pointer;
  margin-top: 2px;
  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
}
.card-check.checked { background: #22C55E; border-color: #22C55E; color: #fff; }
.card-title { font-weight: 600; font-size: 0.95rem; flex: 1; line-height: 1.3; }
.card-title.strikethrough { text-decoration: line-through; color: var(--text-muted); }
.card-meta { font-size: 0.78rem; color: var(--text-muted); margin-top: 5px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.card-notes { font-size: 0.82rem; color: var(--text-muted); margin-top: 5px; font-style: italic; line-height: 1.4; }
.card-actions { display: flex; gap: 6px; margin-top: 10px; justify-content: flex-end; }
.card-btn {
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 7px;
  padding: 4px 10px;
  font-size: 0.75rem;
  cursor: pointer;
  color: var(--text-muted);
  transition: var(--transition);
}
.card-btn:hover { background: var(--bg); color: var(--text); }
.card-btn.danger:hover { background: #FEE2E2; border-color: #FCA5A5; color: #DC2626; }

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  border-radius: 20px;
  padding: 2px 8px;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.badge-p { background: var(--p-bg); color: var(--p-dark); }
.badge-m { background: var(--m-bg); color: var(--m-dark); }
.badge-shared { background: var(--shared-bg); color: var(--blue); }
.badge-low { background: #F1F5F9; color: #475569; }
.badge-medium { background: #FEF3C7; color: #92400E; }
.badge-high { background: #FEE2E2; color: #991B1B; }
.badge-overdue { background: #FEE2E2; color: #991B1B; }
.badge-done-by { background: #DCFCE7; color: #166534; }
.tag-badge { border-radius: 20px; padding: 2px 8px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; display: inline-flex; align-items: center; }
.tag-keto { background: #FEF3C7; color: #92400E; }
.tag-vegan { background: #DCFCE7; color: #166534; }
.tag-highProtein { background: #DBEAFE; color: #1E40AF; }
.tag-vegetarian { background: #D1FAE5; color: #065F46; }
.tag-glutenFree { background: #FFEDD5; color: #9A3412; }
.tag-dairyFree { background: #F3E8FF; color: #6B21A8; }
.tag-lowCalorie { background: #CFFAFE; color: #155E75; }
.tag-lowHistamine { background: #E0E7FF; color: #3730A3; }
.tag-antiInflammatory { background: #FEF9C3; color: #854D0E; }
.tag-badge.active-filter { box-shadow: 0 0 0 2px currentColor; }
.badge-for-p { background: var(--p-bg); color: var(--p-dark); }
.badge-for-m { background: var(--m-bg); color: var(--m-dark); }

/* Empty state */
.empty-state {
  text-align: center;
  padding: 48px 16px;
  color: var(--text-muted);
}
.empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 10px; }
.empty-state p { font-size: 0.9rem; }

/* Modals */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(13,27,42,0.55);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  animation: fadeIn 0.15s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: #fff;
  border-radius: 16px;
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(13,27,42,0.25);
  animation: slideUp 0.2s ease;
}
.modal-lg { max-width: 680px; }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-header {
  padding: 20px 20px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-header h2 { font-size: 1.1rem; font-weight: 700; }
.modal-close {
  background: none;
  border: none;
  font-size: 1.3rem;
  cursor: pointer;
  color: var(--text-muted);
  border-radius: 6px;
  padding: 2px 6px;
  transition: var(--transition);
}
.modal-close:hover { background: var(--bg); color: var(--text); }
.modal-body { padding: 16px 20px 20px; }
.modal-tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 16px; }
.modal-tab {
  padding: 8px 18px;
  border: none;
  background: none;
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: var(--transition);
}
.modal-tab.active { color: var(--blue); border-bottom-color: var(--blue); }

/* Forms */
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.05em; }
.form-group input[type=text],
.form-group input[type=url],
.form-group input[type=password],
.form-group input[type=datetime-local],
.form-group input[type=date],
.form-group input[type=number],
.form-group select,
.form-group textarea {
  width: 100%;
  border: 1.5px solid var(--border);
  border-radius: 9px;
  padding: 9px 12px;
  font-size: 0.9rem;
  background: #fff;
  color: var(--text);
  transition: var(--transition);
  font-family: inherit;
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--sky);
  box-shadow: 0 0 0 3px rgba(41,182,246,0.15);
}
.form-group textarea { resize: vertical; min-height: 70px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
.btn-primary {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 9px;
  padding: 9px 20px;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
}
.btn-primary:hover { background: var(--blue-hover); }
.btn-secondary {
  background: #fff;
  color: var(--text);
  border: 1.5px solid var(--border);
  border-radius: 9px;
  padding: 9px 16px;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
}
.btn-secondary:hover { background: var(--bg); }
.btn-danger {
  background: #FEE2E2;
  color: #DC2626;
  border: none;
  border-radius: 9px;
  padding: 9px 16px;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
}
.owner-selector { display: flex; gap: 8px; }
.owner-opt {
  flex: 1;
  border: 2px solid var(--border);
  border-radius: 9px;
  padding: 7px;
  text-align: center;
  cursor: pointer;
  font-size: 0.82rem;
  font-weight: 600;
  transition: var(--transition);
  background: #fff;
}
.owner-opt.sel-p { border-color: var(--p-color); background: var(--p-bg); color: var(--p-dark); }
.owner-opt.sel-m { border-color: var(--m-color); background: var(--m-bg); color: var(--m-dark); }
.owner-opt.sel-shared { border-color: var(--shared-color); background: var(--shared-bg); color: var(--blue); }

/* Toggle tags */
.tags-toggle-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.tag-toggle-btn {
  border: 1.5px solid var(--border);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 0.75rem;
  font-weight: 700;
  cursor: pointer;
  background: #fff;
  color: var(--text-muted);
  transition: var(--transition);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.tag-toggle-btn.on.keto { background: #FEF3C7; color: #92400E; border-color: #F59E0B; }
.tag-toggle-btn.on.vegan { background: #DCFCE7; color: #166534; border-color: #22C55E; }
.tag-toggle-btn.on.highProtein { background: #DBEAFE; color: #1E40AF; border-color: #3B82F6; }
.tag-toggle-btn.on.vegetarian { background: #D1FAE5; color: #065F46; border-color: #10B981; }
.tag-toggle-btn.on.glutenFree { background: #FFEDD5; color: #9A3412; border-color: #F97316; }
.tag-toggle-btn.on.dairyFree { background: #F3E8FF; color: #6B21A8; border-color: #A855F7; }
.tag-toggle-btn.on.lowCalorie { background: #CFFAFE; color: #155E75; border-color: #06B6D4; }
.tag-toggle-btn.on.lowHistamine { background: #E0E7FF; color: #3730A3; border-color: #6366F1; }
.tag-toggle-btn.on.antiInflammatory { background: #FEF9C3; color: #854D0E; border-color: #EAB308; }

/* For P/M toggles */
.for-toggles { display: flex; gap: 10px; margin-top: 6px; }
.for-toggle-btn {
  flex: 1;
  border: 2px solid var(--border);
  border-radius: 9px;
  padding: 7px;
  text-align: center;
  cursor: pointer;
  font-size: 0.82rem;
  font-weight: 600;
  transition: var(--transition);
  background: #fff;
}
.for-toggle-btn.on-p { border-color: var(--p-color); background: var(--p-bg); color: var(--p-dark); }
.for-toggle-btn.on-m { border-color: var(--m-color); background: var(--m-bg); color: var(--m-dark); }

/* Recipe card */
.recipe-card { cursor: pointer; }
.recipe-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.recipe-title { font-size: 1rem; font-weight: 700; margin-bottom: 8px; line-height: 1.3; }
.recipe-macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 8px 0; background: var(--bg); border-radius: 8px; padding: 8px; }
.macro-item { text-align: center; }
.macro-val { font-size: 0.9rem; font-weight: 700; color: var(--text); }
.macro-lbl { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; }
.recipe-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }

/* Grocery */
.grocery-generate-btn {
  background: linear-gradient(135deg, var(--navy-mid), var(--blue));
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 9px 18px;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  box-shadow: 0 2px 6px rgba(21,101,192,0.3);
}
.grocery-generate-btn:hover { transform: translateY(-1px); }
.clear-purchased-btn {
  background: #fff;
  color: #DC2626;
  border: 1.5px solid #FCA5A5;
  border-radius: 10px;
  padding: 9px 14px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
}
.clear-purchased-btn:hover { background: #FEE2E2; }

/* Fullscreen overlay */
.fullscreen-overlay {
  position: fixed;
  inset: 0;
  background: #fff;
  z-index: 300;
  overflow-y: auto;
  animation: fadeIn 0.15s ease;
}
.fullscreen-header {
  background: linear-gradient(135deg, var(--header-from), var(--header-to));
  color: #fff;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 10;
}
.fullscreen-header h2 { font-size: 1.1rem; font-weight: 700; }
.fullscreen-body { max-width: 700px; margin: 0 auto; padding: 20px; }
.store-section { margin-bottom: 28px; }
.store-section h3 { font-size: 0.9rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; border-bottom: 2px solid var(--border); padding-bottom: 6px; margin-bottom: 12px; }
.grocery-list-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 9px; margin-bottom: 7px; }
.grocery-list-item.purchased { opacity: 0.45; }
.grocery-list-item.purchased .gli-name { text-decoration: line-through; }
.gli-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; transition: var(--transition); }
.gli-check.checked { background: #22C55E; border-color: #22C55E; color: #fff; }
.gli-name { flex: 1; font-weight: 600; font-size: 0.9rem; }
.gli-qty { font-size: 0.82rem; color: var(--text-muted); }

/* Who are you overlay */
#who-overlay {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, var(--header-from), var(--header-to));
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
}
.who-box {
  background: #fff;
  border-radius: 20px;
  padding: 36px 40px;
  text-align: center;
  max-width: 320px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}
.who-box h2 { font-size: 1.5rem; font-weight: 800; margin-bottom: 8px; }
.who-box p { color: var(--text-muted); margin-bottom: 28px; font-size: 0.9rem; }
.who-btns { display: flex; gap: 14px; }
.who-btn {
  flex: 1;
  border: none;
  border-radius: 14px;
  padding: 18px;
  font-size: 1.8rem;
  font-weight: 800;
  cursor: pointer;
  transition: var(--transition);
}
.who-btn:hover { transform: scale(1.05); }
.who-btn-p { background: var(--p-bg); color: var(--p-color); border: 3px solid var(--p-color); }
.who-btn-m { background: var(--m-bg); color: var(--m-dark); border: 3px solid var(--m-color); }

/* Loading spinner */
.spinner { display: inline-block; width: 22px; height: 22px; border: 3px solid rgba(41,182,246,0.2); border-top-color: var(--sky); border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-box { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 32px; color: var(--text-muted); font-size: 0.9rem; }

/* API key input */
.input-with-toggle { position: relative; }
.input-with-toggle input { padding-right: 44px; }
.show-hide-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 0.85rem; }

/* Recipe detail modal */
.recipe-detail-section { margin-bottom: 18px; }
.recipe-detail-section h3 { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
.ingredients-list, .procedure-list { padding-left: 18px; }
.ingredients-list li { font-size: 0.88rem; margin-bottom: 4px; line-height: 1.5; }
.procedure-list li { font-size: 0.88rem; margin-bottom: 8px; line-height: 1.5; }
.macros-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
.macros-table th { background: var(--bg); padding: 6px 10px; text-align: left; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
.macros-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); }
.macros-table tr:last-child td { border-bottom: none; }

/* Preview box */
.preview-box { background: var(--bg); border-radius: 10px; padding: 14px; margin-bottom: 14px; max-height: 55vh; overflow-y: auto; }
.preview-box h3 { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
.preview-box .preview-note { font-size: 0.8rem; color: var(--text-muted); font-style: italic; }

/* Theme color pickers */
.theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.theme-swatch-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.theme-preset { width: 32px; height: 32px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; transition: var(--transition); flex-shrink: 0; }
.theme-preset:hover { transform: scale(1.12); }
.theme-preset.active { border-color: var(--text); box-shadow: 0 0 0 2px var(--white); }
.color-row { display: flex; align-items: center; gap: 8px; }
.color-row label { font-size: 0.8rem; flex: 1; color: var(--text-muted); }
.color-row input[type=color] { width: 36px; height: 28px; border: 1px solid var(--border); border-radius: 6px; padding: 2px; cursor: pointer; background: none; }

/* Settings panel — fixed overlay, always in DOM */
#settings-panel {
  position: fixed;
  inset: 0;
  background: rgba(13,27,42,0.6);
  z-index: 250;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  animation: fadeIn 0.15s ease;
}

/* Print */
@media print {
  body * { display: none !important; }
  .fullscreen-overlay, .fullscreen-overlay * { display: block !important; }
  .fullscreen-header .print-btn, .fullscreen-header .close-fl-btn { display: none !important; }
  .gli-check { border: 2px solid #000 !important; background: none !important; }
  .gli-check.checked::after { content: '✓'; font-weight: bold; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #8EB4D4; border-radius: 3px; }

/* ===== DASHBOARD ===== */
.dash-greeting { font-size: 1.5rem; font-weight: 800; margin-bottom: 2px; letter-spacing: -0.02em; }
.dash-date { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 18px; }
.dash-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
.dash-stat { background: var(--card-bg); border-radius: var(--radius); padding: 14px 10px; text-align: center; box-shadow: var(--shadow); cursor: pointer; transition: var(--transition); }
.dash-stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.dash-stat-val { font-size: 1.8rem; font-weight: 900; color: var(--sky); line-height: 1; }
.dash-stat-lbl { font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; }
.dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.dash-section { background: var(--card-bg); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.dash-section-title { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); margin-bottom: 10px; }
.dash-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.dash-row:last-child { border-bottom: none; }
/* Progress bars */
.progress-wrap { margin-bottom: 10px; }
.progress-label { display: flex; justify-content: space-between; font-size: 0.76rem; margin-bottom: 3px; font-weight: 600; }
.progress-track { height: 9px; background: var(--bg); border-radius: 99px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 99px; transition: width 0.6s cubic-bezier(.4,0,.2,1); }

/* ===== MEAL PLANNER ===== */
.meal-plan-scroll { overflow-x: auto; padding-bottom: 8px; }
.meal-plan-grid { display: flex; gap: 8px; min-width: max-content; }
.meal-day-col { display: flex; flex-direction: column; gap: 6px; width: 140px; }
.meal-day-header { text-align: center; font-size: 0.78rem; font-weight: 700; padding: 8px 4px; border-radius: 10px; background: var(--bg); }
.meal-day-header.today { background: linear-gradient(135deg,var(--sky),#0288d1); color: #fff; }
.meal-slot { background: var(--card-bg); border: 1.5px dashed var(--border); border-radius: 10px; padding: 8px; cursor: pointer; min-height: 60px; display: flex; flex-direction: column; transition: var(--transition); }
.meal-slot:hover { border-color: var(--sky); background: var(--sky-bg); }
.meal-slot.filled { border-style: solid; border-color: var(--sky); background: var(--sky-bg); }
.meal-slot-icon { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 2px; }
.meal-slot-name { font-size: 0.78rem; font-weight: 600; color: var(--text); line-height: 1.3; }
.meal-slot-cal { font-size: 0.68rem; color: var(--text-muted); margin-top: 2px; }
.meal-day-total { font-size: 0.72rem; text-align: center; padding: 5px 4px; color: var(--text-muted); font-weight: 600; background: var(--bg); border-radius: 8px; }
.week-summary { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 16px; }
.week-summary-stat { flex: 1; min-width: 100px; background: var(--card-bg); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); text-align: center; }
.week-summary-val { font-size: 1.4rem; font-weight: 900; }
.week-summary-lbl { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }

/* ===== BOTTOM NAV (mobile) ===== */
@media (max-width: 640px) {
  #tabs { position: fixed; bottom: 0; top: auto !important; left: 0; right: 0; z-index: 200; border-top: 1.5px solid var(--border); border-bottom: none !important; box-shadow: 0 -4px 20px rgba(0,0,0,0.14); padding-bottom: env(safe-area-inset-bottom); background: #fff; }
  #main { padding-bottom: 90px; }
  .tab-btn { font-size: 0.65rem; padding: 6px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .tab-icon { font-size: 1.25rem; line-height: 1; }
  .dash-stats { grid-template-columns: repeat(2, 1fr); }
}

/* Fade-in animation for tab content */
#main > * { animation: fadeIn 0.18s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ===== NUTRITION GOALS badge ===== */
.goal-over { color: #ef4444 !important; }

/* Recipe Builder */
.builder-table { width:100%; border-collapse:collapse; font-size:0.8rem; margin-top:10px; }
.builder-table th { background:var(--bg); color:var(--text-muted); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em; padding:5px 6px; text-align:right; border-bottom:2px solid var(--border); }
.builder-table th:first-child { text-align:left; }
.builder-table td { padding:5px 6px; border-bottom:1px solid var(--border); text-align:right; vertical-align:middle; }
.builder-table td:first-child { text-align:left; font-weight:600; }
.builder-table .totals-row td { background:var(--bg); font-weight:700; border-top:2px solid var(--border); color:var(--sky); }
.builder-table .serving-row td { background:rgba(41,182,246,0.05); font-weight:600; color:var(--text-muted); font-size:0.75rem; }
.builder-remove-btn { background:none; border:none; color:#ef4444; cursor:pointer; font-size:1rem; padding:0 4px; line-height:1; }
.builder-search-wrap { position:relative; }
.builder-suggestions { position:absolute; top:100%; left:0; right:0; background:var(--surface); border:1.5px solid var(--border); border-top:none; border-radius:0 0 8px 8px; max-height:180px; overflow-y:auto; z-index:100; box-shadow:var(--shadow-md); }
.builder-suggestion { padding:8px 12px; cursor:pointer; font-size:0.85rem; border-bottom:1px solid var(--border); }
.builder-suggestion:last-child { border-bottom:none; }
.builder-suggestion:hover, .builder-suggestion.active { background:var(--bg); color:var(--sky); }
.builder-row-unit { color:var(--text-muted); font-size:0.75rem; }
.net-carbs-note { font-size:0.75rem; color:var(--text-muted); margin-top:6px; }
.cost-total { font-size:0.88rem; font-weight:700; color:#22c55e; margin-top:6px; }
.ing-db-row { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); font-size:0.85rem; }
.ing-db-macros { display:flex; gap:8px; flex-wrap:wrap; font-size:0.75rem; color:var(--text-muted); }
.ing-db-macro-pill { background:var(--bg); border-radius:4px; padding:2px 6px; }

/* Flag & filter chips */
.flag-chip { display:inline-flex; align-items:center; border-radius:20px; padding:2px 7px; font-size:0.68rem; font-weight:700; margin:1px; }
.flag-chip-red { background:#FEE2E2; color:#DC2626; }
.flag-chip-orange { background:#FFF3CD; color:#D97706; }
.flag-chip-purple { background:#F3E8FF; color:#7C3AED; }
.flag-chip-green  { background:#DCFCE7; color:#15803D; }
.filter-chip { border:1.5px solid var(--border); border-radius:20px; padding:4px 11px; font-size:0.75rem; font-weight:600; cursor:pointer; background:#fff; color:var(--text-muted); transition:var(--transition); white-space:nowrap; }
.filter-chip:hover { background:var(--bg); }
.filter-chip.active { background:var(--sky); border-color:var(--sky); color:#fff; }

/* Responsive */
@media (max-width: 600px) {
  #header h1 { font-size: 1rem; }
  .form-row { grid-template-columns: 1fr; }
  .recipe-grid { grid-template-columns: 1fr; }
  .modal { max-height: 95vh; }
}

/* ===== WORKOUT TRACKER ===== */
.workout-subheader { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:8px; }
.workout-subheader h2 { font-size:1.1rem; font-weight:800; margin:0; }
.workout-view-link { background:none; border:none; color:var(--sky); font-size:0.85rem; font-weight:700; cursor:pointer; padding:0; text-decoration:underline; }

/* Muscle group badges */
.muscle-badge { display:inline-flex; align-items:center; border-radius:20px; padding:2px 8px; font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; }
.muscle-back       { background:#DBEAFE; color:#1E40AF; }
.muscle-chest      { background:#FEE2E2; color:#991B1B; }
.muscle-shoulders  { background:#FFEDD5; color:#9A3412; }
.muscle-arms       { background:#FEF3C7; color:#92400E; }
.muscle-core       { background:#D1FAE5; color:#065F46; }
.muscle-legs       { background:#F3E8FF; color:#6B21A8; }
.muscle-gluteships { background:#FCE7F3; color:#9D174D; }
.muscle-cardio     { background:#CFFAFE; color:#155E75; }
.muscle-custom     { background:#F1F5F9; color:#475569; }

/* Exercise form block */
.exercise-block { background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; margin-bottom:10px; box-shadow:var(--shadow); }
.exercise-block-header { display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
.exercise-block-name { font-weight:700; font-size:0.95rem; flex:1; }
.exercise-remove-btn { background:none; border:none; color:#ef4444; cursor:pointer; font-size:1rem; padding:2px 6px; border-radius:6px; transition:var(--transition); }
.exercise-remove-btn:hover { background:#FEE2E2; }
.ex-meta-select { border:1.5px solid var(--border); border-radius:20px; padding:3px 10px; font-size:0.75rem; font-weight:600; color:var(--text-muted); background:var(--bg); cursor:pointer; outline:none; transition:var(--transition); }
.ex-meta-select:hover, .ex-meta-select:focus { border-color:var(--sky); color:var(--text); }
.repeat-day-btn { border:1.5px solid var(--border); border-radius:20px; padding:5px 10px; font-size:0.78rem; font-weight:700; cursor:pointer; background:var(--card-bg); color:var(--text-muted); transition:var(--transition); }
.repeat-day-btn:hover { border-color:var(--sky); color:var(--sky); }
.repeat-day-btn.active { background:#7C3AED; border-color:#7C3AED; color:#fff; }

/* Set rows */
.set-row { display:flex; align-items:center; gap:6px; padding:5px 0; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.set-row:last-of-type { border-bottom:none; }
.set-label { font-size:0.75rem; color:var(--text-muted); font-weight:600; min-width:38px; }
.set-input { width:64px; border:1.5px solid var(--border); border-radius:7px; padding:4px 7px; font-size:0.85rem; background:#fff; color:var(--text); text-align:center; }
.set-input:focus { outline:none; border-color:var(--sky); box-shadow:0 0 0 2px rgba(41,182,246,0.15); }
.set-sep { color:var(--text-muted); font-size:0.8rem; }
.set-unit-toggle { border:1.5px solid var(--border); border-radius:7px; padding:4px 8px; font-size:0.75rem; font-weight:600; cursor:pointer; background:#fff; color:var(--text-muted); transition:var(--transition); }
.set-unit-toggle:hover { background:var(--bg); }
.set-remove-btn { background:none; border:none; color:#ef4444; cursor:pointer; font-size:0.85rem; padding:2px 5px; border-radius:5px; transition:var(--transition); margin-left:auto; }
.set-remove-btn:hover { background:#FEE2E2; }
.cardio-duration-wrap { display:flex; align-items:center; gap:8px; padding:6px 0; }
.add-set-btn { background:none; border:1.5px dashed var(--border); border-radius:7px; padding:4px 12px; font-size:0.78rem; font-weight:600; color:var(--text-muted); cursor:pointer; margin-top:6px; transition:var(--transition); }
.add-set-btn:hover { border-color:var(--sky); color:var(--sky); background:var(--sky-bg); }

/* Save workout bar */
.save-workout-bar { display:flex; justify-content:flex-end; gap:10px; align-items:center; margin-top:16px; padding-top:14px; border-top:2px solid var(--border); }

/* Workout history cards */
.workout-card { background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px; box-shadow:var(--shadow); transition:var(--transition); }
.workout-card:hover { box-shadow:var(--shadow-md); }
.workout-card-header { display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
.workout-card-date { font-weight:800; font-size:1rem; }
.workout-card-ex { display:flex; align-items:baseline; gap:6px; padding:4px 0; border-bottom:1px solid var(--border); font-size:0.85rem; }
.workout-card-ex:last-child { border-bottom:none; }
.workout-card-ex-name { font-weight:600; flex:1; }
.workout-card-ex-sets { font-size:0.78rem; color:var(--text-muted); }

/* Exercise picker modal */
.ex-pick-row { display:flex; align-items:center; gap:10px; padding:9px 12px; border-bottom:1px solid var(--border); cursor:pointer; transition:var(--transition); }
.ex-pick-row:last-child { border-bottom:none; }
.ex-pick-row:hover { background:var(--bg); }
.ex-pick-name { font-weight:600; font-size:0.88rem; flex:1; }
.ex-pick-equip { font-size:0.75rem; color:var(--text-muted); }

/* Workout calendar chip */
.workout-cal-chip { display:flex; align-items:center; gap:4px; margin-top:4px; background:#EDE9FE; color:#5B21B6; border-radius:6px; padding:3px 7px; font-size:0.68rem; font-weight:700; cursor:pointer; transition:var(--transition); border:none; width:100%; text-align:left; }
.workout-cal-chip:hover { background:#DDD6FE; }

/* Muscle group filter chips in picker */
.mg-filter-chips { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px; }

/* Print button */
.print-btn {
  background: none;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 5px 12px;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  transition: var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.print-btn:hover { background: var(--bg); border-color: var(--blue); color: var(--blue); }
</style>

// ========== SYNC ==========
const SYNC_ITEM_TYPES = { reminders:'reminder', todos:'todo', groceryItems:'grocery', recipes:'recipe' };
let syncPollInterval = null;
let lastSyncTime = null;
let syncStatus = 'idle'; // 'idle'|'syncing'|'ok'|'error'

function isSyncEnabled() {
  return !!(state.supabaseUrl && state.supabaseKey);
}

function syncHeaders() {
  return {
    'apikey': state.supabaseKey,
    'Authorization': 'Bearer ' + state.supabaseKey,
    'Content-Type': 'application/json'
  };
}

function setSyncStatus(s) {
  syncStatus = s;
  renderSyncIndicator();
}

function renderSyncIndicator() {
  const el = document.getElementById('sync-indicator');
  if (!el) return;
  if (!isSyncEnabled()) { el.textContent = ''; return; }
  const labels = { syncing:'syncing...', ok:'synced ' + (lastSyncTime ? lastSyncTime.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : ''), error:'sync error', idle:'' };
  const colors = { syncing:'rgba(255,255,255,0.7)', ok:'rgba(255,255,255,0.7)', error:'#FFD600', idle:'' };
  el.textContent = labels[syncStatus] || '';
  el.style.color = colors[syncStatus] || '';
}

async function syncFromRemote() {
  if (!isSyncEnabled()) return;
  setSyncStatus('syncing');
  try {
    const resp = await fetch(state.supabaseUrl + '/rest/v1/hh_items?select=id,type,data&deleted=eq.false', {
      headers: syncHeaders()
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const rows = await resp.json();
    state.reminders   = rows.filter(r => r.type === 'reminder').map(r => r.data);
    state.todos        = rows.filter(r => r.type === 'todo').map(r => r.data);
    state.groceryItems = rows.filter(r => r.type === 'grocery').map(r => r.data);
    state.recipes      = rows.filter(r => r.type === 'recipe').map(r => r.data);
    const storeRows    = rows.filter(r => r.type === 'store');
    if (storeRows.length > 0) state.customStores = storeRows.map(r => r.data.name).filter(Boolean);
    rows.filter(r => r.type === 'mealplan').forEach(r => { if (r.data.dateKey) state.mealPlan[r.data.dateKey] = r.data.slots; });
    const goalRow = rows.find(r => r.type === 'dailygoals');
    if (goalRow) state.dailyGoals = { ...state.dailyGoals, ...goalRow.data };
    saveLocalState();
    lastSyncTime = new Date();
    setSyncStatus('ok');
    render();
  } catch(e) {
    setSyncStatus('error');
    console.warn('Sync from remote failed:', e.message);
  }
}

async function pushItem(item, type) {
  if (!isSyncEnabled()) return;
  try {
    await fetch(state.supabaseUrl + '/rest/v1/hh_items', {
      method: 'POST',
      headers: { ...syncHeaders(), 'Prefer': 'resolution=merge-duplicates' },
      body: JSON.stringify({ id: item.id, type, data: item, deleted: false })
    });
    lastSyncTime = new Date();
    setSyncStatus('ok');
  } catch(e) {
    setSyncStatus('error');
    console.warn('Push item failed:', e.message);
  }
}

async function deleteRemoteItem(id) {
  if (!isSyncEnabled()) return;
  try {
    await fetch(state.supabaseUrl + '/rest/v1/hh_items?id=eq.' + encodeURIComponent(id), {
      method: 'PATCH',
      headers: syncHeaders(),
      body: JSON.stringify({ deleted: true })
    });
    setSyncStatus('ok');
  } catch(e) {
    setSyncStatus('error');
    console.warn('Remote delete failed:', e.message);
  }
}

async function testSyncConnection(url, key) {
  // Returns { ok, message }
  try {
    // First check credentials work at all
    const authResp = await fetch(url + '/rest/v1/', {
      headers: { 'apikey': key, 'Authorization': 'Bearer ' + key }
    });
    if (!authResp.ok) return { ok: false, message: 'Invalid URL or API key (HTTP ' + authResp.status + ')' };
    // Then check the table exists
    const tableResp = await fetch(url + '/rest/v1/hh_items?select=id&limit=1', {
      headers: { 'apikey': key, 'Authorization': 'Bearer ' + key }
    });
    if (!tableResp.ok) return { ok: false, message: 'Connected but table not found — run the SQL setup first' };
    return { ok: true, message: 'Connected! Save settings to start syncing.' };
  } catch(e) {
    return { ok: false, message: 'Network error — check your internet connection' };
  }
}

function startSyncPolling() {
  if (syncPollInterval) clearInterval(syncPollInterval);
  if (!isSyncEnabled()) return;
  syncFromRemote();
  syncPollInterval = setInterval(() => {
    if (!document.hidden) syncFromRemote();
  }, 30000);
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) state = { ...state, ...JSON.parse(raw) };
  } catch(e) {}
}
function saveLocalState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e) {}
}
function saveState() {
  saveLocalState();
  // Remote sync happens per-item via pushItem/deleteRemoteItem calls
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function formatDate(dt) {
  if (!dt) return '';
  const d = new Date(dt);
  if (isNaN(d)) return dt;
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
}
function formatDateTime(dt) {
  if (!dt) return '';
  const d = new Date(dt);
  if (isNaN(d)) return dt;
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric' }) + ' ' + d.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
}
function isOverdue(dt) {
  if (!dt) return false;
  return new Date(dt) < new Date();
}

// ========== USER ==========
function setUser(u) {
  state.currentUser = u;
  saveState();
  document.getElementById('who-overlay').style.display = 'none';
  updateUserButtons();
  render();
}
function updateUserButtons() {
  const bp = document.getElementById('btn-p');
  const bm = document.getElementById('btn-m');
  if (!bp || !bm) return;
  bp.className = 'user-btn' + (state.currentUser === 'P' ? ' active-p' : '');
  bm.className = 'user-btn' + (state.currentUser === 'M' ? ' active-m' : '');
}

// ========== TABS ==========
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    const tabs = ['home','reminders','todos','grocery','meals','recipes','workout'];
    b.classList.toggle('active', tabs[i] === tab);
  });
  render();
}

// ========== RENDER ==========
function render() {
  const main = document.getElementById('main');
  const content =
    activeTab === 'home'      ? renderHome() :
    activeTab === 'reminders' ? renderReminders() :
    activeTab === 'todos'     ? renderTodos() :
    activeTab === 'grocery'   ? renderGrocery() :
    activeTab === 'meals'     ? renderMealPlan() :
    activeTab === 'recipes'   ? renderRecipes() :
    activeTab === 'workout'   ? renderWorkout() : '';
  main.innerHTML = content;
}

// ========== OWNER FILTER HELPERS ==========
function matchesOwnerFilter(item, filterVal) {
  const cu = state.currentUser;
  if (filterVal === 'mine') return item.owner === cu || item.owner === 'Shared';
  if (filterVal === 'shared') return item.owner === 'Shared';
  return true; // 'all'
}

// ========== HELPERS ==========
function toDateKey(d) { return d.toISOString().split('T')[0]; }
function getWeekDays(offset) {
  const today = new Date(); const days = [];
  for (let i = 0; i < 7; i++) { const d = new Date(today); d.setDate(today.getDate() + offset*7 + i); days.push(d); }
  return days;
}
function calcDayNutrition(dateKey) {
  const slots = state.mealPlan[dateKey] || {};
  return Object.values(slots).reduce((a, m) => {
    if (!m?.macros) return a;
    return { calories: a.calories+(m.macros.calories||0), protein: a.protein+(m.macros.protein||0),
      fat: a.fat+(m.macros.fat||0), netCarbs: a.netCarbs+(m.macros.netCarbs||0), fiber: a.fiber+(m.macros.fiber||0) };
  }, { calories:0, protein:0, fat:0, netCarbs:0, fiber:0 });
}

           <button class="btn-secondary" style="margin-top:10px;font-size:0.78rem;padding:6px 12px;width:100%" onclick="switchTab('todos')">+ Add to-do</button>`}
      </div>
    </div></div>`;
  return html;
}

// ========== MEAL PLANNER ==========
function renderMealPlan() {
  const days = getWeekDays(mealPlanWeekOffset);
  const todayKey = toDateKey(new Date());
  const DAY_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const goals = state.dailyGoals || {};

  const weekNutr = days.reduce((a, d) => {
    const n = calcDayNutrition(toDateKey(d));
    return { calories: a.calories+n.calories, protein: a.protein+n.protein, netCarbs: a.netCarbs+n.netCarbs, fat: a.fat+n.fat };
  }, { calories:0, protein:0, netCarbs:0, fat:0 });
  const daysPlanned = days.filter(d => Object.keys(state.mealPlan[toDateKey(d)]||{}).length).length;

  let html = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">
      <div>
        <h2 style="margin:0;font-size:1.1rem;font-weight:800">&#128197; Weekly Meal Plan</h2>
        <div style="font-size:0.8rem;color:var(--text-muted)">${days[0].toLocaleDateString([],{month:'short',day:'numeric'})} – ${days[6].toLocaleDateString([],{month:'short',day:'numeric'})}</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <button class="btn-secondary" onclick="mealPlanWeekOffset--;render()" style="padding:6px 10px">&#8592; Prev</button>
        <button class="btn-secondary" onclick="mealPlanWeekOffset=0;render()" style="padding:6px 10px">Today</button>
        <button class="btn-secondary" onclick="mealPlanWeekOffset++;render()" style="padding:6px 10px">Next &#8594;</button>
        <button class="btn-primary" onclick="sendWeekToGrocery()" style="padding:6px 12px">&#128722; Send to Grocery</button>
        <button class="print-btn" onclick="showPrintModal('meals')">&#128424; Print</button>
      </div>
    </div>
    <div class="meal-plan-scroll"><div class="meal-plan-grid">`;

  days.forEach(day => {
    const key = toDateKey(day);
    const isToday = key === todayKey;
    const meals = state.mealPlan[key] || {};
    const dn = calcDayNutrition(key);
    const hasMeals = Object.values(meals).some(Boolean);
    const calPct = goals.calories && dn.calories ? Math.min(100, Math.round(dn.calories/goals.calories*100)) : 0;

    html += `<div class="meal-day-col">
      <div class="meal-day-header ${isToday?'today':''}">
        <div>${DAY_SHORT[day.getDay()]}</div>
        <div style="font-size:0.95rem;font-weight:800">${day.getDate()}</div>
      </div>`;

    MEAL_SLOT_KEYS.forEach(slot => {
      const meal = meals[slot];
      html += `<div class="meal-slot ${meal?'filled':''}" onclick="openMealSlotModal('${key}','${slot}')">
        <div class="meal-slot-icon">${MEAL_SLOT_ICONS[slot]} ${MEAL_SLOT_LBLS[slot]}</div>`;
      if (meal) {
        html += `<div class="meal-slot-name">${escapeHtml(meal.name)}</div>`;
        if (meal.macros?.calories) html += `<div class="meal-slot-cal">${meal.macros.calories} kcal</div>`;
        html += `<button onclick="event.stopPropagation();clearMealSlot('${key}','${slot}')" style="background:none;border:none;cursor:pointer;color:#ef4444;font-size:0.65rem;padding:2px 0;margin-top:auto;align-self:flex-end">✕ clear</button>`;
      } else {
        html += `<div style="font-size:0.72rem;color:var(--text-muted);margin-top:auto">+ Add</div>`;
      }
      html += `</div>`;
    });

    // Logged workout chip for this day
    const dayWorkout = (state.workouts || []).find(w => w.date === key);
    if (dayWorkout) {
      const exCount = (dayWorkout.exercises || []).length;
      html += `<button class="workout-cal-chip" onclick="showWorkoutSummaryModal('${dayWorkout.id}')">&#128170; Workout (${exCount} exercise${exCount!==1?'s':''})</button>`;
    }
    // Recurring template chips for this day of week
    const dow = new Date(key + 'T12:00:00').getDay();
    (state.workoutTemplates || []).filter(t => t.repeatDays.includes(dow)).forEach(t => {
      const logged = !!dayWorkout;
      if (!logged) {
        html += `<button class="workout-cal-chip" style="opacity:0.6;border:1.5px dashed #7C3AED;background:#F5F3FF"
          onclick="prefillWorkoutFromTemplate('${t.id}','${key}')" title="Tap to log this recurring workout">
          🔁 ${escapeHtml(t.name||'Workout')}</button>`;
      }
    });

    if (hasMeals) {
      html += `<div class="meal-day-total">
        ${dn.calories} kcal
        ${calPct ? `<div style="background:var(--border);border-radius:99px;height:4px;margin-top:3px"><div style="background:${calPct>=100?'#ef4444':'var(--sky)'};width:${calPct}%;height:100%;border-radius:99px"></div></div>` : ''}
        <div style="font-size:0.62rem;margin-top:2px">${Math.round(dn.protein)}g prot</div>
      </div>`;
    }
    html += `</div>`;
  });

  html += `</div></div>`;

  if (daysPlanned > 0) {
    html += `<div class="week-summary">
      <div class="week-summary-stat"><div class="week-summary-val" style="color:var(--sky)">${Math.round(weekNutr.calories).toLocaleString()}</div><div class="week-summary-lbl">Week Calories</div></div>
      <div class="week-summary-stat"><div class="week-summary-val" style="color:#22c55e">${Math.round(weekNutr.protein)}g</div><div class="week-summary-lbl">Total Protein</div></div>
      <div class="week-summary-stat"><div class="week-summary-val" style="color:var(--yellow)">${Math.round(weekNutr.netCarbs)}g</div><div class="week-summary-lbl">Net Carbs</div></div>
      <div class="week-summary-stat"><div class="week-summary-val" style="color:var(--text-muted)">${daysPlanned}/7</div><div class="week-summary-lbl">Days Planned</div></div>
    </div>`;
  } else {
    html += `<div class="card" style="text-align:center;padding:32px;margin-top:16px">
      <div style="font-size:2.5rem;margin-bottom:8px">📅</div>
      <div style="font-weight:700;margin-bottom:6px">Start planning your week</div>
      <div style="color:var(--text-muted);font-size:0.88rem">Click any slot above to assign a meal or recipe. When done, send the whole week's ingredients to your Grocery List.</div>
    </div>`;
  }
  return html;
}

function openMealSlotModal(dateKey, slot) {
  const current = (state.mealPlan[dateKey] || {})[slot];
  const recipes = state.recipes;
  const recipeRows = recipes.map(r => {
    const mp = r.macrosPerServing || {};
    const macros = { calories: mp.calories||0, protein: mp.protein||0, fat: mp.fat||0, netCarbs: mp.netCarbs||0, fiber: mp.fiber||0 };
    return `<div class="builder-suggestion" onclick='assignMealSlot("${dateKey}","${slot}",${JSON.stringify({type:'recipe',id:r.id,name:r.title,macros})})'>
      <div style="font-weight:600">${escapeHtml(r.title)}</div>
      ${mp.calories ? `<div style="font-size:0.72rem;color:var(--text-muted)">${mp.calories} kcal · ${mp.protein||0}g prot · ${mp.netCarbs||0}g nc</div>` : ''}
    </div>`;
  }).join('');

  document.getElementById('modal-container').innerHTML = `
    <div class="modal-backdrop" onclick="closeModalOnBackdrop(event)">
      <div class="modal modal-lg">
        <div class="modal-header"><h2>${MEAL_SLOT_ICONS[slot]} ${MEAL_SLOT_LBLS[slot]}</h2><button class="modal-close" onclick="closeModal()">&#x2715;</button></div>
        <div class="modal-body">
          <div class="form-group" style="margin-bottom:12px">
            <label>Custom meal name</label>
            <div style="display:flex;gap:8px">
              <input id="custom-meal-name" type="text" placeholder="e.g. Overnight Oats, Leftover soup..." value="${current && !current.id ? escapeHtml(current.name) : ''}">
              <button class="btn-primary" style="white-space:nowrap" onclick="assignMealSlot('${dateKey}','${slot}',{type:'custom',name:document.getElementById('custom-meal-name').value.trim()})">Save</button>
            </div>
          </div>
          ${recipes.length ? `
            <div style="font-size:0.8rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px">Or pick from saved recipes</div>
            <div style="max-height:280px;overflow-y:auto;border:1.5px solid var(--border);border-radius:8px">${recipeRows}</div>
          ` : `<div style="color:var(--text-muted);font-size:0.85rem">No recipes saved yet. <button class="btn-secondary" style="font-size:0.8rem;padding:4px 10px;margin-left:6px" onclick="closeModal();switchTab('recipes')">Add recipes</button></div>`}
          <div class="form-actions" style="margin-top:14px">
            <button class="btn-secondary" onclick="closeModal()">Cancel</button>
            ${current ? `<button class="btn-secondary" style="color:#ef4444" onclick="clearMealSlot('${dateKey}','${slot}');closeModal()">Clear Slot</button>` : ''}
          </div>
        </div>
      </div>
    </div>`;
}

function assignMealSlot(dateKey, slot, meal) {
  if (!meal || !meal.name) return;
  if (!state.mealPlan[dateKey]) state.mealPlan[dateKey] = {};
  state.mealPlan[dateKey][slot] = meal;
  saveLocalState();
  pushItem({ id: 'mealplan_' + dateKey, dateKey, slots: state.mealPlan[dateKey] }, 'mealplan');
  closeModal(); render();
}

function clearMealSlot(dateKey, slot) {
  if (!state.mealPlan[dateKey]) return;
  delete state.mealPlan[dateKey][slot];
  if (!Object.keys(state.mealPlan[dateKey]).length) delete state.mealPlan[dateKey];
  saveLocalState(); render();
}

function sendWeekToGrocery() {
  const days = getWeekDays(mealPlanWeekOffset);
  const seen = new Set(); let added = 0;
  days.forEach(day => {
    Object.values(state.mealPlan[toDateKey(day)] || {}).forEach(meal => {
      if (!meal || meal.type !== 'recipe') return;
      const recipe = state.recipes.find(r => r.id === meal.id);
      if (!recipe) return;
      (recipe.ingredients || []).forEach(ing => {
        if (seen.has(ing)) return; seen.add(ing);
        const item = { id: uid(), name: ing, store: 'Any', checked: false, owner: state.currentUser||'shared', addedAt: Date.now() };
        state.groceryItems.push(item); pushItem(item, 'grocery'); added++;
      });
    });
  });
  saveLocalState();
  if (added) { alert(`Added ${added} items to your Grocery List!`); switchTab('grocery'); }
  else alert('No recipe ingredients to add. Assign saved recipes (not custom names) to meal slots first.');
}

// ========== REMINDERS ==========
function renderReminders() {
  let items = state.reminders.filter(r => matchesOwnerFilter(r, reminderFilters.owner));
  if (reminderFilters.status === 'active') items = items.filter(r => !r.done);
  else if (reminderFilters.status === 'done') items = items.filter(r => r.done);
  items.sort((a,b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    if (a.dueDate && b.dueDate) return new Date(a.dueDate) - new Date(b.dueDate);
    if (a.dueDate) return -1;
    if (b.dueDate) return 1;
    return 0;
  });
  let html = `
    <div class="filters-bar">
      <span class="filter-label">Owner:</span>
      <div class="filter-btn-group">
        <button class="filt-btn ${reminderFilters.owner==='mine'?'active':''}" onclick="setReminderFilter('owner','mine')">Mine</button>
        <button class="filt-btn ${reminderFilters.owner==='shared'?'active':''}" onclick="setReminderFilter('owner','shared')">Shared</button>
        <button class="filt-btn ${reminderFilters.owner==='all'?'active':''}" onclick="setReminderFilter('owner','all')">All</button>
      </div>
      <span class="filter-label" style="margin-left:8px">Status:</span>
      <div class="filter-btn-group">
        <button class="filt-btn ${reminderFilters.status==='active'?'active':''}" onclick="setReminderFilter('status','active')">Active</button>
        <button class="filt-btn ${reminderFilters.status==='done'?'active':''}" onclick="setReminderFilter('status','done')">Done</button>
        <button class="filt-btn ${reminderFilters.status==='all'?'active':''}" onclick="setReminderFilter('status','all')">All</button>
      </div>
    </div>
    <button class="add-btn" onclick="openAddReminder()">+ Add Reminder</button>
    <div class="cards-grid">`;
  if (items.length === 0) {
    html += `<div class="empty-state"><div class="empty-icon">&#9200;</div><p>No reminders here yet.</p></div>`;
  } else {
    items.forEach(r => { html += renderReminderCard(r); });
  }
  html += `</div>`;
  return html;
}
function renderReminderCard(r) {
  const over = r.dueDate && !r.done && isOverdue(r.dueDate);
  return `<div class="card ${r.done?'done':''} ${over?'overdue':''}">
    <div class="card-header">
      <div class="card-check ${r.done?'checked':''}" onclick="toggleReminder('${r.id}')">${r.done?'&#10003;':''}</div>
      <div style="flex:1">
        <div class="card-title ${r.done?'strikethrough':''}">${escapeHtml(r.title)}</div>
        <div class="card-meta">
          ${ownerBadge(r.owner)}
          ${r.dueDate ? `<span class="${over?'badge badge-overdue':''}">&#128197; ${formatDateTime(r.dueDate)}</span>` : ''}
          ${over ? `<span class="badge badge-overdue">Overdue</span>` : ''}
        </div>
        ${r.notes ? `<div class="card-notes">${escapeHtml(r.notes)}</div>` : ''}
      </div>
    </div>
    <div class="card-actions">
      <button class="card-btn" onclick="openEditReminder('${r.id}')">Edit</button>
      <button class="card-btn danger" onclick="deleteReminder('${r.id}')">Delete</button>
    </div>
  </div>`;
}
function setReminderFilter(k, v) { reminderFilters[k] = v; render(); }
function toggleReminder(id) {
  const r = state.reminders.find(x => x.id === id);
  if (r) { r.done = !r.done; saveState(); render(); pushItem(r, 'reminder'); }
}
function deleteReminder(id) {
  if (!confirm('Delete this reminder?')) return;
  state.reminders = state.reminders.filter(x => x.id !== id);
  saveState(); render(); deleteRemoteItem(id);
}
function openAddReminder() { editingId = null; showReminderModal(null); }
function openEditReminder(id) { editingId = id; showReminderModal(state.reminders.find(x => x.id === id)); }
function showReminderModal(r) {
  const title = r ? escapeHtml(r.title) : '';
  const notes = r ? escapeHtml(r.notes||'') : '';
  const dueDate = r ? (r.dueDate||'') : '';
  const owner = r ? r.owner : (state.currentUser||'P');
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-backdrop" onclick="closeModalOnBackdrop(event)">
      <div class="modal">
        <div class="modal-header">
          <h2>${r ? 'Edit Reminder' : 'Add Reminder'}</h2>
          <button class="modal-close" onclick="closeModal()">&#x2715;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>Title *</label>
            <input type="text" id="rem-title" value="${title}" placeholder="Reminder title">
          </div>
          <div class="form-group">
            <label>Notes</label>
            <textarea id="rem-notes" placeholder="Optional notes...">${notes}</textarea>
          </div>
          <div class="form-group">
            <label>Due Date &amp; Time</label>
            <input type="datetime-local" id="rem-due" value="${dueDate}">
          </div>
          <div class="form-group">
            <label>Owner</label>
            <div class="owner-selector">
              <div class="owner-opt ${owner==='P'?'sel-p':''}" onclick="selectOwner(this,'P')">P</div>
              <div class="owner-opt ${owner==='M'?'sel-m':''}" onclick="selectOwner(this,'M')">M</div>
              <div class="owner-opt ${owner==='Shared'?'sel-shared':''}" onclick="selectOwner(this,'Shared')">Shared</div>
            </div>
            <input type="hidden" id="rem-owner" value="${owner}">
          </div>
          <div class="form-actions">
            <button class="btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn-primary" onclick="saveReminder()">Save</button>
          </div>
        </div>
      </div>
    </div>`;
}
function saveReminder() {
  const title = document.getElementById('rem-title').value.trim();
  if (!title) { alert('Title is required'); return; }
  const obj = {
    id: editingId || uid(),
    title,
    notes: document.getElementById('rem-notes').value.trim(),
    dueDate: document.getElementById('rem-due').value,
    owner: document.getElementById('rem-owner').value,
    done: editingId ? state.reminders.find(x => x.id === editingId).done : false,
    createdAt: editingId ? state.reminders.find(x => x.id === editingId).createdAt : Date.now()
  };
  if (editingId) state.reminders = state.reminders.map(x => x.id === editingId ? obj : x);
  else state.reminders.push(obj);
  saveState(); closeModal(); render(); pushItem(obj, 'reminder');
}

// ========== TO-DO ==========
function renderTodos() {
  let items = state.todos.filter(t => matchesOwnerFilter(t, todoFilters.owner));
  if (todoFilters.priority !== 'all') items = items.filter(t => t.priority === todoFilters.priority);
  if (todoFilters.assignee !== 'all') items = items.filter(t => t.assignee === todoFilters.assignee || t.assignee === 'Both');
  const priorityOrder = { high: 0, medium: 1, low: 2 };
  items.sort((a,b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    return (priorityOrder[a.priority]||2) - (priorityOrder[b.priority]||2);
  });
  let html = `
    <div class="filters-bar">
      <span class="filter-label">Owner:</span>
      <div class="filter-btn-group">
        <button class="filt-btn ${todoFilters.owner==='mine'?'active':''}" onclick="setTodoFilter('owner','mine')">Mine</button>
        <button class="filt-btn ${todoFilters.owner==='shared'?'active':''}" onclick="setTodoFilter('owner','shared')">Shared</button>
        <button class="filt-btn ${todoFilters.owner==='all'?'active':''}" onclick="setTodoFilter('owner','all')">All</button>
      </div>
      <span class="filter-label" style="margin-left:8px">Priority:</span>
      <div class="filter-btn-group">
        <button class="filt-btn ${todoFilters.priority==='all'?'active':''}" onclick="setTodoFilter('priority','all')">All</button>
        <button class="filt-btn ${todoFilters.priority==='high'?'active':''}" onclick="setTodoFilter('priority','high')">High</button>
        <button class="filt-btn ${todoFilters.priority==='medium'?'active':''}" onclick="setTodoFilter('priority','medium')">Medium</button>
        <button class="filt-btn ${todoFilters.priority==='low'?'active':''}" onclick="setTodoFilter('priority','low')">Low</button>
      </div>
      <span class="filter-label" style="margin-left:8px">Assignee:</span>
      <div class="filter-btn-group">
        <button class="filt-btn ${todoFilters.assignee==='all'?'active':''}" onclick="setTodoFilter('assignee','all')">All</button>
        <button class="filt-btn ${todoFilters.assignee==='P'?'active':''}" onclick="setTodoFilter('assignee','P')">P</button>
        <button class="filt-btn ${todoFilters.assignee==='M'?'active':''}" onclick="setTodoFilter('assignee','M')">M</button>
        <button class="filt-btn ${todoFilters.assignee==='Both'?'active':''}" onclick="setTodoFilter('assignee','Both')">Both</button>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px">
      <button class="add-btn" style="margin-bottom:0" onclick="openAddTodo()">+ Add To-Do</button>
      <button class="print-btn" onclick="showPrintModal('todos')">&#128424; Print</button>
    </div>
    <div class="cards-grid">`;
  if (items.length === 0) {
    html += `<div class="empty-state"><div class="empty-icon">&#9989;</div><p>Nothing to do here!</p></div>`;
  } else {
    items.forEach(t => { html += renderTodoCard(t); });
  }
  html += `</div>`;
  return html;
}
function renderTodoCard(t) {
  const over = t.dueDate && !t.done && isOverdue(t.dueDate);
  const priorityCls = { low:'badge-low', medium:'badge-medium', high:'badge-high' }[t.priority] || 'badge-low';
  return `<div class="card ${t.done?'done':''} ${over?'overdue':''}">
    <div class="card-header">
      <div class="card-check ${t.done?'checked':''}" onclick="toggleTodo('${t.id}')">${t.done?'&#10003;':''}</div>
      <div style="flex:1">
        <div class="card-title ${t.done?'strikethrough':''}">${escapeHtml(t.title)}</div>
        <div class="card-meta">
          ${ownerBadge(t.owner)}
          <span class="badge ${priorityCls}">${t.priority||'low'}</span>
          ${t.assignee ? `<span style="font-size:0.78rem">&#8594; ${escapeHtml(t.assignee)}</span>` : ''}
          ${t.dueDate ? `<span class="${over?'badge badge-overdue':''}">&#128197; ${formatDate(t.dueDate)}</span>` : ''}
          ${over ? `<span class="badge badge-overdue">Overdue</span>` : ''}
          ${t.doneBy ? `<span class="badge badge-done-by">Done by ${escapeHtml(t.doneBy)}</span>` : ''}
        </div>
        ${t.notes ? `<div class="card-notes">${escapeHtml(t.notes)}</div>` : ''}
      </div>
    </div>
    <div class="card-actions">
      <button class="card-btn" onclick="openEditTodo('${t.id}')">Edit</button>
      <button class="card-btn danger" onclick="deleteTodo('${t.id}')">Delete</button>
    </div>
  </div>`;
}
function setTodoFilter(k, v) { todoFilters[k] = v; render(); }
function toggleTodo(id) {
  const t = state.todos.find(x => x.id === id);
  if (t) {
    t.done = !t.done;
    t.doneBy = t.done ? (state.currentUser||'?') : null;
    saveState(); render(); pushItem(t, 'todo');
  }
}
function deleteTodo(id) {
  if (!confirm('Delete this task?')) return;
  state.todos = state.todos.filter(x => x.id !== id);
  saveState(); render(); deleteRemoteItem(id);
}
function openAddTodo() { editingId = null; showTodoModal(null); }
function openEditTodo(id) { editingId = id; showTodoModal(state.todos.find(x => x.id === id)); }
function showTodoModal(t) {
  const title = t ? escapeHtml(t.title) : '';
  const notes = t ? escapeHtml(t.notes||'') : '';
  const dueDate = t ? (t.dueDate||'') : '';
  const owner = t ? t.owner : (state.currentUser||'P');
  const priority = t ? t.priority : 'medium';
  const assignee = t ? t.assignee : 'Both';
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-backdrop" onclick="closeModalOnBackdrop(event)">
      <div class="modal">
        <div class="modal-header">
          <h2>${t ? 'Edit Task' : 'Add Task'}</h2>
          <button class="modal-close" onclick="closeModal()">&#x2715;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>Title *</label>
            <input type="text" id="todo-title" value="${title}" placeholder="Task title">
          </div>
          <div class="form-group">
            <label>Notes</label>
            <textarea id="todo-notes" placeholder="Optional notes...">${notes}</textarea>

function saveTodo() {

    notes: document.getElementById('todo-notes').value.trim(),
    dueDate: document.getElementById('todo-due').value,
    priority: document.getElementById('todo-priority').value,
    owner: document.getElementById('todo-owner').value,

    doneBy: existing ? existing.doneBy : null,

  };
  if (editingId) state.todos = state.todos.map(x => x.id === editingId ? obj : x);
  else state.todos.push(obj);

}
function setGroceryFilter(k, v) { groceryFilters[k] = v; render(); }
function toggleGrocery(id) {
  const g = state.groceryItems.find(x => x.id === id);
  if (g) { g.purchased = !g.purchased; saveState(); render(); pushItem(g, 'grocery'); }
}
function toggleGroceryFromList(id) {
  const g = state.groceryItems.find(x => x.id === id);
  if (g) {
    g.purchased = !g.purchased;
    saveState();
    const el = document.querySelector(`[data-grocery-id="${id}"]`);
    if (el) {
      el.classList.toggle('purchased', g.purchased);

}
function deleteGrocery(id) {

  state.groceryItems = state.groceryItems.filter(x => x.id !== id);
  saveState(); render(); deleteRemoteItem(id);
}
function clearPurchased() {
  if (!confirm('Remove all purchased items?')) return;
  const toDelete = state.groceryItems.filter(x => x.purchased).map(x => x.id);
  state.groceryItems = state.groceryItems.filter(x => !x.purchased);

function openAddGrocery() { editingId = null; showGroceryModal(null); }
function openEditGrocery(id) { editingId = id; showGroceryModal(state.groceryItems.find(x => x.id === id)); }

function saveGrocery() {

    quantity: document.getElementById('groc-qty').value.trim(),

function openGroceryList() {
  const items = state.groceryItems;

// ========== RECIPES ==========
const TAG_LABELS = {
  keto:'Keto', vegan:'Vegan', highProtein:'High-Protein', vegetarian:'Vegetarian',
  glutenFree:'Gluten-Free', dairyFree:'Dairy-Free', lowCalorie:'Low-Calorie',
  lowHistamine:'Low-Histamine', antiInflammatory:'Anti-Inflammatory'
};
const TAG_KEYS = Object.keys(TAG_LABELS);

function renderRecipes() {
  let items = state.recipes;
  if (recipeFilters.search) {
    const q = recipeFilters.search.toLowerCase();
    items = items.filter(r => r.title.toLowerCase().includes(q));
  }
  if (recipeFilters.tags.length > 0) {
    items = items.filter(r => recipeFilters.tags.every(tag => r.tags && r.tags[tag]));
  }
  const tagFilterHtml = TAG_KEYS.map(tag => {
    const on = recipeFilters.tags.includes(tag);
    return `<button class="tag-toggle-btn ${on?'on '+tag:''}" onclick="toggleRecipeTagFilter('${tag}')">${TAG_LABELS[tag]}</button>`;
  }).join('');
  let html = `
    <div class="filters-bar" style="flex-direction:column;align-items:flex-start">
      <div style="display:flex;gap:8px;align-items:center;width:100%;flex-wrap:wrap">
        <input type="text" style="border:1.5px solid var(--border);border-radius:9px;padding:7px 12px;font-size:0.88rem;flex:1;min-width:160px" placeholder="Search recipes..." value="${escapeHtml(recipeFilters.search)}" oninput="setRecipeSearch(this.value)">
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">
        <span class="filter-label" style="align-self:center">Filter by tag:</span>
        ${tagFilterHtml}
        ${recipeFilters.tags.length > 0 ? `<button class="filt-btn" onclick="clearRecipeTagFilters()">Clear</button>` : ''}
      </div>
    </div>
    <button class="btn-secondary" onclick="showIngredientDbModal()" style="padding:8px 14px;font-size:0.82rem">Ingredient DB</button>
    <button class="add-btn" onclick="openAddRecipe()">+ Add Recipe</button>
    <div class="recipe-grid">`;
  if (items.length === 0) {
    html += `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">&#127859;</div><p>No recipes yet. Add one!</p></div>`;
  } else {
    items.forEach(r => { html += renderRecipeCard(r); });
  }
  html += `</div>`;
  return html;
}
function renderRecipeCard(r) {
  const tags = r.tags || {};
  const tagBadges = TAG_KEYS.filter(t => tags[t]).map(t => {
    const isActive = recipeFilters.tags.includes(t);
    return `<span class="tag-badge tag-${t} ${isActive?'active-filter':''}">${TAG_LABELS[t]}</span>`;
  }).join('');
  const forBadges = [r.forP ? `<span class="badge badge-for-p">For P</span>` : '', r.forM ? `<span class="badge badge-for-m">For M</span>` : ''].filter(Boolean).join('');
  const mp = r.macrosPerServing || {};
  const grade = r.healthGrade ? healthGrade(r.macrosPerServing) : null;

  return `<div class="card recipe-card" onclick="openRecipeDetail('${r.id}')">

      <div class="recipe-title" style="flex:1">${escapeHtml(r.title)}</div>

      <div class="macro-item"><div class="macro-val">${mp.calories}</div><div class="macro-lbl">kcal</div></div>
      <div class="macro-item"><div class="macro-val">${mp.protein}g</div><div class="macro-lbl">protein</div></div>
      <div class="macro-item"><div class="macro-val">${mp.netCarbs}g</div><div class="macro-lbl">net carbs</div></div>

    <div class="recipe-tags">${tagBadges}${forBadges}</div>

      <button class="card-btn danger" onclick="deleteRecipe('${r.id}')">Delete</button>
    </div>

function toggleRecipeTagFilter(tag) {

function clearRecipeTagFilters() { recipeFilters.tags = []; render(); }
function setRecipeSearch(v) { recipeFilters.search = v; render(); }
function deleteRecipe(id) {

          <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
            <span style="font-size:0.85rem;color:var(--text-muted)">Servings:</span>
            <button onclick="openRecipeDetail('${r.id}',${sv-1})" style="background:var(--bg);border:1px solid var(--border);border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:1rem" ${sv<=1?'disabled':''}>−</button>
            <strong style="min-width:24px;text-align:center">${sv}</strong>
            <button onclick="openRecipeDetail('${r.id}',${sv+1})" style="background:var(--bg);border:1px solid var(--border);border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:1rem">+</button>
            ${sv !== origSv ? `<span style="font-size:0.78rem;color:var(--text-muted)">(original: ${origSv})</span>` : ''}
            ${r.estimatedCostTotal ? `<span style="margin-left:auto;font-size:0.85rem;color:#22c55e;font-weight:700">Est. cost: ${formatCost(r.estimatedCostTotal * mult)}</span>` : ''}

{"title":"Recipe name","servings":4,"ingredients":["1 cup flour","2 eggs"],"procedure":["Step 1: ...","Step 2: ..."],"macrosPerServing":{"calories":350,"protein":25,"carbs":40,"fat":12,"fiber":5,"netCarbs":35},"macrosTotal":{"calories":1400,"protein":100,"carbs":160,"fat":48,"fiber":20,"netCarbs":140},"tags":{"keto":false,"vegan":false,"highProtein":false,"vegetarian":false,"glutenFree":false,"dairyFree":false,"lowCalorie":false,"lowHistamine":false,"antiInflammatory":false},"notes":""}

          maxOutputTokens: 8192,
          responseMimeType: 'application/json',
          responseSchema: {
            type: 'object',
            properties: {

              servings: { type: 'number' },
              ingredients: { type: 'array', items: { type: 'string' } },
              procedure: { type: 'array', items: { type: 'string' } },
              macrosPerServing: { type: 'object', properties: { calories: { type: 'number' }, protein: { type: 'number' }, carbs: { type: 'number' }, fat: { type: 'number' }, fiber: { type: 'number' }, netCarbs: { type: 'number' } } },

    }
    const data = await resp.json();
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    let parsed;
    try {
      // 1. Try direct parse first (responseMimeType:json should give clean output)
      let cleaned = text.replace(/^```json?\s*/i,'').replace(/```\s*$/,'').trim();
      try {
        parsed = JSON.parse(cleaned);
      } catch(_) {
        // 2. Extract the first {...} block from anywhere in the response
        const match = text.match(/\{[\s\S]*\}/);
        if (!match) throw new Error('no JSON object found');
        parsed = JSON.parse(match[0]);
      }
    } catch(e) {

    pendingRecipe = parsed;

// ========== INGREDIENT DATABASE & RECIPE BUILDER ==========
const UNIT_DEFAULTS = { g:1, oz:28.35, lb:453.6, kg:1000, ml:1, l:1000, fl_oz:29.57, cup:240, tbsp:15, tsp:5, each:100, piece:100, slice:30, clove:3, scoop:30, can:400, bag:170, head:500, fillet:170, stick:113, half:100, medium:120, large:150, square:10 };

function getAllIngredients() {
  return [...INGREDIENT_DB, ...(state.customIngredients || [])];
}
function getIngById(id) {
  return getAllIngredients().find(i => i.id === id);
}
function getGrams(ing, amount, unit) {
  const u = unit.toLowerCase();
  const ingGrams = ing.units && ing.units[u] != null ? ing.units[u] : (UNIT_DEFAULTS[u] || 100);
  return amount * ingGrams;
}
function calcIngMacros(ing, grams) {
  const f = grams / 100;
  const carbs = round1(ing.carbs * f);
  const fiber = round1(ing.fiber * f);
  return {
    cal:     Math.round(ing.cal * f),
    fat:     round1(ing.fat * f),
    carbs,
    fiber,
    pro:     round1(ing.pro * f),
    netCarbs: round1(Math.max(0, carbs - fiber)),
    sugar:   round1((ing.sugar || 0) * f),
    sodium:  Math.round((ing.sodium || 0) * f),
    satFat:  round1((ing.satFat || 0) * f),
    cost:    Math.round(ing.cost * grams) / 100
  };
}
function round1(v) { return Math.round(v * 10) / 10; }
function formatCost(c) { return '$' + c.toFixed(2); }

// USDA FoodData Central search — returns ingredients in our format
const _usdaCache = {};
async function searchUSDA(q) {
  const key = state.usdaApiKey || 'DEMO_KEY';
  const cacheKey = q + '|' + key;
  if (_usdaCache[cacheKey]) return _usdaCache[cacheKey];
  try {
    const url = `https://api.nal.usda.gov/fdc/v1/foods/search?query=${encodeURIComponent(q)}&api_key=${encodeURIComponent(key)}&dataType=Foundation,SR%20Legacy&pageSize=12`;
    const resp = await fetch(url);
    if (!resp.ok) return [];
    const data = await resp.json();
    const results = (data.foods || []).map(f => {
      const n = id => f.foodNutrients?.find(x => x.nutrientId === id)?.value || 0;
      return {
        id: 'usda_' + f.fdcId,
        n: f.description.replace(/,?\s*(raw|cooked|whole|fresh)\s*$/i, '').trim().replace(/\b\w/g,c=>c.toUpperCase()),
        nFull: f.description,
        cal: Math.round(n(1008)), fat: round1(n(1004)), carbs: round1(n(1005)),
        fiber: round1(n(1079)), pro: round1(n(1003)),
        sugar: round1(n(2000)), sodium: Math.round(n(1093)), satFat: round1(n(1258)),
        cost: 0.20, units: { oz:28.35, cup:240, tbsp:15, tsp:5, g:1 }, isUsda: true
      };
    });
    _usdaCache[cacheKey] = results;
    return results;
  } catch { return []; }
}

function searchIngredients(q) {
  if (!q || q.length < 1) return [];
  const lower = q.toLowerCase();
  return getAllIngredients().filter(i => i.n.toLowerCase().includes(lower)).slice(0, 8);
}

// Allergen detection from ingredient list strings
const ALLERGENS = {
  gluten:    { label:'Gluten',    words:['wheat','flour','bread','pasta','barley','rye','oat','tortilla','cracker','cereal','biscuit'] },
  dairy:     { label:'Dairy',     words:['milk','butter','cream','cheese','yogurt','whey','lactose','cheddar','mozzarella','parmesan'] },
  eggs:      { label:'Eggs',      words:['egg','mayonnaise','mayo'] },
  nuts:      { label:'Tree Nuts', words:['almond','cashew','walnut','pecan','pistachio','hazelnut','macadamia','nut butter'] },
  peanuts:   { label:'Peanuts',   words:['peanut'] },
  soy:       { label:'Soy',       words:['soy','tofu','edamame','miso','tempeh'] },
  shellfish: { label:'Shellfish', words:['shrimp','crab','lobster','scallop','clam','oyster','mussel'] },
  fish:      { label:'Fish',      words:['salmon','tuna','tilapia','cod','halibut','sardine','anchovy','fish'] },
};
function detectAllergens(ingredients) {
  const text = (ingredients || []).join(' ').toLowerCase();
  return Object.entries(ALLERGENS)
    .filter(([,a]) => a.words.some(w => text.includes(w)))
    .map(([,a]) => a.label);
}

// Health grade A-F based on per-serving macros
function healthGrade(mp) {
  if (!mp || mp.calories === undefined) return null;
  let score = 70;
  score += Math.min(20, (mp.fiber || 0) * 2);
  score += Math.min(15, (mp.protein || 0) * 0.5);
  if (mp.calories > 700) score -= 15;
  else if (mp.calories > 500) score -= 8;
  if ((mp.satFat || 0) > 10) score -= 12;
  if ((mp.sugar || 0) > 30) score -= 12;
  if ((mp.sodium || 0) > 1200) score -= 10;
  if (mp.netCarbs > 60) score -= 8;
  score = Math.max(0, Math.min(100, score));
  if (score >= 85) return { grade:'A', color:'#22c55e' };
  if (score >= 70) return { grade:'B', color:'#84cc16' };
  if (score >= 55) return { grade:'C', color:'#eab308' };
  if (score >= 40) return { grade:'D', color:'#f97316' };
  return { grade:'F', color:'#ef4444' };
}
