const FLAG_PATTERNS = {
  dairy:            ['milk','butter','cream','cheese','whey','lactose','yogurt','cheddar','mozzarella','parmesan','casein'],
  gluten:           ['wheat','barley','rye','malt','oat','flour','bread','pasta','tortilla'],
  eggs:             ['egg','albumin','mayonnaise','mayo'],
  treeNuts:         ['almond','cashew','walnut','pecan','pistachio','hazelnut','macadamia'],
  peanuts:          ['peanut'],
  soy:              ['soy','tofu','edamame','miso','tempeh','lecithin'],
  shellfish:        ['shrimp','crab','lobster','scallop','clam','oyster','mussel'],
  fish:             ['salmon','tuna','tilapia','cod','halibut','sardine','anchovy',' fish'],
  sesame:           ['sesame','tahini'],
  artificialColors: ['red 40','yellow 5','yellow 6','blue 1','blue 2','green 3','caramel color'],
  artificialFlavors:['artificial flavor'],
  preservatives:    ['bha','bht','tbhq','sodium benzoate','potassium sorbate','sodium nitrite'],
  msg:              ['monosodium glutamate'],
  hfcs:             ['high fructose corn syrup'],
  nitrates:         ['sodium nitrate','sodium nitrite'],
  addedSugars:      ['dextrose','sucrose','fructose','maltose','glucose','corn syrup','cane sugar','cane juice','brown sugar','raw sugar','turbinado','molasses','honey','agave','maple syrup','invert sugar','evaporated cane','fruit juice concentrate','barley malt syrup','treacle','muscovado'],
  artificialSweeteners: ['sucralose','aspartame','saccharin','acesulfame','ace-k','neotame','advantame','cyclamate','splenda'],
  naturalSweeteners:['stevia','allulose','monk fruit','erythritol','xylitol','sorbitol','maltitol','luo han guo','reb a','steviol glycoside','inositol'],
  naturalFlavors:   ['natural flavor','natural flavoring','natural flavour','natural flavours']
};

function detectIngredientFlags(ing) {
  // For scanned ingredients with explicit flags, use those
  if (ing.flags) return ing.flags;
  // Otherwise derive from name + ingredientsText
  const src = ((ing.n || '') + ' ' + (ing.ingredientsText || '')).toLowerCase();
  const f = {};
  Object.entries(FLAG_PATTERNS).forEach(([key, words]) => {
    f[key] = words.some(w => src.includes(w));
  });
  return f;
}

function ingPassesFilters(ing, filters) {
  // Search filter
  if (filters.search && !ing.n.toLowerCase().includes(filters.search.toLowerCase())) return false;
  // Flag filters — each active flag key means "must NOT have this flag"
  const activeFlags = Object.keys(filters.flags).filter(k => filters.flags[k]);
  if (!activeFlags.length) return true;
  const f = detectIngredientFlags(ing);
  return activeFlags.every(key => !f[key]);
}

function renderIngDbList() {
  const wrap = document.getElementById('ing-db-list-wrap');
  if (!wrap) return;
  const all = getAllIngredients();
  const filtered = all.filter(ing => ingPassesFilters(ing, ingDbFilters));

  // Update header count
  const h2 = document.querySelector('#modal-container .modal-header h2');
  if (h2) h2.textContent = `Ingredient Database (${filtered.length}/${all.length})`;

  if (!filtered.length) {
    wrap.innerHTML = `<div class="empty-state"><div class="empty-icon">&#128269;</div><p>No ingredients match the current filters.</p></div>`;
    return;
  }

  wrap.innerHTML = filtered.map(ing => {
    const isCustom = !INGREDIENT_DB.find(i => i.id === ing.id);
    const flags = isCustom ? detectIngredientFlags(ing) : null;
    let flagBadges = '';
    if (flags) {
      const allergenKeys = ['dairy','gluten','eggs','treeNuts','peanuts','soy','shellfish','fish','sesame'];
      const additiveKeys = ['artificialColors','artificialFlavors','preservatives','msg','hfcs','nitrates'];
      const sugarKeys    = ['addedSugars','artificialSweeteners','hfcs'];
      const sweetenerKeys= ['naturalSweeteners'];
      const naturalKeys  = ['naturalFlavors'];
      const allergenLabels  = {dairy:'Dairy',gluten:'Gluten',eggs:'Eggs',treeNuts:'Tree Nuts',peanuts:'Peanuts',soy:'Soy',shellfish:'Shellfish',fish:'Fish',sesame:'Sesame'};
      const additiveLabels  = {artificialColors:'Artif. Colors',artificialFlavors:'Artif. Flavors',preservatives:'Preservatives',msg:'MSG',hfcs:'HFCS',nitrates:'Nitrates'};
      const sugarLabels     = {addedSugars:'Added Sugars',artificialSweeteners:'Artif. Sweetener',hfcs:'HFCS'};
      const sweetenerLabels = {naturalSweeteners:'Natural Sweetener'};
      const naturalLabels   = {naturalFlavors:'Natural Flavors'};
      allergenKeys.forEach(k => { if (flags[k]) flagBadges += `<span class="flag-chip flag-chip-red">${allergenLabels[k]}</span>`; });
      additiveKeys.filter(k => !sugarKeys.includes(k)).forEach(k => { if (flags[k]) flagBadges += `<span class="flag-chip flag-chip-orange">${additiveLabels[k]}</span>`; });
      sugarKeys.forEach(k => { if (flags[k]) flagBadges += `<span class="flag-chip flag-chip-purple">${sugarLabels[k]}</span>`; });
      sweetenerKeys.forEach(k => { if (flags[k]) flagBadges += `<span class="flag-chip flag-chip-green">${sweetenerLabels[k]}</span>`; });
      naturalKeys.forEach(k => { if (flags[k]) flagBadges += `<span class="flag-chip flag-chip-orange">${naturalLabels[k]}</span>`; });
    }
    return `<div class="ing-db-row">
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:0.85rem">${escapeHtml(ing.n)}${isCustom ? ' <span style="font-size:0.68rem;background:var(--sky-bg);color:var(--sky);border-radius:4px;padding:1px 5px">custom</span>' : ''}</div>
        <div class="ing-db-macros">
          <span class="ing-db-macro-pill">Cal: ${ing.cal}</span>
          <span class="ing-db-macro-pill">Fat: ${ing.fat}g</span>
          <span class="ing-db-macro-pill">Carbs: ${ing.carbs}g</span>
          <span class="ing-db-macro-pill">Fiber: ${ing.fiber}g</span>
          <span class="ing-db-macro-pill">Prot: ${ing.pro}g</span>
          <span class="ing-db-macro-pill">Net: ${round1(ing.carbs-ing.fiber)}g</span>
          <span class="ing-db-macro-pill" style="color:#22c55e">${formatCost(ing.cost)}/100g</span>
        </div>
        ${flagBadges ? `<div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:2px">${flagBadges}</div>` : ''}
      </div>
      ${isCustom ? `<button class="builder-remove-btn" onclick="deleteCustomIngredient('${ing.id}')">&#x2715;</button>` : ''}

  }).join('');

function _previewScanFile(file, imgId, wrapId) {

  };
  reader.readAsDataURL(file);
}

function onScanFile1Change(input) {
  if (!input.files || !input.files[0]) return;
  _scanFile1 = input.files[0];
  _previewScanFile(_scanFile1, 'scan-img-1', 'scan-preview-1');
  const btn = document.getElementById('scan-next-btn');
  if (btn) btn.disabled = false;
}

function onScanFile2Change(input) {

  _scanFile2 = input.files[0];
  _previewScanFile(_scanFile2, 'scan-img-2', 'scan-preview-2');
  const btn = document.getElementById('scan-submit-btn');
  if (btn) btn.disabled = false;
}

function _fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      // e.target.result is data:mime;base64,<data>
      const b64 = e.target.result.split(',')[1];
      resolve(b64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function submitScanLabel() {
  if (!_scanFile1 || !_scanFile2) { alert('Please provide both photos.'); return; }
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-backdrop">
      <div class="modal">
        <div class="modal-header"><h2>&#128247; Scanning Label...</h2></div>
        <div class="modal-body">
          <div class="loading-box">
            <div class="spinner"></div>
            <p>Analyzing labels with Gemini&#8230;</p>
          </div>
        </div>
      </div>
    </div>`;

  try {
    const [b64_1, b64_2] = await Promise.all([_fileToBase64(_scanFile1), _fileToBase64(_scanFile2)]);
    const mime1 = _scanFile1.type || 'image/jpeg';
    const mime2 = _scanFile2.type || 'image/jpeg';

    const scanPrompt = `You are a food label reader. You will receive two images: the first is the Nutrition Facts panel, the second is the Ingredients list. Extract the data and return ONLY valid JSON with this exact structure:
{"name":"Product name","servingSize":{"g":28,"desc":"1 oz"},"per100g":{"calories":0,"fat":0,"satFat":0,"carbs":0,"sugar":0,"fiber":0,"protein":0,"sodium":0},"ingredientsText":"full ingredients text verbatim","flags":{"dairy":false,"gluten":false,"eggs":false,"treeNuts":false,"peanuts":false,"soy":false,"shellfish":false,"fish":false,"sesame":false,"artificialColors":false,"artificialFlavors":false,"naturalFlavors":false,"preservatives":false,"msg":false,"hfcs":false,"nitrates":false,"addedSugars":false,"artificialSweeteners":false,"naturalSweeteners":false},"detectedAllergens":[],"detectedAdditives":[]}

Rules for flags — set true if found in ingredients:
dairy=milk/butter/cream/cheese/whey/lactose/casein; gluten=wheat/barley/rye/malt; eggs=egg/albumin/mayonnaise; treeNuts=almond/cashew/walnut/pecan/pistachio/hazelnut/macadamia; peanuts=peanut; soy=soy/tofu/lecithin(from soy); shellfish=shrimp/crab/lobster/scallop; fish=fish/salmon/tuna/anchovies/cod; sesame=sesame/tahini;
artificialColors=Red 40/Yellow 5/Yellow 6/Blue 1/Blue 2/Green 3/caramel color; artificialFlavors="artificial flavor"/"artificial flavoring"; naturalFlavors="natural flavor"/"natural flavoring"/"natural flavours";
preservatives=BHA/BHT/TBHQ/sodium benzoate/potassium sorbate; msg=monosodium glutamate; hfcs=high fructose corn syrup; nitrates=sodium nitrate/sodium nitrite;
addedSugars=dextrose/sucrose/fructose/maltose/glucose/corn syrup/cane sugar/cane juice/brown sugar/turbinado/molasses/honey/agave/maple syrup/invert sugar/evaporated cane/fruit juice concentrate;
artificialSweeteners=sucralose/aspartame/saccharin/acesulfame potassium/ace-k/neotame/advantame/cyclamate;
naturalSweeteners=stevia/allulose/monk fruit/erythritol/xylitol/sorbitol/maltitol/luo han guo/reb a/steviol glycosides.
Set detectedAllergens to array of human-readable allergen names found. Set detectedAdditives to array of specific additive/sweetener names found verbatim in the label.`;

    const model = state.geminiModel || 'gemini-2.0-flash';
    const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${state.geminiApiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          parts: [
            { text: scanPrompt },
            { inlineData: { mimeType: mime1, data: b64_1 } },
            { inlineData: { mimeType: mime2, data: b64_2 } }
          ]
        }],
        generationConfig: { responseMimeType: 'application/json', maxOutputTokens: 2048 }
      })
    });

    if (!resp.ok) {
      const errData = await resp.json().catch(() => ({}));
      throw new Error(errData.error?.message || `API error ${resp.status}`);
    }
    const data = await resp.json();
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    let parsed;
    try {
      let cleaned = text.replace(/^```json?\s*/i,'').replace(/```\s*$/,'').trim();
      try { parsed = JSON.parse(cleaned); }
      catch(_) {
        const match = text.match(/\{[\s\S]*\}/);
        if (!match) throw new Error('no JSON object found');
        parsed = JSON.parse(match[0]);
      }
    } catch(e) {
      throw new Error('Gemini returned invalid JSON. Try again.');
    }
    _scanFile1 = null; _scanFile2 = null;
    showScanLabelReviewModal(parsed);
  } catch(err) {
    document.getElementById('modal-container').innerHTML = `
      <div class="modal-backdrop" onclick="closeModalOnBackdrop(event)">
        <div class="modal">
          <div class="modal-header"><h2>Scan Error</h2><button class="modal-close" onclick="closeModal()">&#x2715;</button></div>
          <div class="modal-body">
            <p style="color:#DC2626;margin-bottom:16px">&#9888;&#65039; ${escapeHtml(err.message)}</p>
            <div class="form-actions">
              <button class="btn-secondary" onclick="showIngredientDbModal()">&#8592; Back</button>
              <button class="btn-primary" onclick="showScanLabelModal(1)">&#8635; Rescan</button>
            </div>
          </div>
        </div>
      </div>`;
  }
}

function saveCustomIngredient() {

  const unitsRaw = document.getElementById('ci-units')?.value.trim();
  let units = {};
  if (unitsRaw) {

    });

  const ing = {
    id: 'custom_' + uid(),
    n: name,
    cal:   parseFloat(document.getElementById('ci-cal')?.value)  || 0,

  showIngredientDbModal();
}

function deleteCustomIngredient(id) {

  showIngredientDbModal();
}

function renderBuilderTable(totals, servings) {

      <td>${bi.cal}</td><td>${bi.fat}g</td>
      <td>${bi.carbs}g</td><td>${bi.fiber}g</td>
      <td style="font-weight:600;color:var(--sky)">${bi.netCarbs}g</td>
      <td>${bi.pro}g</td>
      <td style="color:var(--text-muted);font-size:0.78rem">${bi.sugar||0}g</td>

      <td><button class="builder-remove-btn" onclick="removeFromBuilder(${idx})">&#x2715;</button></td>
    </tr>`).join('');

  const perRow = totals ? `
    <tr class="serving-row">
      <td>Per serving (÷${sv})</td>
      <td>${Math.round(totals.cal/sv)}</td><td>${round1(totals.fat/sv)}g</td>
      <td>${round1(totals.carbs/sv)}g</td><td>${round1(totals.fiber/sv)}g</td>
      <td style="font-weight:600;color:var(--sky)">${round1(totals.netCarbs/sv)}g</td>
      <td>${round1(totals.pro/sv)}g</td>
      <td style="font-size:0.78rem">${round1((totals.sugar||0)/sv)}g</td>
      <td style="font-size:0.78rem">${Math.round((totals.sodium||0)/sv)}mg</td>
      <td>${formatCost(totals.cost/sv)}</td><td></td>
    </tr>` : '';
  return `<div style="overflow-x:auto">
    <table class="builder-table">
      <thead><tr><th>Ingredient</th><th>Cal</th><th>Fat</th><th>Carbs</th><th>Fiber</th><th>Net Carbs</th><th>Protein</th><th style="color:var(--text-muted)">Sugar</th><th style="color:var(--text-muted)">Sodium</th><th>Cost</th><th></th></tr></thead>

          <td>${totals.carbs}g</td><td>${totals.fiber}g</td>
          <td>${totals.netCarbs}g</td><td>${totals.pro}g</td>
          <td style="font-size:0.78rem">${totals.sugar||0}g</td>
          <td style="font-size:0.78rem">${totals.sodium||0}mg</td>

        </tr>
        ${perRow}
      </tbody>
    </table>
  </div>
  <p class="net-carbs-note">Net Carbs = Carbs − Fiber. Sugar &amp; Sodium available for USDA foods and custom entries.</p>`;
}

function calcBuilderTotals() {
  if (!builderIngredients.length) return { cal:0, fat:0, carbs:0, fiber:0, pro:0, netCarbs:0, sugar:0, sodium:0, cost:0 };
  return builderIngredients.reduce((acc, bi) => ({
    cal:     acc.cal     + bi.cal,
    fat:     round1(acc.fat     + bi.fat),
    carbs:   round1(acc.carbs   + bi.carbs),
    fiber:   round1(acc.fiber   + bi.fiber),
    pro:     round1(acc.pro     + bi.pro),
    netCarbs:round1(acc.netCarbs + bi.netCarbs),
    sugar:   round1((acc.sugar||0) + (bi.sugar||0)),
    sodium:  Math.round((acc.sodium||0) + (bi.sodium||0)),
    cost:    Math.round((acc.cost + bi.cost) * 100) / 100
  }), { cal:0, fat:0, carbs:0, fiber:0, pro:0, netCarbs:0, sugar:0, sodium:0, cost:0 });
}

async function onBuilderSearch(q) {
  builderSearchQuery = q;
  builderSelectedIngId = null;
  const box = document.getElementById('builder-suggestions');
  if (!box) return;
  if (!q || q.length < 2) { box.style.display = 'none'; return; }
  const local = searchIngredients(q);
  box.innerHTML = (local.length ? local.map(i => `<div class="builder-suggestion" onclick="selectBuilderIng('${i.id}','${escapeHtml(i.n)}')">${escapeHtml(i.n)}</div>`).join('') : '') +
    `<div class="builder-suggestion" style="color:var(--text-muted);font-style:italic;cursor:default;font-size:0.78rem">&#128269; Searching USDA database...</div>`;
  box.style.display = 'block';
  // Add USDA results asynchronously
  const usda = await searchUSDA(q);
  if (!document.getElementById('builder-search') || document.getElementById('builder-search').value !== q) return;
  const allResults = [
    ...local,
    ...usda.filter(u => !local.find(l => l.n.toLowerCase() === u.n.toLowerCase()))
  ];
  if (!allResults.length) { box.style.display = 'none'; return; }
  box.innerHTML = allResults.map(i => {
    const tag = i.isUsda ? `<span style="font-size:0.68rem;background:rgba(41,182,246,0.15);color:var(--sky);border-radius:3px;padding:1px 4px;margin-left:4px">USDA</span>` : '';
    return `<div class="builder-suggestion" onclick="selectBuilderIngFull('${i.id}',${JSON.stringify(i).replace(/'/g,"\\'")})">${escapeHtml(i.n)}${tag}</div>`;
  }).join('');
  box.style.display = 'block';
}

function selectBuilderIngFull(id, ingObj) {
  // Cache USDA ingredient so getIngById can find it
  if (ingObj.isUsda && !getAllIngredients().find(x => x.id === id)) {
    if (!state.customIngredients) state.customIngredients = [];
    state.customIngredients.push(ingObj);
  }
  selectBuilderIng(id, ingObj.n);
}

function selectBuilderIng(id, name) {
  builderSelectedIngId = id;
  const si = document.getElementById('builder-search');
  if (si) si.value = name;
  const box = document.getElementById('builder-suggestions');
  if (box) box.style.display = 'none';
}

function _saveBuilderFormState() {
  _builderMeta.prepTime   = document.getElementById('builder-prep')?.value || _builderMeta.prepTime;
  _builderMeta.cookTime   = document.getElementById('builder-cook')?.value || _builderMeta.cookTime;
  _builderMeta.cuisine    = document.getElementById('builder-cuisine')?.value || _builderMeta.cuisine;
  _builderMeta.difficulty = document.getElementById('builder-difficulty')?.value || _builderMeta.difficulty;
}

function addToBuilder() {
  const ingId = builderSelectedIngId;
  if (!ingId) { alert('Please select an ingredient from the dropdown.'); return; }
  const ing = getIngById(ingId);
  if (!ing) return;
  const amount = parseFloat(document.getElementById('builder-amount')?.value) || 1;
  const unit   = document.getElementById('builder-unit')?.value || 'g';
  const grams  = getGrams(ing, amount, unit);
  const m      = calcIngMacros(ing, grams);
  builderIngredients.push({ ingId, name: ing.n, amount, unit, grams, ...m });
  builderSelectedIngId = null;
  builderSearchQuery = '';
  _saveBuilderFormState();
  showRecipeBuilderModal();
}

function removeFromBuilder(idx) {
  _saveBuilderFormState();
  builderIngredients.splice(idx, 1);
  showRecipeBuilderModal();
}

function refreshBuilderTotals() {
  // Lightweight re-render of just the table area without resetting inputs
  const totals = calcBuilderTotals();
  const sv = parseInt(document.getElementById('builder-servings')?.value) || 1;
  const tableWrap = document.querySelector('.builder-table')?.closest('div[style*="overflow-x"]');
  if (tableWrap) tableWrap.outerHTML = renderBuilderTable(totals, sv);
}

function saveBuilderRecipe() {
  const title = document.getElementById('builder-title')?.value.trim();
  if (!title) { alert('Please enter a recipe title.'); return; }
  if (!builderIngredients.length) { alert('Please add at least one ingredient.'); return; }
  _saveBuilderFormState();
  const servings = parseInt(document.getElementById('builder-servings')?.value) || 1;
  const procRaw = document.getElementById('builder-procedure')?.value.trim();
  const procedure = procRaw ? procRaw.split('\n').map(s => s.trim()).filter(Boolean) : [];
  const totals = calcBuilderTotals();
  const sv = Math.max(1, servings);
  const macrosPerServing = {
    calories: Math.round(totals.cal / sv),
    fat:      round1(totals.fat / sv),
    carbs:    round1(totals.carbs / sv),
    fiber:    round1(totals.fiber / sv),
    protein:  round1(totals.pro / sv),
    netCarbs: round1(totals.netCarbs / sv),
    sugar:    round1((totals.sugar||0) / sv),
    sodium:   Math.round((totals.sodium||0) / sv)
  };
  const macrosTotal = {
    calories: totals.cal, fat: totals.fat, carbs: totals.carbs,
    fiber: totals.fiber, protein: totals.pro, netCarbs: totals.netCarbs,
    sugar: totals.sugar||0, sodium: totals.sodium||0
  };
  const ingredients = builderIngredients.map(bi => `${bi.amount} ${bi.unit} ${bi.name}`);
  const allergens = detectAllergens(ingredients);
  const grade = healthGrade(macrosPerServing);
  const tags = {
    keto:        macrosPerServing.netCarbs < 10,
    highProtein: macrosPerServing.protein > 0.10 * macrosPerServing.calories,
    lowCalorie:  macrosPerServing.calories < 400,
    vegan: false, vegetarian: false, glutenFree: !allergens.includes('Gluten'),
    dairyFree: !allergens.includes('Dairy'), lowHistamine: false, antiInflammatory: false
  };
  const recipe = {
    id: uid(), title, servings, ingredients, procedure,
    structuredIngredients: JSON.parse(JSON.stringify(builderIngredients)),
    macrosPerServing, macrosTotal,
    estimatedCostTotal: totals.cost,
    estimatedCostPerServing: Math.round(totals.cost / sv * 100) / 100,
    allergens, healthGrade: grade?.grade || null,
    prepTime: _builderMeta.prepTime, cookTime: _builderMeta.cookTime,
    cuisine: _builderMeta.cuisine, difficulty: _builderMeta.difficulty,
    tags, notes: '', forP: false, forM: false, savedAt: Date.now()
  };
  state.recipes.push(recipe);
  builderIngredients = [];
  _builderMeta = { prepTime:'', cookTime:'', cuisine:'', difficulty:'medium' };
  saveState(); closeModal(); render(); pushItem(recipe, 'recipe');
}

function renderExerciseBlock(ex, exIdx) {
  const badge = `<span class="muscle-badge ${muscleBadgeClass(ex.muscleGroup)}">${escapeHtml(ex.muscleGroup)}</span>`;
  let setsHtml = '';
  if (ex.type === 'cardio') {
    const mins = Math.floor((ex.duration||0)/60);
    const secs = ((ex.duration||0)%60).toString().padStart(2,'0');
    setsHtml = `<div class="cardio-duration-wrap">
      <label style="font-size:0.78rem;color:var(--text-muted);font-weight:600">Total Duration:</label>
      <input class="set-input" style="width:55px" type="number" min="0" value="${mins}" placeholder="min"
        onchange="updateCardioDuration(${exIdx},this.value,document.getElementById('wk-cardio-sec-${exIdx}').value)"> min
      <input class="set-input" id="wk-cardio-sec-${exIdx}" style="width:55px" type="number" min="0" max="59" value="${secs}" placeholder="sec"
        onchange="updateCardioDuration(${exIdx},document.getElementById('wk-cardio-sec-${exIdx}').previousElementSibling.value,this.value)"> sec
    </div>`;
  } else if (ex.type === 'timed') {
    const rows = (ex.sets || []).map((s, sIdx) => {
      const sm = Math.floor((s.duration||0)/60);
      const ss = ((s.duration||0)%60).toString().padStart(2,'0');
      return `<div class="set-row">
        <span class="set-label">Set ${sIdx+1}</span>
        <input class="set-input" style="width:52px" type="number" min="0" value="${sm}" placeholder="min"
          onchange="updateTimedSet(${exIdx},${sIdx},this.value,document.getElementById('wk-ts-${exIdx}-${sIdx}').value)"> min
        <input class="set-input" id="wk-ts-${exIdx}-${sIdx}" style="width:52px" type="number" min="0" max="59" value="${ss}" placeholder="sec"
          onchange="updateTimedSet(${exIdx},${sIdx},this.previousElementSibling.previousElementSibling.value,this.value)"> sec
        <button class="set-remove-btn" onclick="removeSet(${exIdx},${sIdx})" title="Remove set">&#x2715;</button>
      </div>`;
    }).join('');
    setsHtml = rows + `<button class="add-set-btn" onclick="addTimedSet(${exIdx})">+ Add Set</button>`;
  } else {
    const rows = (ex.sets || []).map((s, sIdx) => {
      return `<div class="set-row">
        <span class="set-label">Set ${sIdx+1}</span>
        <input class="set-input" type="number" min="0" step="0.5" value="${s.weight||''}" placeholder="wt"
          onchange="updateSet(${exIdx},${sIdx},'weight',this.value)">
        <span class="set-sep">${escapeHtml(s.unit||'lbs')}</span>
        <span class="set-sep">&times;</span>
        <input class="set-input" type="number" min="0" value="${s.reps||''}" placeholder="reps"
          onchange="updateSet(${exIdx},${sIdx},'reps',this.value)">
        <span class="set-sep">reps</span>
        <button class="set-unit-toggle" onclick="toggleSetUnit(${exIdx},${sIdx})">${escapeHtml(s.unit||'lbs')}</button>
        <button class="set-remove-btn" onclick="removeSet(${exIdx},${sIdx})" title="Remove set">&#x2715;</button>
      </div>`;
    }).join('');
    setsHtml = rows + `<button class="add-set-btn" onclick="addSet(${exIdx})">+ Add Set</button>`;
  }
  const mgOptions = ['Back','Chest','Shoulders','Arms','Core','Legs','Glutes/Hips','Cardio']
    .map(mg => `<option value="${mg}" ${ex.muscleGroup===mg?'selected':''}>${mg}</option>`).join('');
  const eqOptions = ['Cable Machine','Dumbbell','Barbell','Machine','Bodyweight','Resistance Band','Kettlebell','Cardio Machine','Other']
    .map(eq => `<option value="${eq}" ${ex.equipment===eq?'selected':''}>${eq}</option>`).join('');
  const tsMin = Math.floor((ex.timeSpent||0)/60);
  const tsSec = ((ex.timeSpent||0)%60).toString().padStart(2,'0');
  return `<div class="exercise-block">
    <div class="exercise-block-header">
      <span class="exercise-block-name">${escapeHtml(ex.name)}</span>
      <button class="exercise-remove-btn" onclick="removeExercise(${exIdx})" title="Remove exercise">&#x2715;</button>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center">
      <select class="ex-meta-select" onchange="_wkExercises[${exIdx}].muscleGroup=this.value" title="Muscle group">${mgOptions}</select>
      <select class="ex-meta-select" onchange="_wkExercises[${exIdx}].equipment=this.value" title="Equipment">${eqOptions}</select>
    </div>
    ${setsHtml}
    <div class="cardio-duration-wrap" style="margin-top:8px;border-top:1px dashed var(--border);padding-top:7px">
      <span style="font-size:0.75rem;color:var(--text-muted);font-weight:600">⏱ Time spent:</span>
      <input class="set-input" style="width:52px" type="number" min="0" value="${tsMin||''}" placeholder="min"
        onchange="updateExTimeSpent(${exIdx},this.value,document.getElementById('wk-ts-spent-sec-${exIdx}').value)"> min
      <input class="set-input" id="wk-ts-spent-sec-${exIdx}" style="width:52px" type="number" min="0" max="59" value="${tsSec!=='00'?tsSec:''}" placeholder="sec"
        onchange="updateExTimeSpent(${exIdx},this.previousElementSibling.previousElementSibling.value,this.value)"> sec
    </div>
  </div>`;
}

function selectWkOwner(el, val) {
  _wkOwner = val;
  const container = el.parentElement;
  container.querySelectorAll('.owner-opt').forEach(o => o.className = 'owner-opt');
  if (val === 'P') el.className = 'owner-opt sel-p';
  else if (val === 'M') el.className = 'owner-opt sel-m';
  else el.className = 'owner-opt sel-shared';
}

function addExerciseToLog(ex) {
  const entry = {
    exId: ex.id,
    name: ex.name,
    muscleGroup: ex.muscleGroup,
    equipment: ex.equipment || 'Other',
    type: ex.type,
    timeSpent: 0,
    notes: ''
  };
  if (ex.type === 'cardio') {
    entry.duration = 0;
    entry.durationLabel = '0:00';
  } else if (ex.type === 'timed') {
    entry.sets = [{ duration: 30 }];
  } else {
    entry.sets = [{ weight: '', reps: '', unit: 'lbs' }];
  }
  _wkExercises.push(entry);
  closeModal();
  render();
}

function removeExercise(idx) {
  _wkExercises.splice(idx, 1);
  render();
}

function addSet(exIdx) {
  const ex = _wkExercises[exIdx];
  if (!ex || !ex.sets) return;
  const last = ex.sets[ex.sets.length - 1] || { weight: '', reps: '', unit: 'lbs' };
  ex.sets.push({ weight: last.weight, reps: last.reps, unit: last.unit || 'lbs' });
  render();
}

function removeSet(exIdx, sIdx) {
  const ex = _wkExercises[exIdx];
  if (!ex || !ex.sets) return;
  ex.sets.splice(sIdx, 1);
  if (ex.sets.length === 0) ex.sets.push({ weight: '', reps: '', unit: 'lbs' });
  render();
}

function updateSet(exIdx, sIdx, field, value) {
  const ex = _wkExercises[exIdx];
  if (!ex || !ex.sets || !ex.sets[sIdx]) return;
  ex.sets[sIdx][field] = field === 'weight' || field === 'reps' ? (parseFloat(value) || '') : value;
}

function toggleSetUnit(exIdx, sIdx) {
  const ex = _wkExercises[exIdx];
  if (!ex || !ex.sets || !ex.sets[sIdx]) return;
  ex.sets[sIdx].unit = ex.sets[sIdx].unit === 'lbs' ? 'kg' : 'lbs';
  render();
}

function updateExTimeSpent(exIdx, mins, secs) {
  if (_wkExercises[exIdx] !== undefined) {
    _wkExercises[exIdx].timeSpent = (parseInt(mins)||0)*60 + Math.min(59, parseInt(secs)||0);
  }
}
function updateTimedSet(exIdx, sIdx, mins, secs) {
  const m = parseInt(mins) || 0;
  const s = Math.min(59, parseInt(secs) || 0);
  if (_wkExercises[exIdx] && _wkExercises[exIdx].sets[sIdx] !== undefined) {
    _wkExercises[exIdx].sets[sIdx].duration = m * 60 + s;
  }
}
function addTimedSet(exIdx) {
  if (!_wkExercises[exIdx]) return;
  const last = _wkExercises[exIdx].sets.slice(-1)[0];
  _wkExercises[exIdx].sets.push({ duration: last ? last.duration : 30 });
  render();
}
function prefillWorkoutFromTemplate(tmplId, dateKey) {
  const t = (state.workoutTemplates || []).find(x => x.id === tmplId);
  if (!t) return;
  _wkExercises = JSON.parse(JSON.stringify(t.exercises));
  _wkNotes = t.name || '';
  _wkDate = dateKey;
  _wkOwner = t.owner || state.currentUser || 'P';
  _wkRepeatDays = [];
  _wkEditingId = null;
  workoutView = 'log';
  switchTab('workout');
  render();
}
function deleteWorkoutTemplate(id) {
  if (!confirm('Delete this recurring workout template?')) return;
  state.workoutTemplates = (state.workoutTemplates || []).filter(t => t.id !== id);
  saveState();
  render();
}
function toggleRepeatDay(dayIdx) {
  const i = _wkRepeatDays.indexOf(dayIdx);
  if (i === -1) _wkRepeatDays.push(dayIdx);
  else _wkRepeatDays.splice(i, 1);
  render();
}
function updateCardioDuration(exIdx, mins, secs) {
  const ex = _wkExercises[exIdx];
  if (!ex) return;
  const m = parseInt(mins) || 0;
  const s = parseInt(secs) || 0;
  ex.duration = m * 60 + s;
  ex.durationLabel = m + ':' + s.toString().padStart(2, '0');
}

function saveWorkout() {
  // Capture any pending input values from the DOM before saving
  const dateEl = document.getElementById('wk-date');
  if (dateEl) _wkDate = dateEl.value;
  const notesEl = document.getElementById('wk-notes');
  if (notesEl) _wkNotes = notesEl.value;

  if (!_wkExercises.length) { alert('Add at least one exercise before saving.'); return; }

  // Check if there's already a workout for this date (and not editing that one)
  const existingForDate = (state.workouts || []).find(w => w.date === _wkDate && w.id !== _wkEditingId);
  if (existingForDate) {
    if (!confirm(`A workout for ${_wkDate} already exists. Save anyway?`)) return;
  }

  const workout = {
    id: _wkEditingId || uid(),
    date: _wkDate,
    owner: _wkOwner || state.currentUser || 'P',
    exercises: JSON.parse(JSON.stringify(_wkExercises)),
    notes: _wkNotes,
    savedAt: Date.now()
  };

  if (!state.workouts) state.workouts = [];
  if (_wkEditingId) {
    state.workouts = state.workouts.map(w => w.id === _wkEditingId ? workout : w);
  } else {
    state.workouts.push(workout);
  }

  // Save as recurring template if days selected
  if (_wkRepeatDays.length) {
    if (!state.workoutTemplates) state.workoutTemplates = [];
    const tmpl = {
      id: 'tmpl_' + uid(),
      name: _wkNotes || workout.exercises.map(e => e.name).slice(0,2).join(', '),
      repeatDays: [..._wkRepeatDays],
      exercises: JSON.parse(JSON.stringify(_wkExercises)),
      owner: _wkOwner || state.currentUser || 'P'
    };
    state.workoutTemplates.push(tmpl);
  }

  // Reset form
  _wkExercises = [];
  _wkNotes = '';
  _wkDate = todayDateStr();
  _wkOwner = state.currentUser || 'P';
  _wkEditingId = null;
  _wkRepeatDays = [];

  saveState();
  workoutView = 'history';
  render();
}

// ---- History view ----
function renderWorkoutHistory() {
  const workouts = (state.workouts || [])
    .slice()
    .sort((a, b) => b.date.localeCompare(a.date))
    .slice(0, 90); // show last 90 entries

  let html = `
    <div class="workout-subheader">
      <h2>&#128170; Workout History</h2>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="print-btn" onclick="showPrintModal('workout')">&#128424; Print</button>
        <button class="workout-view-link" onclick="workoutView='log';_wkEditingId=null;_wkExercises=[];_wkNotes='';_wkDate=todayDateStr();render()">&#8592; Log Workout</button>
      </div>
    </div>`;

  if (!workouts.length) {
    html += `<div class="empty-state"><div class="empty-icon">&#128170;</div><p>No workouts logged yet. Start logging!</p></div>`;
    return html;
  }

  workouts.forEach(w => {
    const exSummary = (w.exercises || []).map(ex => {
      let detail = '';
      if (ex.type === 'cardio') {
        detail = ex.durationLabel || '';
      } else {
        const validSets = (ex.sets || []).filter(s => s.weight !== '' || s.reps !== '');
        detail = validSets.length ? validSets.map(s => `${s.weight||'?'}${s.unit||'lbs'}&times;${s.reps||'?'}`).join(', ') : `${(ex.sets||[]).length} set${(ex.sets||[]).length!==1?'s':''}`;
      }
      return `<div class="workout-card-ex">
        <span class="workout-card-ex-name">${escapeHtml(ex.name)}</span>
        <span class="muscle-badge ${muscleBadgeClass(ex.muscleGroup)}" style="font-size:0.62rem">${escapeHtml(ex.muscleGroup)}</span>
        <span class="workout-card-ex-sets">${detail}</span>
      </div>`;
    }).join('');

    html += `<div class="workout-card">
      <div class="workout-card-header">
        <span class="workout-card-date">${formatDate(w.date + 'T12:00:00')}</span>
        ${ownerBadge(w.owner)}
        <span style="font-size:0.78rem;color:var(--text-muted)">${(w.exercises||[]).length} exercise${(w.exercises||[]).length!==1?'s':''}</span>
        <div style="margin-left:auto;display:flex;gap:6px">
          <button class="card-btn" onclick="editWorkout('${w.id}')">Edit</button>
          <button class="card-btn danger" onclick="deleteWorkout('${w.id}')">Delete</button>
        </div>
      </div>
      ${exSummary}
      ${w.notes ? `<div class="card-notes" style="margin-top:6px">${escapeHtml(w.notes)}</div>` : ''}
    </div>`;
  });

  // Recurring templates section
  const templates = state.workoutTemplates || [];
  if (templates.length) {
    const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    html += `<div style="margin-top:20px;padding-top:14px;border-top:2px solid var(--border)">
      <div style="font-size:0.78rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px">🔁 Recurring Templates</div>`;
    templates.forEach(t => {
      const dayLabels = (t.repeatDays||[]).sort().map(d => DAYS[d]).join(' · ');
      html += `<div class="workout-card" style="border-left:3px solid #7C3AED">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span style="font-weight:700;font-size:0.9rem">${escapeHtml(t.name||'Workout')}</span>
          <span style="font-size:0.75rem;background:#F5F3FF;color:#7C3AED;border-radius:20px;padding:2px 10px;font-weight:600">${dayLabels}</span>
          <span style="font-size:0.75rem;color:var(--text-muted)">${(t.exercises||[]).length} exercise${(t.exercises||[]).length!==1?'s':''}</span>
        </div>
        <div style="margin-top:6px;font-size:0.78rem;color:var(--text-muted)">${(t.exercises||[]).map(e=>escapeHtml(e.name)).join(', ')}</div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn-secondary" style="font-size:0.78rem;padding:4px 12px" onclick="prefillWorkoutFromTemplate('${t.id}',todayDateStr())">Log Today</button>
          <button class="btn-secondary" style="font-size:0.78rem;padding:4px 12px;color:#ef4444;border-color:#ef4444" onclick="deleteWorkoutTemplate('${t.id}')">Delete</button>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  return html;
}

function deleteWorkout(id) {
  if (!confirm('Delete this workout?')) return;
  state.workouts = (state.workouts || []).filter(w => w.id !== id);
  saveState();
  render();
}

function editWorkout(id) {
  const w = (state.workouts || []).find(x => x.id === id);
  if (!w) return;
  _wkEditingId = id;
  _wkDate = w.date;
  _wkOwner = w.owner;
  _wkExercises = JSON.parse(JSON.stringify(w.exercises || []));
  _wkNotes = w.notes || '';
  workoutView = 'log';
  render();
}

// ---- Exercise Picker Modal ----
function showExercisePickerModal() {
  _exPickerSearch = '';
  _exPickerMuscleFilter = 'All';
  _renderExPickerModal();
}

function _renderExPickerModal() {
  const muscleGroups = ['All','Back','Chest','Shoulders','Arms','Core','Legs','Glutes/Hips','Cardio'];
  const chipHtml = muscleGroups.map(mg =>
    `<button class="filter-chip ${_exPickerMuscleFilter===mg?'active':''}" id="ex-mg-${mg.replace('/','_')}"
      onclick="_exPickerMuscleFilter='${mg}';_renderExPickerList();document.querySelectorAll('.mg-filter-chips .filter-chip').forEach(b=>b.classList.remove('active'));this.classList.add('active')">${mg}</button>`
  ).join('');

  document.getElementById('modal-container').innerHTML = `
    <div class="modal-backdrop" onclick="closeModalOnBackdrop(event)">
      <div class="modal modal-lg">
        <div class="modal-header">
          <h2>&#128170; Choose Exercise</h2>
          <button class="modal-close" onclick="closeModal()">&#x2715;</button>
        </div>
        <div class="modal-body">
          <div class="form-group" style="margin-bottom:10px">
            <input type="text" id="ex-picker-search" placeholder="Search exercises..."
              oninput="_exPickerSearch=this.value;_renderExPickerList()"
              style="width:100%;border:1.5px solid var(--border);border-radius:9px;padding:8px 12px;font-size:0.88rem"
              autocomplete="off" spellcheck="false">
          </div>
          <div class="mg-filter-chips">${chipHtml}</div>
          <div id="ex-picker-list" style="max-height:340px;overflow-y:auto;border:1.5px solid var(--border);border-radius:9px;margin-bottom:12px"></div>
          <div style="border-top:2px solid var(--border);padding:12px 0 4px">
            <div style="font-size:0.75rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px">Custom Exercise</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <input type="text" id="custom-ex-name" placeholder="Exercise name..." style="flex:1;min-width:140px;border:1.5px solid var(--border);border-radius:8px;padding:7px 10px;font-size:0.85rem">
              <select id="custom-ex-mg" style="border:1.5px solid var(--border);border-radius:8px;padding:7px 10px;font-size:0.85rem;background:var(--card-bg)">
                ${['Back','Chest','Shoulders','Arms','Core','Legs','Glutes/Hips','Cardio'].map(mg=>`<option value="${mg}">${mg}</option>`).join('')}
              </select>
              <select id="custom-ex-eq" style="border:1.5px solid var(--border);border-radius:8px;padding:7px 10px;font-size:0.85rem;background:var(--card-bg)">
                ${['Cable Machine','Dumbbell','Barbell','Machine','Bodyweight','Resistance Band','Kettlebell','Cardio Machine','Other'].map(eq=>`<option value="${eq}">${eq}</option>`).join('')}
              </select>
              <select id="custom-ex-type" style="border:1.5px solid var(--border);border-radius:8px;padding:7px 10px;font-size:0.85rem;background:var(--card-bg)">
                <option value="strength">Strength (sets × reps)</option>
                <option value="timed">Timed (sets × duration)</option>
                <option value="cardio">Cardio (total duration)</option>
              </select>
              <button class="btn-primary" style="padding:7px 14px" onclick="addCustomExerciseToLog()">+ Use</button>
            </div>
          </div>
        </div>
      </div>
    </div>`;

  _renderExPickerList();
  document.getElementById('ex-picker-search').focus();
}

function _renderExPickerList() {
  const listEl = document.getElementById('ex-picker-list');
  if (!listEl) return;
  const allEx = getAllExercises();
  const searchLower = _exPickerSearch.toLowerCase();
  const filtered = allEx.filter(ex => {
    const matchSearch = !searchLower || ex.name.toLowerCase().includes(searchLower) || ex.muscleGroup.toLowerCase().includes(searchLower);
    const matchMuscle = _exPickerMuscleFilter === 'All' || ex.muscleGroup === _exPickerMuscleFilter;
    return matchSearch && matchMuscle;
  });
  const customIds = new Set((state.customExercises||[]).map(e => e.id));
  listEl.innerHTML = filtered.length
    ? filtered.map(ex => {
        const isCustom = customIds.has(ex.id);
        const deleteBtn = isCustom
          ? `<button class="exercise-remove-btn" style="margin-left:4px;font-size:0.8rem" title="Delete custom exercise"
               onclick="event.stopPropagation();deleteCustomExercise('${ex.id}')">&#x2715;</button>`
          : '';
        const customTag = isCustom
          ? `<span style="font-size:0.68rem;background:var(--sky-bg);color:var(--sky);border-radius:4px;padding:1px 5px;margin-left:4px">custom</span>`
          : '';
        return `<div class="ex-pick-row" onclick='addExerciseToLog(${JSON.stringify(ex)})'>
          <div style="flex:1;min-width:0">
            <div class="ex-pick-name">${escapeHtml(ex.name)}${customTag}</div>
            <div class="ex-pick-equip">${escapeHtml(ex.equipment||'')}</div>
          </div>
          <span class="muscle-badge ${muscleBadgeClass(ex.muscleGroup)}">${escapeHtml(ex.muscleGroup)}</span>
          ${deleteBtn}
        </div>`;
      }).join('')
    : '<div class="empty-state" style="padding:24px"><p>No exercises match your search.</p></div>';
}

function addCustomExerciseToLog() {
  const name = (document.getElementById('custom-ex-name')?.value || '').trim();
  if (!name) { alert('Please enter an exercise name.'); return; }
  const mg  = document.getElementById('custom-ex-mg')?.value  || 'Back';
  const eq  = document.getElementById('custom-ex-eq')?.value  || 'Other';
  const type = document.getElementById('custom-ex-type')?.value || 'strength';
  const ex = { id: 'custom_ex_' + uid(), name, muscleGroup: mg, equipment: eq, type };
  if (!state.customExercises) state.customExercises = [];
  if (!state.customExercises.find(e => e.name.toLowerCase() === name.toLowerCase())) {
    state.customExercises.push(ex);
    saveLocalState();
  }
  addExerciseToLog(ex);
}

function deleteCustomExercise(id) {
  if (!confirm('Remove this custom exercise?')) return;
  state.customExercises = (state.customExercises || []).filter(e => e.id !== id);
  saveLocalState();
  _renderExPickerList();
}

// ---- Workout Summary Modal (read-only, from calendar chip) ----
function showWorkoutSummaryModal(workoutId) {
  const w = (state.workouts || []).find(x => x.id === workoutId);
  if (!w) return;

  const exRows = (w.exercises || []).map(ex => {
    let detail = '';
    if (ex.type === 'cardio') {
      detail = `Duration: ${ex.durationLabel || '0:00'}`;
    } else {
      const sets = (ex.sets || []);
      detail = sets.map((s, i) => `<div style="font-size:0.82rem;color:var(--text-muted)">Set ${i+1}: ${s.weight||'?'} ${s.unit||'lbs'} &times; ${s.reps||'?'} reps</div>`).join('');
    }
    return `<div style="padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <strong style="font-size:0.92rem">${escapeHtml(ex.name)}</strong>
        <span class="muscle-badge ${muscleBadgeClass(ex.muscleGroup)}">${escapeHtml(ex.muscleGroup)}</span>
        ${ex.equipment ? `<span style="font-size:0.72rem;color:var(--text-muted)">${escapeHtml(ex.equipment)}</span>` : ''}
      </div>
      ${detail}
    </div>`;
  }).join('');

  document.getElementById('modal-container').innerHTML = `
    <div class="modal-backdrop" onclick="closeModalOnBackdrop(event)">
      <div class="modal modal-lg">
        <div class="modal-header">
          <div>
            <h2>&#128170; Workout — ${formatDate(w.date + 'T12:00:00')}</h2>
            <div style="font-size:0.8rem;color:var(--text-muted);margin-top:2px">${ownerBadge(w.owner)} &nbsp;${(w.exercises||[]).length} exercise${(w.exercises||[]).length!==1?'s':''}</div>
          </div>
          <button class="modal-close" onclick="closeModal()">&#x2715;</button>
        </div>
        <div class="modal-body">
          ${exRows || '<p style="color:var(--text-muted)">No exercises recorded.</p>'}
          ${w.notes ? `<div style="margin-top:12px;padding:10px;background:var(--bg);border-radius:8px;font-size:0.85rem;color:var(--text-muted);font-style:italic">${escapeHtml(w.notes)}</div>` : ''}
          <div class="form-actions" style="margin-top:16px">
            <button class="btn-secondary" onclick="closeModal()">Close</button>
            <button class="btn-primary" onclick="closeModal();editWorkout('${w.id}');switchTab('workout')">Edit Workout</button>
          </div>
        </div>
      </div>
    </div>`;
}

// ========== THEME ==========
const THEMES = {
  default:  { bg:'#EEF4FB', card:'#FFFFFF', header:'#0D1B2A', accent:'#29B6F6', highlight:'#FFD600', text:'#0D1B2A' },
  forest:   { bg:'#E8F5E9', card:'#F1FAF2', header:'#1B3A2A', accent:'#43A047', highlight:'#AEEA00', text:'#1B2E1F' },
  sunset:   { bg:'#FFF7ED', card:'#FFFFFF', header:'#7C2D12', accent:'#F97316', highlight:'#FCD34D', text:'#1C0A00' },
  midnight: { bg:'#2D2B55', card:'#1E1B4B', header:'#13111E', accent:'#818CF8', highlight:'#A78BFA', text:'#E2E8F0' },
  rose:     { bg:'#FFF1F2', card:'#FFFFFF', header:'#881337', accent:'#F43F5E', highlight:'#FDA4AF', text:'#1C0007' },
  slate:    { bg:'#F1F5F9', card:'#FFFFFF', header:'#1E293B', accent:'#38BDF8', highlight:'#94A3B8', text:'#0F172A' },
};
function applyTheme(t) {
  const r = document.documentElement;
  r.style.setProperty('--bg',        t.bg);
  r.style.setProperty('--card-bg',   t.card);
  r.style.setProperty('--header-from', t.header);
  r.style.setProperty('--header-to',   adjustColor(t.header, 30));
  r.style.setProperty('--sky',        t.accent);
  r.style.setProperty('--sky-bg',     hexWithAlpha(t.accent, 0.15));
  r.style.setProperty('--yellow',     t.highlight);
  r.style.setProperty('--yellow-bg',  hexWithAlpha(t.highlight, 0.15));
  r.style.setProperty('--text',       t.text);
  r.style.setProperty('--border',     hexWithAlpha(t.text, 0.15));
}
function hexWithAlpha(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function adjustColor(hex, amount) {
  let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  r = Math.min(255, r + amount); g = Math.min(255, g + amount); b = Math.min(255, b + amount);
  return '#' + [r,g,b].map(x => x.toString(16).padStart(2,'0')).join('');
}
function applyThemeFromState() {
  const t = state.theme;
  if (t) applyTheme(t);
}
function setPresetTheme(name) {
  const t = THEMES[name];
  if (!t) return;
  state.theme = { ...t, preset: name };
  applyTheme(t);
  saveLocalState();
  // update pickers to match
  ['bg','card','header','accent','highlight','text'].forEach(k => {
    const el = document.getElementById('tc-' + k);
    if (el) el.value = t[k];
  });
  document.querySelectorAll('.theme-preset').forEach(b => b.classList.toggle('active', b.dataset.theme === name));
}

// ========== SETTINGS ==========
function openSettings() {
  const panel = document.getElementById('settings-panel');
  const userLabel = document.getElementById('settings-user-label');
  const keyInput = document.getElementById('api-key-input');
  const modelSel = document.getElementById('model-select');
  if (!panel) return;
  userLabel.textContent = state.currentUser || 'Not set';
  userLabel.style.color = state.currentUser === 'P' ? 'var(--p-dark)' : state.currentUser === 'M' ? 'var(--m-dark)' : 'var(--text-muted)';
  keyInput.value = state.geminiApiKey || '';
  modelSel.value = state.geminiModel || 'gemini-2.0-flash';
  const usdaEl = document.getElementById('usda-key-input');
  if (usdaEl) usdaEl.value = state.usdaApiKey || '';
  const g = state.dailyGoals || {};
  ['calories','protein','netcarbs','fat'].forEach(k => {
    const el = document.getElementById('goal-' + k);
    if (el) el.value = g[k === 'netcarbs' ? 'netCarbs' : k] || '';
  });
  const suEl = document.getElementById('sync-url-input');
  const skEl = document.getElementById('sync-key-input');
  if (suEl) suEl.value = state.supabaseUrl || '';
  if (skEl) skEl.value = state.supabaseKey || '';
  const tr = document.getElementById('sync-test-result');
  if (tr) { tr.textContent = ''; }
  // populate theme pickers
  const th = state.theme || THEMES.default;
  ['bg','card','header','accent','highlight','text'].forEach(k => {
    const el = document.getElementById('tc-' + k);
    if (el) el.value = th[k] || THEMES.default[k];
  });
  const activePreset = (state.theme && state.theme.preset) || 'default';
  document.querySelectorAll('.theme-preset').forEach(b => b.classList.toggle('active', b.dataset.theme === activePreset));
  panel.style.display = 'flex';
  panel.setAttribute('aria-hidden','false');
}
function closeSettings() {
  const panel = document.getElementById('settings-panel');
  if (panel) { panel.style.display = 'none'; panel.setAttribute('aria-hidden','true'); }
}
function saveSettings() {
  const k = document.getElementById('api-key-input');
  const m = document.getElementById('model-select');
  const su = document.getElementById('sync-url-input');
  const sk = document.getElementById('sync-key-input');
  if (k) state.geminiApiKey = k.value.trim();
  if (m) state.geminiModel = m.value || 'gemini-2.0-flash';
  const uk = document.getElementById('usda-key-input');
  if (uk) state.usdaApiKey = uk.value.trim();
  state.dailyGoals = {
    calories: parseInt(document.getElementById('goal-calories')?.value) || 0,
    protein:  parseInt(document.getElementById('goal-protein')?.value)  || 0,
    netCarbs: parseInt(document.getElementById('goal-netcarbs')?.value) || 0,
    fat:      parseInt(document.getElementById('goal-fat')?.value)      || 0
  };
  pushItem({ id: 'dailygoals', ...state.dailyGoals }, 'dailygoals');
  if (su) state.supabaseUrl = su.value.trim().replace(/\/rest\/v1\/?$/, '').replace(/\/$/, '');
  if (sk) state.supabaseKey = sk.value.trim();
  // save theme colors from pickers
  const customTheme = {};
  ['bg','card','header','accent','highlight','text'].forEach(k => {
    const el = document.getElementById('tc-' + k);
    if (el) customTheme[k] = el.value;
  });
  state.theme = { ...customTheme, preset: (state.theme && state.theme.preset) || 'default' };
  applyTheme(customTheme);
  saveLocalState();
  closeSettings();
  render();
  startSyncPolling(); // restart with new config
}
function toggleApiKeyVisibility() {
  const inp = document.getElementById('api-key-input');
  if (inp) inp.type = inp.type === 'password' ? 'text' : 'password';
}

// ========== SHARED HELPERS ==========
function ownerBadge(owner) {
  if (owner === 'P') return `<span class="badge badge-p">P</span>`;
  if (owner === 'M') return `<span class="badge badge-m">M</span>`;
  return `<span class="badge badge-shared">Shared</span>`;
}
function selectOwner(el, val) {
  const container = el.parentElement;
  container.querySelectorAll('.owner-opt').forEach(o => {
    o.className = 'owner-opt';
  });
  if (val === 'P') el.className = 'owner-opt sel-p';
  else if (val === 'M') el.className = 'owner-opt sel-m';
  else el.className = 'owner-opt sel-shared';
  const hiddenInput = container.nextElementSibling;
  if (hiddenInput && hiddenInput.type === 'hidden') hiddenInput.value = val;
}
function closeModal() {
  document.getElementById('modal-container').innerHTML = '';
}
function closeModalOnBackdrop(event) {
  if (event.target === event.currentTarget) closeModal();
}

// ========== PRINT ==========
function showPrintModal(tab) {
  const today = todayDateStr();
  // Default from: 30 days ago for workout, start of current week for meals
  const d30 = new Date(); d30.setDate(d30.getDate() - 30);
  const defaultFrom30 = toDateKey(d30);
  const weekStart = new Date(); weekStart.setDate(weekStart.getDate() - weekStart.getDay());
  const defaultFromWeek = toDateKey(weekStart);

  const needsDates = tab === 'workout' || tab === 'meals';
  const fromDefault = tab === 'workout' ? defaultFrom30 : defaultFromWeek;
  const toDefault   = today;

  const tabLabel = { workout:'Workout History', meals:'Meal Plan', todos:'To-Do List', grocery:'Grocery List' }[tab] || tab;

  const dateFields = needsDates ? `
    <div class="form-row">
      <div class="form-group">
        <label>From Date</label>
        <input type="date" id="print-from" value="${fromDefault}">
      </div>
      <div class="form-group">
        <label>To Date</label>
        <input type="date" id="print-to" value="${toDefault}">
      </div>
    </div>` : '';

  document.getElementById('modal-container').innerHTML = `
    <div class="modal-backdrop" onclick="closeModalOnBackdrop(event)">
      <div class="modal" style="max-width:400px">
        <div class="modal-header">
          <h2>&#128424; Print ${escapeHtml(tabLabel)}</h2>
          <button class="modal-close" onclick="closeModal()">&#x2715;</button>
        </div>
        <div class="modal-body">
          ${dateFields}
          <div class="form-actions">
            <button class="btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn-primary" onclick="doPrint('${tab}', ${needsDates ? "document.getElementById('print-from').value, document.getElementById('print-to').value" : "null, null"})">&#128424; Print</button>
          </div>
        </div>
      </div>
    </div>`;
}

  closeModal();
  const now = new Date();
  const printedAt = now.toLocaleDateString(undefined, { month:'long', day:'numeric', year:'numeric' }) + ' at ' + now.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
  const BASE_STYLES = `

      .badge-p { background: #E1F5FE; color: #0277BD; border-color: #0277BD; }
      .badge-m { background: #FFFDE7; color: #F57F17; border-color: #F57F17; }
      .badge-shared { background: #DCEEFB; color: #1565C0; border-color: #1565C0; }
      .badge-high { background: #FEE2E2; color: #991B1B; border-color: #991B1B; }
      .badge-medium { background: #FEF3C7; color: #92400E; border-color: #92400E; }
      .badge-low { background: #F1F5F9; color: #475569; border-color: #475569; }
      .workout-entry { margin-bottom: 28px; page-break-inside: avoid; }
      .exercise-name { font-weight: 700; margin: 8px 0 2px; }
      .set-line { margin-left: 16px; font-size: 0.88rem; color: #333; }
      .notes-line { font-style: italic; color: #555; margin-top: 6px; font-size: 0.85rem; }
      .writing-space { border-bottom: 1px dashed #bbb; margin: 6px 0; height: 28px; }
      .meal-day { margin-bottom: 20px; page-break-inside: avoid; }
      .meal-slot-row { display: flex; gap: 10px; align-items: baseline; margin: 4px 0; padding: 4px 0; border-bottom: 1px solid #ddd; }
      .meal-slot-label { font-weight: 700; min-width: 80px; font-size: 0.85rem; color: #555; }
      .meal-slot-name { flex: 1; }
      .meal-slot-cal { color: #555; font-size: 0.82rem; }
      .meal-slot-blank { flex: 1; border-bottom: 1px solid #999; min-height: 18px; }
      .todo-item { display: flex; gap: 10px; align-items: baseline; margin: 6px 0; padding: 5px 0; border-bottom: 1px solid #eee; }
      .checkbox { display: inline-block; width: 14px; height: 14px; border: 1.5px solid #555; flex-shrink: 0; margin-top: 2px; }
      .todo-title { flex: 1; font-size: 0.92rem; }
      .todo-done { text-decoration: line-through; color: #888; }
      .todo-meta { font-size: 0.75rem; color: #777; }
      .section-header { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #777; margin: 16px 0 6px; border-bottom: 2px solid #ccc; padding-bottom: 3px; }
      .groc-item { display: flex; gap: 10px; align-items: baseline; margin: 5px 0; padding: 4px 0; border-bottom: 1px solid #eee; }
      .groc-item.bought { color: #999; text-decoration: line-through; }
      .groc-name { flex: 1; font-size: 0.92rem; }
      .groc-qty { font-size: 0.82rem; color: #666; }
      .groc-notes { font-size: 0.78rem; color: #888; font-style: italic; }
      .footer { margin-top: 32px; padding-top: 10px; border-top: 1px solid #ccc; font-size: 0.72rem; color: #888; text-align: center; }
      @media print { body { padding: 12px 18px; } }
    </style>`;

  let bodyHtml = '';

  if (tab === 'workout') {
    const fromD = from || '1900-01-01';
    const toD   = to   || '9999-12-31';
    const filtered = (state.workouts || [])
      .filter(w => w.date >= fromD && w.date <= toD)
      .slice().sort((a, b) => b.date.localeCompare(a.date));

    const fromLabel = from ? new Date(from + 'T12:00:00').toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' }) : '';
    const toLabel   = to   ? new Date(to   + 'T12:00:00').toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' }) : '';

    bodyHtml = `<h1>&#128170; Workout History</h1>
      <div class="subtitle">${fromLabel} &ndash; ${toLabel} &bull; ${filtered.length} workout${filtered.length !== 1 ? 's' : ''}</div>`;

    if (!filtered.length) {
      bodyHtml += `<p style="color:#888;font-style:italic">No workouts found in this date range.</p>`;
    } else {
      filtered.forEach(w => {
        const ownerBadgeHtml = w.owner === 'P' ? '<span class="badge badge-p">P</span>'
          : w.owner === 'M' ? '<span class="badge badge-m">M</span>'
          : '<span class="badge badge-shared">Shared</span>';
        const dateLabel = new Date(w.date + 'T12:00:00').toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric', year:'numeric' });
        bodyHtml += `<div class="workout-entry"><h2>${dateLabel} ${ownerBadgeHtml}</h2>`;
        (w.exercises || []).forEach(ex => {
          bodyHtml += `<div class="exercise-name">${ex.name} <span style="font-weight:400;font-size:0.82rem;color:#555">(${ex.muscleGroup})</span></div>`;
          if (ex.type === 'cardio') {
            const mins = Math.floor((ex.duration || 0) / 60);
            const secs = ((ex.duration || 0) % 60).toString().padStart(2, '0');
            bodyHtml += `<div class="set-line">Duration: ${mins}:${secs}</div>`;
          } else if (ex.type === 'timed') {
            (ex.sets || []).forEach((s, i) => {
              const sm = Math.floor((s.duration || 0) / 60);
              const ss = ((s.duration || 0) % 60).toString().padStart(2, '0');
              bodyHtml += `<div class="set-line">Set ${i + 1}: ${sm}:${ss}</div>`;
            });
          } else {
            (ex.sets || []).forEach((s, i) => {
              bodyHtml += `<div class="set-line">Set ${i + 1}: ${s.weight || '?'} ${s.unit || 'lbs'} &times; ${s.reps || '?'} reps</div>`;
            });
          }
          if (ex.timeSpent) bodyHtml += `<div class="set-line" style="color:#777">Time: ${ex.timeSpent}</div>`;
        });
        if (w.notes) bodyHtml += `<div class="notes-line">Notes: ${w.notes}</div>`;
        bodyHtml += `<div class="writing-space"></div><div class="writing-space"></div></div>`;
      });
    }

  } else if (tab === 'meals') {
    const fromD = from || '1900-01-01';
    const toD   = to   || '9999-12-31';
    const SLOT_LBLS = { breakfast: 'Breakfast', lunch: 'Lunch', dinner: 'Dinner', snack: 'Snack' };
    const SLOT_KEYS = ['breakfast', 'lunch', 'dinner', 'snack'];

    const fromLabel = from ? new Date(from + 'T12:00:00').toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' }) : '';
    const toLabel   = to   ? new Date(to   + 'T12:00:00').toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' }) : '';

    bodyHtml = `<h1>&#128197; Meal Plan</h1><div class="subtitle">${fromLabel} &ndash; ${toLabel}</div>`;

    const allKeys = Object.keys(state.mealPlan || {}).filter(k => k >= fromD && k <= toD).sort();
    if (!allKeys.length) {
      bodyHtml += `<p style="color:#888;font-style:italic">No meals planned in this date range.</p>`;
    } else {
      allKeys.forEach(key => {
        const meals = state.mealPlan[key] || {};
        const dateLabel = new Date(key + 'T12:00:00').toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric', year:'numeric' });
        bodyHtml += `<div class="meal-day"><h2>${dateLabel}</h2>`;
        SLOT_KEYS.forEach(slot => {
          const meal = meals[slot];
          bodyHtml += `<div class="meal-slot-row">
            <span class="meal-slot-label">${SLOT_LBLS[slot]}</span>`;
          if (meal) {
            bodyHtml += `<span class="meal-slot-name">${meal.name}</span>`;
            if (meal.macros && meal.macros.calories) bodyHtml += `<span class="meal-slot-cal">${meal.macros.calories} kcal</span>`;
          } else {
            bodyHtml += `<span class="meal-slot-blank"></span>`;
          }
          bodyHtml += `</div>`;
        });
        bodyHtml += `</div>`;
      });
    }

  } else if (tab === 'todos') {
    const user = state.currentUser || 'P';
    const todayLabel = new Date().toLocaleDateString(undefined, { month:'long', day:'numeric', year:'numeric' });
    bodyHtml = `<h1>&#9989; To-Do List</h1><div class="subtitle">${todayLabel} &bull; ${user === 'P' ? 'P' : 'M'}'s view</div>`;

    const allTodos = (state.todos || []).slice();
    const active = allTodos.filter(t => !t.done);
    const done   = allTodos.filter(t => t.done);
    const priorityOrder = { high: 0, medium: 1, low: 2 };
    active.sort((a, b) => (priorityOrder[a.priority] || 2) - (priorityOrder[b.priority] || 2));

    const renderTodoItem = (t, strikethrough) => {
      const priorityBadge = t.priority === 'high' ? '<span class="badge badge-high">High</span>'
        : t.priority === 'medium' ? '<span class="badge badge-medium">Med</span>'
        : '<span class="badge badge-low">Low</span>';
      const duePart = t.dueDate ? ` &bull; Due: ${new Date(t.dueDate).toLocaleDateString(undefined, { month:'short', day:'numeric' })}` : '';
      const assigneePart = t.assignee && t.assignee !== user ? ` &bull; ${t.assignee}` : '';
      return `<div class="todo-item">
        <span class="checkbox"></span>
        <div style="flex:1">
          <span class="todo-title ${strikethrough ? 'todo-done' : ''}">${t.title}</span>
          <span class="todo-meta"> ${priorityBadge}${duePart}${assigneePart}</span>
        </div>
      </div>`;
    };

    if (active.length) {
      bodyHtml += `<div class="section-header">Active (${active.length})</div>`;
      active.forEach(t => { bodyHtml += renderTodoItem(t, false); });
    }
    if (done.length) {
      bodyHtml += `<div class="section-header" style="margin-top:20px">Completed (${done.length})</div>`;
      done.forEach(t => { bodyHtml += renderTodoItem(t, true); });
    }
    if (!active.length && !done.length) {
      bodyHtml += `<p style="color:#888;font-style:italic">No to-do items found.</p>`;
    }

  } else if (tab === 'grocery') {
    const todayLabel = new Date().toLocaleDateString(undefined, { month:'long', day:'numeric', year:'numeric' });
    bodyHtml = `<h1>&#128722; Grocery List</h1><div class="subtitle">${todayLabel}</div>`;

    const items = state.groceryItems || [];
    const unchecked = items.filter(g => !g.purchased);
    const checked   = items.filter(g => g.purchased);

    const renderGrocItem = (g, bought) => {
      const qty = g.quantity ? `${g.quantity}${g.unit ? ' ' + g.unit : ''}` : '';
      const notesPart = g.notes ? ` &mdash; <em>${g.notes}</em>` : '';
      return `<div class="groc-item ${bought ? 'bought' : ''}">
        <span class="checkbox" style="${bought ? 'opacity:0.4' : ''}"></span>
        <span class="groc-name">${g.name}</span>
        ${qty ? `<span class="groc-qty">${qty}</span>` : ''}
        ${notesPart ? `<span class="groc-notes">${notesPart}</span>` : ''}
      </div>`;
    };

    // Group unchecked by store
    const storeMap = {};
    unchecked.forEach(g => {
      const s = g.store || '';
      if (!storeMap[s]) storeMap[s] = [];
      storeMap[s].push(g);
    });
    const stores = Object.keys(storeMap).sort();

    if (!items.length) {
      bodyHtml += `<p style="color:#888;font-style:italic">Grocery list is empty.</p>`;
    } else {
      if (stores.length > 1 || (stores.length === 1 && stores[0])) {
        stores.forEach(store => {
          if (store) bodyHtml += `<div class="section-header">&#127978; ${store}</div>`;
          else bodyHtml += `<div class="section-header">Other</div>`;
          storeMap[store].forEach(g => { bodyHtml += renderGrocItem(g, false); });
        });
      } else {
        if (unchecked.length) {
          bodyHtml += `<div class="section-header">Items to Get (${unchecked.length})</div>`;
          unchecked.forEach(g => { bodyHtml += renderGrocItem(g, false); });
        }
      }
      if (checked.length) {
        bodyHtml += `<div class="section-header" style="margin-top:20px;color:#aaa">Already Purchased (${checked.length})</div>`;
        checked.forEach(g => { bodyHtml += renderGrocItem(g, true); });
      }
    }
  }

  const fullHtml = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Home Hub Print</title>${BASE_STYLES}</head><body>
    ${bodyHtml}
    <div class="footer">Printed from Home Hub &bull; ${printedAt}</div>
  </body></html>`;

  const pw = window.open('', '_blank', 'width=800,height=900');
  if (!pw) { alert('Please allow pop-ups to print.'); return; }
  pw.document.write(fullHtml);
  pw.document.close();
  pw.focus();
  pw.print();
}

// ========== INIT ==========
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
loadState();
applyThemeFromState();
if (!state.currentUser) {
  document.getElementById('who-overlay').style.display = 'flex';
} else {
  updateUserButtons();
}
render();
if (isSyncEnabled()) startSyncPolling();
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && isSyncEnabled()) syncFromRemote();
});

// Wire settings panel buttons via addEventListener (most reliable)
document.getElementById('settings-close-btn').addEventListener('click', closeSettings);
document.getElementById('settings-cancel-btn').addEventListener('click', closeSettings);
document.getElementById('settings-save-btn').addEventListener('click', saveSettings);
document.getElementById('theme-presets').addEventListener('click', e => {
  const btn = e.target.closest('.theme-preset');
  if (btn) setPresetTheme(btn.dataset.theme);
});
document.getElementById('show-hide-key-btn').addEventListener('click', toggleApiKeyVisibility);
document.getElementById('settings-panel').addEventListener('click', function(e) {
  if (e.target === this) closeSettings();
});
document.getElementById('show-hide-sync-btn').addEventListener('click', function() {
  const inp = document.getElementById('sync-key-input');
  if (inp) inp.type = inp.type === 'password' ? 'text' : 'password';
});
document.getElementById('show-hide-usda-btn').addEventListener('click', function() {
  const inp = document.getElementById('usda-key-input');
  if (inp) inp.type = inp.type === 'password' ? 'text' : 'password';
});
document.getElementById('test-sync-btn').addEventListener('click', async function() {
  const url = (document.getElementById('sync-url-input').value || '').trim().replace(/\/rest\/v1\/?$/, '').replace(/\/$/, '');
  const key = (document.getElementById('sync-key-input').value || '').trim();
  const el = document.getElementById('sync-test-result');
  if (!url || !key) { el.textContent = '⚠️ Enter URL and key first'; el.style.color = 'var(--yellow)'; return; }
  el.textContent = 'Testing...'; el.style.color = 'var(--text-muted)';
  const result = await testSyncConnection(url, key);
  el.textContent = (result.ok ? '✓ ' : '✗ ') + result.message;
  el.style.color = result.ok ? '#22C55E' : '#EF4444';
});
// Also keep the header settings button wired both ways:
const settingsBtn = document.querySelector('.settings-btn');
if (settingsBtn) settingsBtn.addEventListener('click', openSettings);
</script>
</body>
